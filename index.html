/* ───────────── 記帳確認卡片 ───────────── */

let E = null;

function openEntry(init) {
  const prev = init.id ? (S.txs.find(t => t.id === init.id) || findHistoryTx(init.id) || init) : null;
  E = {
    id: init.id || null, prev: prev ? Object.assign({}, prev) : null,
    type: init.type || '支出', amount: init.amount || '', note: init.note || '',
    categoryId: init.categoryId || '', from: init.from || '', to: init.to || '',
    time: init.time || Date.now(), symbol: init.symbol || '', shares: init.shares == null ? '' : init.shares,
    keyword: init.keyword || '', unmatched: !!init.unmatched, confirmDelete: false
  };
  fillDefaults();
  renderEntry();
  if (!E.amount) setTimeout(() => { const i = $('#eAmount'); if (i) i.focus(); }, 300);
}

function fillDefaults() {
  const kinds = kindsForType(E.type);
  const c = cat(E.categoryId);
  if (!c || !kinds.includes(c.kind)) {
    const first = activeCats(kinds)[0];
    E.categoryId = E.type === '支出' ? '' : (first ? first.id : '');
  }
  const isUsable = (id, types) => { const a = acc(id); return a && !a.disabled && types.includes(a.type); };
  if (E.type === '支出') {
    // 沒有關鍵字記憶時一律預設現金，付款方式只由關鍵字學習改變，比較好預測
    if (!isUsable(E.from, ['現金', '銀行', '信用卡'])) E.from = (activeAccounts('現金')[0] || activeAccounts()[0] || {}).id;
    E.to = '';
  } else if (E.type === '收入') {
    if (!isUsable(E.to, ['現金', '銀行', '理財'])) E.to = (activeAccounts('銀行')[0] || activeAccounts()[0] || {}).id;
    E.from = '';
  } else {
    if (!acc(E.from)) E.from = (activeAccounts('銀行')[0] || activeAccounts()[0] || {}).id;
    if (!acc(E.to) || E.to === E.from) E.to = (activeAccounts().find(a => a.id !== E.from) || {}).id;
  }
}

function budgetInfo() {
  if (E.type !== '支出') return null;
  const c = cat(E.categoryId);
  if (!c) return null;
  const cid = cycleFor(E.time);
  const bud = budgetOf(cid)[c.group];
  if (bud == null) return { group: c.group, none: true, cid };
  let spent = spentByGroup(cid)[c.group] || 0;
  const p = E.prev;
  if (p && p.type === '支出' && p.cycleId === cid && cat(p.categoryId) && cat(p.categoryId).group === c.group) spent -= p.amount;
  const remain = bud - spent;
  return { group: c.group, remain, after: remain - (Number(E.amount) || 0), cid };
}

function budgetLineHtml() {
  const info = budgetInfo();
  if (!info) return '';
  if (info.none) return '<div class="budget-line">' + esc(info.group) + ' 本期未設定預算</div>';
  const over = info.after < 0;
  return '<div class="budget-line' + (over ? ' over' : '') + '">' + esc(info.group) + ' 本期剩 <b class="num">' + money(info.remain) + '</b>，記下後 ' +
    (over ? '<b class="warn num">超支 ' + money(-info.after) + '</b>' : '<b class="num">' + money(info.after) + '</b>') + '</div>';
}

function renderEntry() {
  const isEdit = !!E.prev;
  const kinds = kindsForType(E.type);
  const c = cat(E.categoryId);
  const groups = groupsOf(kinds);
  const curGroup = c ? c.group : E.pickGroup || null;
  let h = (isEdit ? '<h3>修改紀錄</h3>' : '') +
    '<div class="seg">' + ['支出', '收入', '轉帳'].map(t => '<button type="button" data-act="type" data-v="' + t + '" class="' + (E.type === t ? 'on' : '') + '">' + t + '</button>').join('') + '</div>' +
    '<div class="amount-row"><span class="cur">$</span><input class="amount-input num" id="eAmount" type="text" inputmode="numeric" placeholder="0" value="' + esc(E.amount) + '" aria-label="金額"></div>' +
    '<input class="note-input" id="eNote" type="text" placeholder="備註，例如：午餐" value="' + esc(E.note) + '" aria-label="備註">';

  h += '<div class="field"><div class="label">分類' + (E.unmatched && !c ? '　<span class="warn">第一次看到「' + esc(E.keyword) + '」，選好後下次會記住</span>' : '') + '</div>' +
    '<div class="chips wrap">' + groups.map(g => '<button type="button" class="chip' + (g === curGroup ? ' on' : '') + '" data-act="group" data-v="' + esc(g) + '">' + esc(g) + '</button>').join('') + '</div>';
  if (curGroup) {
    const subs = activeCats(kinds).filter(x => x.group === curGroup);
    h += '<div class="chips wrap sub-chips">' + subs.map(x => '<button type="button" class="chip' + (x.id === E.categoryId ? ' on' : '') + '" data-act="cat" data-v="' + esc(x.id) + '">' + esc(x.name) + '</button>').join('') + '</div>';
  }
  h += '</div>';

  if (E.type === '支出') {
    const a = acc(E.from);
    const method = a ? a.type : '';
    const methods = [['現金', '現金'], ['信用卡', '信用卡'], ['銀行', '帳戶扣款']].filter(m => activeAccounts(m[0]).length);
    h += '<div class="field"><div class="label">付款方式</div><div class="chips wrap">' +
      methods.map(m => '<button type="button" class="chip' + (method === m[0] ? ' on' : '') + '" data-act="method" data-v="' + m[0] + '">' + m[1] + '</button>').join('') + '</div>';
    const same = activeAccounts(method);
    if (same.length > 1) h += '<select id="eFrom" style="margin-top:8px">' + same.map(x => '<option value="' + esc(x.id) + '"' + (x.id === E.from ? ' selected' : '') + '>' + esc(x.name) + '</option>').join('') + '</select>';
    h += '</div>';
  } else if (E.type === '收入') {
    h += '<div class="field"><div class="label">入帳帳戶</div><div class="chips wrap">' +
      activeAccounts().filter(a => a.type !== '信用卡').map(a => '<button type="button" class="chip' + (a.id === E.to ? ' on' : '') + '" data-act="to" data-v="' + esc(a.id) + '">' + esc(a.name) + '</button>').join('') + '</div></div>';
  } else {
    const opts = sel => activeAccounts().map(a => '<option value="' + esc(a.id) + '"' + (a.id === sel ? ' selected' : '') + '>' + esc(a.name) + '（' + a.type + '）</option>').join('');
    h += '<div class="field"><div class="inline"><div><div class="label">從</div><select id="eFrom">' + opts(E.from) + '</select></div>' +
      '<div><div class="label">到</div><select id="eTo">' + opts(E.to) + '</select></div></div></div>';
    const toAcc = acc(E.to);
    if ((c && c.kind === '資產配置') || (toAcc && toAcc.type === '理財')) {
      h += '<div class="field"><div class="inline"><div><div class="label">標的（ETF 代號）</div><input id="eSymbol" type="text" value="' + esc(E.symbol) + '" placeholder="0050"></div>' +
        '<div><div class="label">成交股數</div><input id="eShares" type="number" inputmode="decimal" value="' + esc(E.shares) + '" placeholder="對帳單上的股數"></div></div></div>';
    }
  }

  // 日期：今天／昨天／前天一鍵選，其他日期用月曆
  const selKey = dayKey(new Date(E.time));
  const quick = [0, -1, -2].map(n => dayKey(addDays(new Date(), n)));
  const td = new Date(E.time);
  h += '<div class="field"><div class="label">日期</div><div class="chips wrap">' +
    quick.map((k, i) => '<button type="button" class="chip' + (k === selKey ? ' on' : '') + '" data-act="pick" data-v="' + k + '">' + ['今天', '昨天', '前天'][i] + '</button>').join('') +
    '<button type="button" class="chip' + (!quick.includes(selKey) ? ' on' : ' ghost') + '" data-act="cal">' + (!quick.includes(selKey) ? dayLabel(selKey) : '其他日期') + '<span class="caret">' + icon('caret-down') + '</span></button></div>' +
    (E.showCal ? pickerHtml(selKey, E.calAnchor || td, recordedDays()) : '') +
    '<div class="time-row"><span>時間</span><input id="eTime" type="time" value="' + pad(td.getHours()) + ':' + pad(td.getMinutes()) + '" aria-label="時間"></div></div>' +
    '<div id="eBudget">' + budgetLineHtml() + '</div>' +
    '<div class="actions">' +
    (isEdit ? '<button class="btn danger" type="button" data-act="del">' + (E.confirmDelete ? '確定刪除？' : '刪除') + '</button>' : '') +
    '<button class="btn" type="button" data-act="cancel">取消</button>' +
    '<button class="btn primary" type="button" data-act="save">' + (isEdit ? '儲存' : '記下') + '</button></div>';

  const s = openSheet(h, entryAction);
  S.isDirty = () => !E.prev && !!(String(E.amount) || E.note.trim());
  $('#eAmount').oninput = e => { E.amount = e.target.value.replace(/[^\d.]/g, ''); $('#eBudget').innerHTML = budgetLineHtml(); };
  $('#eNote').oninput = e => { E.note = e.target.value; };
  $('#eTime').onchange = e => {
    const [hh, mm] = e.target.value.split(':').map(Number);
    if (isNaN(hh)) return;
    const d = new Date(E.time);
    E.time = new Date(d.getFullYear(), d.getMonth(), d.getDate(), hh, mm || 0).getTime();
  };
  if ($('#eFrom')) $('#eFrom').onchange = e => { E.from = e.target.value; if (E.type === '轉帳') renderEntry(); };
  if ($('#eTo')) $('#eTo').onchange = e => { E.to = e.target.value; renderEntry(); };
  if ($('#eSymbol')) $('#eSymbol').oninput = e => { E.symbol = e.target.value.trim(); };
  if ($('#eShares')) $('#eShares').oninput = e => { E.shares = e.target.value; };
  return s;
}

function entryAction(act, v) {
  if (act === 'type') { E.type = v; fillDefaults(); renderEntry(); }
  else if (act === 'group') {
    E.pickGroup = v;
    const first = activeCats(kindsForType(E.type)).find(x => x.group === v);
    E.categoryId = first ? first.id : '';
    renderEntry();
  }
  else if (act === 'cat') { E.categoryId = v; renderEntry(); }
  else if (act === 'method') {
    const last = acc(S.pref.lastFrom);
    E.from = (last && last.type === v && !last.disabled ? last : activeAccounts(v)[0] || {}).id;
    renderEntry();
  }
  else if (act === 'to') { E.to = v; renderEntry(); }
  else if (act === 'cal') { E.showCal = !E.showCal; E.calAnchor = new Date(E.time); renderEntry(); }
  else if (act === 'pnav') { const a = E.calAnchor || new Date(E.time); E.calAnchor = new Date(a.getFullYear(), a.getMonth() + Number(v), 1); renderEntry(); }
  else if (act === 'pick') {
    const d = keyDate(v);
    const t = new Date(E.time);
    E.time = new Date(d.getFullYear(), d.getMonth(), d.getDate(), t.getHours(), t.getMinutes()).getTime();
    E.showCal = false;
    renderEntry();
  }
  else if (act === 'cancel') closeSheet();
  else if (act === 'del') {
    if (!E.confirmDelete) { E.confirmDelete = true; renderEntry(); return; }
    const gone = E.prev;
    removeTx(gone);
    closeSheet();
    toast('已刪除：' + (gone.note || catLabel(cat(gone.categoryId))) + ' ' + money(gone.amount), () => {
      commitTx(Object.assign({}, gone, { void: false }), null, null);
      toast('已復原');
    });
  }
  else if (act === 'save') saveEntry();
}

function saveEntry() {
  const amount = Math.round(Number(E.amount));
  if (!(amount > 0)) { toast('請輸入金額'); return; }
  if (!E.categoryId) { toast('請選擇分類'); return; }
  if (E.type !== '收入' && !E.from) { toast('請選擇付款帳戶'); return; }
  if (E.type !== '支出' && !E.to) { toast('請選擇入帳帳戶'); return; }
  if (E.type === '轉帳' && E.from === E.to) { toast('轉出與轉入不能是同一個帳戶'); return; }
  const tx = {
    id: E.id || newId(), time: E.time, type: E.type, amount: amount, categoryId: E.categoryId,
    from: E.type === '收入' ? '' : E.from, to: E.type === '支出' ? '' : E.to,
    note: E.note.trim(), symbol: E.type === '轉帳' ? E.symbol : '',
    shares: E.type === '轉帳' && E.shares !== '' ? Number(E.shares) : null,
    void: false, created: E.prev ? E.prev.created : Date.now()
  };
  if (E.noticeId) tx.noticeId = E.noticeId;
  const c = cat(tx.categoryId);
  const learn = E.keyword ? { keyword: E.keyword, categoryId: tx.categoryId, accountId: tx.type === '支出' ? tx.from : tx.type === '收入' ? tx.to : '' } : null;

  if (!E.prev && tx.type === '收入' && c && c.name === '薪資') {
    closeSheet();
    setTimeout(() => openPayday(tx, learn), 250);
    return;
  }
  const info = budgetInfo();
  if (tx.type === '支出') { S.pref.lastFrom = tx.from; savePref(); }
  const prev = E.prev;
  closeSheet();
  commitTx(tx, prev, learn);
  const onDay = dayKey(new Date(tx.time)) !== dayKey(new Date()) ? '（' + dayLabel(dayKey(new Date(tx.time))) + '）' : '';
  toast((prev ? '已更新：' : '已記下：') + (tx.note || catLabel(c)) + ' ' + money(amount) + onDay, () => {
    // 復原：新增的就刪掉；修改的就改回原本的內容
    if (prev) commitTx(Object.assign({}, prev), Object.assign({}, S.txs.find(t => t.id === tx.id) || tx), null);
    else removeTx(S.txs.find(t => t.id === tx.id) || tx);
    toast('已復原');
  });
  const shown = prev ? 0 : cheerFor(tx, c, info);
  if (info && !info.none && info.after < 0) setTimeout(() => openOverspend(info.group, -info.after, info.cid), shown ? 1150 : 400);
}

/* ───────────── 記下的回饋：P5 風格的斜橫幅掃過畫面（約 1 秒，不擋操作） ───────────── */

const CHEER_LINES = {
  伙食: ['吃飽才有力氣', '好好吃飯，很重要', '今天也有好好吃飯'], 交通: ['一路順風', '出門平安'], 日用品: ['生活補給完成'],
  約會: ['約會愉快', '值得的'], 聚會: ['玩得開心', '朋友最重要'], 購物: ['買了就要好好用'], 醫療: ['身體最重要，早日康復'],
  學習: ['投資自己，最划算'], 訂閱: ['好好享受'], 孝親費: ['孝順爸媽，帥'], 雜支: ['記下來就不會忘'], 禮物: ['送禮的人最開心'], 娛樂: ['放鬆一下'], 禮金: ['人情也是財富']
};
const pickOne = list => list[Math.floor(Math.random() * list.length)];

/** 連續記帳天數（今天往回數，每天至少一筆） */
function recordStreak() {
  const days = new Set(S.txs.filter(t => !t.void).map(t => dayKey(new Date(t.time))));
  let n = 0;
  for (let d = new Date(); days.has(dayKey(d)); d.setDate(d.getDate() - 1)) n++;
  return n;
}

function cheerFor(tx, c, info) {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches || !Element.prototype.animate) return 0;
  let kind = 'save', title = '記下了', sub = '';
  if (tx.type === '收入') { kind = 'gold'; title = '進帳！'; sub = '+' + money(tx.amount) + '，寶庫又滿了一點'; }
  else if (tx.type === '轉帳') {
    const to = acc(tx.to);
    if (to && to.type === '理財') { kind = 'gold'; title = '存進寶庫'; sub = (tx.symbol || to.name) + (tx.shares > 0 ? ' +' + tx.shares + ' 股' : ' +' + money(tx.amount)); }
    else { title = '搬好了'; sub = accName(tx.from) + ' → ' + accName(tx.to) + ' ' + money(tx.amount); }
  } else if (info && !info.none && info.after < 0) {
    kind = 'over'; title = '超支！'; sub = info.group + '超過 ' + money(-info.after) + '，等一下可以挪預算';
  } else {
    const line = c && (CHEER_LINES[c.name] || CHEER_LINES[c.group]);
    sub = (line ? pickOne(line) : '記帳成功，繼續保持') + (info && !info.none ? '・' + info.group + '還剩 ' + money(info.after) : '');
  }
  const streak = recordStreak();
  cheer(kind, title, sub, streak >= 2 ? '連續記帳 ' + streak + ' 天' : '');
  return 1;
}

function cheer(kind, title, sub, extra) {
  const old = $('#cheer');
  if (old) old.remove();
  const el = document.createElement('div');
  el.id = 'cheer';
  el.className = 'cheer ' + kind;
  el.setAttribute('aria-hidden', 'true');
  el.innerHTML = '<div class="band">' + ransom(title, false) + '<div class="s">' + esc(sub) + '</div>' + (extra ? '<div class="x">' + esc(extra) + '</div>' : '') + '</div>' +
    (kind === 'gold' ? '<div class="bits">' + '<i></i>'.repeat(8) + '</div>' : '');
  document.body.append(el);
  const band = $('.band', el);
  const ease = 'cubic-bezier(.2,0,0,1)';
  band.animate([{ transform: 'translateX(-115%) rotate(-6deg) skewX(-12deg)' }, { transform: 'translateX(4%) rotate(-6deg) skewX(-12deg)', offset: .7 }, { transform: 'translateX(0) rotate(-6deg) skewX(0)' }], { duration: 260, easing: ease, fill: 'both' });
  $$('.rn', el).forEach((r, i) => r.animate([{ opacity: 0, transform: 'rotate(' + (r.style.getPropertyValue('--r')) + ') scale(1.9)' }, { opacity: 1, transform: 'rotate(' + (r.style.getPropertyValue('--r')) + ') translateY(' + r.style.getPropertyValue('--y') + ')' }],
    { duration: 220, delay: 120 + i * 40, easing: 'cubic-bezier(.175,.885,.32,1.275)', fill: 'both' }));
  $$('.bits i', el).forEach((b, i) => {
    const a = i / 8 * Math.PI * 2 + .4, d = 120 + (i % 3) * 36;
    b.animate([{ transform: 'translate(-50%,-50%) scale(0) rotate(0)' }, { transform: 'translate(calc(-50% + ' + Math.cos(a) * d + 'px), calc(-50% + ' + Math.sin(a) * d * .6 + 'px)) scale(1) rotate(' + (140 + i * 25) + 'deg)', offset: .6 },
      { transform: 'translate(calc(-50% + ' + Math.cos(a) * (d + 20) + 'px), calc(-50% + ' + Math.sin(a) * (d + 20) * .6 + 'px)) scale(0) rotate(' + (200 + i * 25) + 'deg)' }], { duration: 900, delay: 150 + i * 15, easing: ease, fill: 'both' });
  });
  const out = band.animate([{ transform: 'translateX(0) rotate(-6deg)', opacity: 1 }, { transform: 'translateX(120%) rotate(-6deg) skewX(-12deg)', opacity: 1 }], { duration: 200, delay: 1000, easing: 'cubic-bezier(.3,0,1,1)', fill: 'both' });
  out.finished.then(() => el.remove(), () => el.remove());
  setTimeout(() => el.remove(), 1800);
}

/* ───────────── 超支挪用 ───────────── */

function openOverspend(group, over, cid) {
  const b = budgetOf(cid);
  const spent = spentByGroup(cid);
  const sources = expenseGroups().filter(g => g !== group && (b[g] || 0) - (spent[g] || 0) > 0)
    .map(g => ({ g, left: (b[g] || 0) - (spent[g] || 0) }));
  const un = unallocated(cid);
  if (un > 0) sources.unshift({ g: '', left: un, label: '未分配' });
  if (!sources.length) { toast(group + ' 超支 ' + money(over) + '，其他分類也沒有剩餘預算'); return; }
  let pick = sources[0];
  const draw = () => {
    const h = '<h3>' + esc(group) + ' 超支 <span class="warn">' + money(over) + '</span></h3>' +
      '<div class="small muted">要從其他還有剩的預算挪過來嗎？</div>' +
      '<div class="field"><div class="label">從哪裡挪</div><div class="chips wrap">' +
      sources.map((s, i) => '<button type="button" class="chip' + (s === pick ? ' on' : '') + '" data-act="pick" data-v="' + i + '">' + esc(s.label || s.g) + '（剩 ' + money(s.left) + '）</button>').join('') + '</div></div>' +
      '<div class="field"><label for="mvAmt">挪用金額</label><input id="mvAmt" type="number" inputmode="numeric" value="' + Math.min(over, pick.left) + '"></div>' +
      '<div class="actions"><button class="btn" type="button" data-act="cancel">先不用</button><button class="btn primary" type="button" data-act="ok">挪用</button></div>';
    openSheet(h, async (act, v, btn) => {
      if (act === 'pick') { pick = sources[Number(v)]; draw(); }
      else if (act === 'cancel') closeSheet();
      else if (act === 'ok') {
        const amt = Math.round(Number($('#mvAmt').value));
        if (!(amt > 0)) { toast('請輸入金額'); return; }
        busy(btn, true);
        try {
          let res;
          if (pick.g) res = await call('api_moveBudget', cid, pick.g, group, amt);
          else res = await call('api_setBudgets', cid, Object.assign({}, budgetOf(cid), { [group]: (budgetOf(cid)[group] || 0) + amt }));
          S.data.budgets = res.budgets;
          persist(); closeSheet(); render();
          toast('已從' + (pick.label || pick.g) + '挪 ' + money(amt) + ' 到' + group);
        } catch (e) { busy(btn, false); toast('需要網路才能調整預算：' + errMsg(e)); }
      }
    });
  };
  draw();
}

/* ───────────── 預算調整 ───────────── */

/** 調整本期預算。keep：新增項目後重畫時保留剛剛打的金額 */
function openBudget(cid, keep) {
  const b = Object.assign({}, budgetOf(cid), keep || {});
  const groups = expenseGroups();
  const spent = spentByGroup(cid);
  const income = kindTotal(cid, '收入');
  const invest = kindTotal(cid, '資產配置');
  const carry = b[CARRY] || 0;
  const h = '<h3>調整本期預算</h3>' +
    '<div class="kv"><span>本期收入</span><span class="num">' + money(income) + '</span></div>' +
    (carry ? '<div class="kv"><span>上期滾入</span><span class="num">+' + money(carry) + '</span></div>' : '') +
    '<div class="kv"><span>資產配置</span><span class="num">-' + money(invest) + '</span></div>' +
    groups.map(g => '<div class="check"><div class="grow">' + esc(g) + '<div class="small muted">已花 ' + money(spent[g] || 0) + '</div></div>' +
      '<input type="number" inputmode="numeric" data-g="' + esc(g) + '" value="' + (b[g] || '') + '" placeholder="0"></div>').join('') +
    '<div class="field" id="bAddRow" hidden><label for="bNew">新的預算項目</label><div class="inline"><input id="bNew" type="text" placeholder="例如：寵物、旅行…" enterkeyhint="done">' +
    '<button class="btn primary" type="button" data-act="add">加入</button></div>' +
    '<div class="small muted" style="margin-top:6px">會新增成一個支出大類，記帳時選得到；之後可以在「設定 → 分類」改名或加子類</div></div>' +
    '<button class="link" type="button" data-act="addOpen" id="bAddBtn" style="margin-top:12px">' + icon('plus') + ' 新增預算項目</button>' +
    '<div class="small muted" style="margin-top:6px">金額留空＝這期不編預算</div>' +
    '<div class="kv total"><span>未分配</span><span class="num" id="bUn"></span></div>' +
    '<div class="actions"><button class="btn" type="button" data-act="cancel">取消</button><button class="btn primary" type="button" data-act="save">儲存</button></div>';
  const typed = () => { const map = {}; $$('[data-g]', s).forEach(i => { map[i.dataset.g] = Math.round(Number(i.value) || 0); }); return map; };
  const s = openSheet(h, async (act, v, btn) => {
    if (act === 'cancel') closeSheet();
    else if (act === 'addOpen') { $('#bAddRow').hidden = false; $('#bAddBtn').hidden = true; $('#bNew').focus(); }
    else if (act === 'add') {
      const name = $('#bNew').value.trim();
      if (!name) { $('#bNew').focus(); return; }
      if (expenseGroups().includes(name)) { toast('已經有「' + name + '」了'); return; }
      busy(btn, true);
      try {
        const res = await call('api_saveCategory', { kind: '支出', group: name, name: '一般', disabled: false });
        S.data.categories = res.categories;
        persist();
        openBudget(cid, typed());
        toast('已新增「' + name + '」，填上金額後按儲存');
      } catch (e) { busy(btn, false); toast('需要網路才能新增：' + errMsg(e)); }
    }
    else if (act === 'save') {
      const map = typed();
      busy(btn, true);
      try {
        const res = await call('api_setBudgets', cid, map);
        S.data.budgets = res.budgets;
        persist(); closeSheet(); render(); toast('預算已更新');
      } catch (e) { busy(btn, false); toast('需要網路才能調整預算：' + errMsg(e)); }
    }
  });
  const upd = () => {
    let sum = 0;
    $$('[data-g]', s).forEach(i => { sum += Number(i.value) || 0; });
    const un = income + carry - invest - sum;
    $('#bUn').textContent = money(un);
    $('#bUn').className = 'num' + (un < 0 ? ' warn' : '');
  };
  $$('[data-g]', s).forEach(i => i.oninput = upd);
  upd();
}

/* ───────────── 發薪流程 ───────────── */

let W = null;

function openPayday(salary, learn) {
  const cur = currentCycle();
  const b = cur ? budgetOf(cur.id) : {};
  const spent = cur ? spentByGroup(cur.id) : {};
  const leftovers = {};
  let total = 0;
  expenseGroups().forEach(g => {
    const l = (b[g] || 0) - (spent[g] || 0);
    if (b[g] && l > 0) { leftovers[g] = l; total += l; }
  });
  W = {
    salary, learn, leftovers, leftoverTotal: total, mode: 'carry', investAmt: total, prevBudgets: b,
    fixed: S.data.fixed.filter(f => f.enabled).sort(byOrder).map(f => Object.assign({}, f, { checked: true })),
    steps: (total > 0 ? ['leftover'] : []).concat(['fixed', 'budget']), step: 0, budgets: null
  };
  renderPayday();
}

function paydayDefaults() {
  const fixedSum = {};
  W.fixed.filter(f => f.checked && f.type === '支出').forEach(f => {
    const c = cat(f.categoryId);
    if (c) fixedSum[c.group] = (fixedSum[c.group] || 0) + (Number(f.amount) || 0);
  });
  const out = {};
  expenseGroups().forEach(g => {
    let v = g in fixedSum ? fixedSum[g] : (W.prevBudgets[g] || 0);
    if (W.mode === 'carry' && W.leftovers[g]) v += W.leftovers[g];
    out[g] = v;
  });
  return out;
}

const paydayInvest = () => W.fixed.filter(f => f.checked && f.type === '轉帳' && cat(f.categoryId) && cat(f.categoryId).kind === '資產配置')
  .reduce((s, f) => s + (Number(f.amount) || 0), 0);

function renderPayday() {
  const step = W.steps[W.step];
  const head = '<div class="steps">發薪流程・' + (W.step + 1) + ' / ' + W.steps.length + '</div>';
  const nav = (last) => '<div class="actions">' +
    (W.step > 0 ? '<button class="btn" type="button" data-act="back">上一步</button>' : '<button class="btn" type="button" data-act="cancel">取消</button>') +
    '<button class="btn primary" type="button" data-act="' + (last ? 'finish' : 'next') + '">' + (last ? '✓ 完成，開始新週期' : '下一步') + '</button></div>';
  let h = head;

  if (step === 'leftover') {
    h += '<h3>上期還剩 ' + money(W.leftoverTotal) + '</h3>' +
      Object.keys(W.leftovers).map(g => '<div class="kv"><span>' + esc(g) + '</span><span class="num">' + money(W.leftovers[g]) + '</span></div>').join('') +
      '<div class="field"><div class="label">要怎麼處理？</div>' +
      [['carry', '滾入本期預算', '各分類剩多少，本期就多多少'], ['keep', '留在銀行當存款', '不加進本期預算'], ['invest', '加碼投資', '從銀行轉到理財帳戶']]
        .map(o => '<label class="check"><input type="radio" name="lo" value="' + o[0] + '"' + (W.mode === o[0] ? ' checked' : '') + '><div class="grow">' + o[1] + '<div class="small muted">' + o[2] + '</div></div></label>').join('') + '</div>' +
      (W.mode === 'invest' ? '<div class="field"><label for="invAmt">加碼金額</label><input id="invAmt" type="number" inputmode="numeric" value="' + W.investAmt + '"></div>' : '') +
      nav(false);
  } else if (step === 'fixed') {
    h += '<h3>薪資 ' + money(W.salary.amount) + '・固定項目</h3><div class="small muted">勾選本期要記的項目，金額可以直接改</div>' +
      W.fixed.map((f, i) => {
        const c = cat(f.categoryId);
        const where = f.type === '轉帳' ? accName(f.from) + ' → ' + accName(f.to) : accName(f.from);
        // 剩幾期放在名稱旁邊，不接在說明後面（說明一長就會擠成好幾行）
        const left = f.remaining == null ? '' : ' <span class="small accent">' + (f.remaining === 1 ? '最後一期' : '剩 ' + f.remaining + ' 期') + '</span>';
        return '<div class="check"><input type="checkbox" data-fx="' + i + '"' + (f.checked ? ' checked' : '') + '>' +
          '<div class="grow">' + esc(f.name) + left + '<div class="small muted">' + esc(catLabel(c)) + '・' + esc(where) + (f.symbol ? '・' + esc(f.symbol) : '') + '</div></div>' +
          '<input type="number" inputmode="numeric" data-fa="' + i + '" value="' + (f.amount || '') + '"></div>';
      }).join('') +
      (W.fixed.length ? '' : '<div class="empty">還沒有固定項目，可以到「設定 → 固定項目」新增</div>') +
      nav(false);
  } else {
    if (!W.budgets) W.budgets = paydayDefaults();
    const carry = W.mode === 'carry' ? W.leftoverTotal : 0;
    h += '<h3>分配本期預算</h3>' +
      '<div class="kv"><span>薪資</span><span class="num">' + money(W.salary.amount) + '</span></div>' +
      (carry ? '<div class="kv"><span>上期滾入</span><span class="num">+' + money(carry) + '</span></div>' : '') +
      '<div class="kv"><span>資產配置</span><span class="num">-' + money(paydayInvest()) + '</span></div>' +
      expenseGroups().map(g => '<div class="check"><div class="grow">' + esc(g) + '</div><input type="number" inputmode="numeric" data-bg="' + esc(g) + '" value="' + (W.budgets[g] || '') + '" placeholder="0"></div>').join('') +
      '<div class="kv total"><span>未分配</span><span class="num" id="pUn"></span></div>' +
      nav(true);
  }

  const s = openSheet(h, paydayAction);
  S.isDirty = () => true;
  $$('input[name=lo]', s).forEach(r => r.onchange = () => { W.mode = r.value; W.budgets = null; renderPayday(); });
  if ($('#invAmt')) $('#invAmt').oninput = e => { W.investAmt = Math.round(Number(e.target.value) || 0); };
  $$('[data-fx]', s).forEach(el => el.onchange = () => { W.fixed[el.dataset.fx].checked = el.checked; W.budgets = null; });
  $$('[data-fa]', s).forEach(el => el.oninput = () => { W.fixed[el.dataset.fa].amount = Math.round(Number(el.value) || 0); W.budgets = null; });
  const updUn = () => {
    if (!$('#pUn')) return;
    let sum = 0;
    Object.keys(W.budgets).forEach(g => { sum += Number(W.budgets[g]) || 0; });
    const carry = W.mode === 'carry' ? W.leftoverTotal : 0;
    const un = W.salary.amount + carry - paydayInvest() - sum;
    $('#pUn').textContent = money(un);
    $('#pUn').className = 'num' + (un < 0 ? ' warn' : '');
  };
  $$('[data-bg]', s).forEach(el => el.oninput = () => { W.budgets[el.dataset.bg] = Math.round(Number(el.value) || 0); updUn(); });
  updUn();
}

async function paydayAction(act, v, btn) {
  if (act === 'cancel') { closeSheet(); return; }
  if (act === 'back') { W.step--; renderPayday(); return; }
  if (act === 'next') { W.step++; renderPayday(); return; }
  if (act !== 'finish') return;

  const bank = activeAccounts('銀行')[0];
  const broker = activeAccounts('理財')[0];
  const extra = [];
  if (W.mode === 'invest' && W.investAmt > 0) {
    const c = activeCats(['資產配置']).find(x => x.name === '單筆投資') || activeCats(['資產配置'])[0];
    if (!bank || !broker || !c) { toast('需要有銀行帳戶、理財帳戶與資產配置分類才能加碼投資'); return; }
    extra.push({ id: newId(), type: '轉帳', amount: W.investAmt, categoryId: c.id, from: bank.id, to: broker.id, note: '上期結餘加碼投資' });
  }
  const payload = {
    salary: Object.assign({}, W.salary, { id: W.salary.id || newId() }),
    fixed: W.fixed.filter(f => f.checked && f.amount > 0).map(f => ({
      id: newId(), fixedId: f.id, type: f.type, amount: f.amount, categoryId: f.categoryId, from: f.from, to: f.type === '轉帳' ? f.to : '', note: f.name, symbol: f.symbol || ''
    })),
    extra: extra,
    budgets: W.budgets || paydayDefaults(),
    carry: W.mode === 'carry' ? W.leftoverTotal : 0,
    learn: W.learn || null
  };
  busy(btn, true);
  if (S.queue.length) await flush();
  if (S.queue.length) { busy(btn, false); toast('還有紀錄沒上傳，請連上網路再試一次'); return; }
  try {
    const res = await call('api_startCycle', payload);
    closeSheet();
    setData(res);
    toast('新週期開始！固定項目已記下');
  } catch (e) {
    busy(btn, false);
    toast(isUserError(e) ? errMsg(e) : '需要網路才能開始新週期');
  }
}

/* ───────────── 統計（週／月／年日曆與分類占比） ─────────────
 * 資料來源：最近兩期用手機上的交易即時計算；更早的日期向伺服器要「日彙總」（每年一次）。
 */

const dayKey = d => d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate());
const keyDate = k => new Date(Number(k.slice(0, 4)), Number(k.slice(4, 6)) - 1, Number(k.slice(6, 8)));
const mondayOf = d => addDays(startOfDay(d), -((d.getDay() + 6) % 7));
const WEEK_MON = ['一', '二', '三', '四', '五', '六', '日'];

/** 從這天起的資料都在手機上（最近兩期）；更早的要問伺服器。 */
function localFrom() {
  const cs = cycles();
  if (cs.length <= 2) return -Infinity;
  return addDays(startOfDay(new Date(cs[cs.length - 2].start)), 1).getTime();
}

function invalidateStats(tx, prev) {
  [tx, prev].forEach(t => {
    if (!t) return;
    if (t.time < localFrom()) {
      const y = new Date(t.time).getFullYear();
      delete S.years[y];
      S.staleYears[y] = true; // 上傳完成後要再讀一次（避免在上傳前就讀到舊資料）
    }
    delete S.historyCache['d' + dayKey(new Date(t.time))];
  });
}

/** 合併伺服器日彙總與手機上的交易：{ yyyyMMdd: { 分類編號: 金額 } } */
function dailyMap(years) {
  const lf = localFrom();
  const lfKey = lf === -Infinity ? '0' : dayKey(new Date(lf));
  const out = {};
  years.forEach(y => {
    const days = S.years[y] || {};
    Object.keys(days).forEach(k => { if (k < lfKey) out[k] = Object.assign({}, days[k]); });
  });
  S.txs.forEach(t => {
    if (t.void || !t.categoryId || t.time < lf) return;
    const k = dayKey(new Date(t.time));
    const d = out[k] = out[k] || {};
    d[t.categoryId] = (d[t.categoryId] || 0) + t.amount;
  });
  return out;
}

/** 固定支出＝「固定支出」大類（預設只有孝親費，可以在設定的分類自己加子類）。統計預設排除、首頁預算平常不顯示。 */
function fixedGroups() {
  return { 固定支出: true };
}

function statsRange() {
  const st = S.stats;
  const a = new Date(st.anchor);
  if (st.mode === 'week') { const s = mondayOf(a); return { from: s, to: addDays(s, 7) }; }
  if (st.mode === 'month') return { from: new Date(a.getFullYear(), a.getMonth(), 1), to: new Date(a.getFullYear(), a.getMonth() + 1, 1) };
  return { from: new Date(a.getFullYear(), 0, 1), to: new Date(a.getFullYear() + 1, 0, 1) };
}

/** 某天所屬週期的「每日可花」＝變動支出預算 ÷ 週期天數。 */
function dailyBudget(date) {
  const cs = cycles();
  const t = date.getTime() + 12 * 3600000;
  let i = -1;
  cs.forEach((c, j) => { if (c.start <= t) i = j; });
  if (i < 0) return null;
  const b = (S.data.budgets || {})[cs[i].id];
  if (!b) return null;
  const fg = fixedGroups();
  let total = 0;
  Object.keys(b).forEach(g => { if (g !== CARRY && !fg[g]) total += b[g]; });
  if (!total) return null;
  const s = new Date(cs[i].start);
  const end = cs[i + 1] ? new Date(cs[i + 1].start) : new Date(s.getFullYear(), s.getMonth() + 1, s.getDate());
  const days = Math.max(1, Math.round((startOfDay(end) - startOfDay(s)) / 864e5));
  return total / days;
}

const compact = n => n >= 10000 ? (n / 10000).toFixed(n >= 100000 ? 0 : 1).replace(/\.0$/, '') + '萬' : Math.round(n).toLocaleString('en-US');

function heatLevels(values) {
  const v = values.filter(x => x > 0).sort((a, b) => a - b);
  const q = p => v.length ? v[Math.min(v.length - 1, Math.floor(p * v.length))] : 0;
  const t = [q(0.25), q(0.5), q(0.75)];
  return x => !(x > 0) ? 0 : x <= t[0] ? 1 : x <= t[1] ? 2 : x <= t[2] ? 3 : 4;
}

async function loadYears(years) {
  const lf = localFrom();
  const need = years.filter(y => new Date(y, 0, 1).getTime() < lf && !(y in S.years));
  if (!need.length) return;
  await Promise.all(need.map(y => call('api_statsYear', y)
    .then(r => { S.years[y] = r.days; })
    .catch(() => { S.years[y] = null; })));
}

async function txsForDay(key) {
  const d = keyDate(key);
  if (d.getTime() >= localFrom()) return S.txs.filter(t => dayKey(new Date(t.time)) === key);
  const ck = 'd' + key;
  if (!S.historyCache[ck]) S.historyCache[ck] = await call('api_listTxRange', d.getTime(), addDays(d, 1).getTime());
  return S.historyCache[ck];
}

async function renderStats() {
  const st = S.stats;
  const { from, to } = statsRange();
  const years = [];
  for (let y = from.getFullYear(); y <= addDays(to, -1).getFullYear(); y++) years.push(y);
  const v = $('#view');
  if (years.some(y => new Date(y, 0, 1).getTime() < localFrom() && !(y in S.years))) {
    v.innerHTML = '<div class="loading">讀取統計資料…</div>';
    await loadYears(years);
    if (S.tab === 'stats') renderStats();
    return;
  }
  const offline = years.some(y => S.years[y] === null);
  const map = dailyMap(years);
  const fg = fixedGroups();
  const counted = c => c && c.kind === '支出' && (st.withFixed || !fg[c.group]);
  const spendOf = k => { let s = 0; const d = map[k] || {}; Object.keys(d).forEach(id => { if (counted(cat(id))) s += d[id]; }); return s; };

  // 範圍合計
  const tot = { spend: 0, expense: 0, income: 0 };
  const byGroup = {};
  const bySub = {};
  const today = startOfDay(new Date());
  for (let d = new Date(from); d < to; d = addDays(d, 1)) {
    const day = map[dayKey(d)] || {};
    Object.keys(day).forEach(id => {
      const c = cat(id);
      if (!c) return;
      if (c.kind === '收入') tot.income += day[id];
      if (c.kind === '支出') tot.expense += day[id];
      if (counted(c)) {
        tot.spend += day[id];
        byGroup[c.group] = (byGroup[c.group] || 0) + day[id];
        bySub[id] = (bySub[id] || 0) + day[id];
      }
    });
  }
  const elapsed = Math.max(1, Math.round((Math.min(to, addDays(today, 1)) - from) / 864e5));

  // 標題列
  const title = st.mode === 'week' ? fmtDate(from.getTime()) + ' – ' + fmtDate(addDays(to, -1).getTime())
    : st.mode === 'month' ? from.getFullYear() + '年' + (from.getMonth() + 1) + '月' : from.getFullYear() + '年';
  const isNow = today >= from && today < to;
  let h = '<div class="section"><div class="seg">' + [['week', '週'], ['month', '月'], ['year', '年']].map(m =>
    '<button type="button" data-st="mode" data-v="' + m[0] + '" class="' + (st.mode === m[0] ? 'on' : '') + '">' + m[1] + '</button>').join('') + '</div>' +
    '<div class="stat-nav"><button type="button" class="icon-btn" data-st="prev" aria-label="上一段">' + icon('caret-left') + '</button>' +
    '<div class="stat-title">' + title + (isNow ? '' : '<button type="button" class="link" data-st="today">回到今天</button>') + '</div>' +
    '<button type="button" class="icon-btn" data-st="next" aria-label="下一段">' + icon('caret-right') + '</button></div>' +
    '<div class="chips"><button type="button" class="chip' + (st.withFixed ? ' on' : '') + '" data-st="fixed">含固定支出</button></div></div>';

  if (offline) h += '<div class="notice warn small">目前離線，較早的資料無法讀取，只顯示最近兩期。</div>';

  const spendLabel = st.withFixed ? '支出' : '變動支出';
  if (st.mode === 'week') {
    // 一週沒有薪水進帳，「存下」會是負數而誤導，改看日均與最多的一天
    let maxK = null;
    for (let d = new Date(from); d < to; d = addDays(d, 1)) { const k = dayKey(d); if (!maxK || spendOf(k) > spendOf(maxK)) maxK = k; }
    h += '<div class="stats">' +
      '<div class="stat"><div class="k">' + spendLabel + '</div><div class="v num">' + money(tot.spend) + '</div></div>' +
      '<div class="stat"><div class="k">日均</div><div class="v num">' + money(tot.spend / elapsed) + '</div></div>' +
      '<div class="stat"><div class="k">最多的一天</div><div class="v num">' + (maxK && spendOf(maxK) ? '週' + WEEK[keyDate(maxK).getDay()] : '無') + '</div></div></div>';
  } else {
    const savedPct = tot.income ? Math.round((tot.income - tot.expense) / tot.income * 100) : null;
    h += '<div class="stats">' +
      '<div class="stat"><div class="k">' + spendLabel + '</div><div class="v num">' + money(tot.spend) + '</div></div>' +
      '<div class="stat"><div class="k">收入</div><div class="v num good">' + money(tot.income) + '</div></div>' +
      '<div class="stat"><div class="k">存下</div><div class="v num">' + money(tot.income - tot.expense) + '</div></div></div>' +
      '<div class="small muted" style="margin:10px 4px 0">日均 ' + money(tot.spend / elapsed) + (savedPct == null ? '' : '・存下 ' + savedPct + '%') + '</div>';
  }
  if (!st.withFixed) h += '<div class="small muted" style="margin:4px 4px 0">不含孝親費等固定支出</div>';

  // 主圖
  if (st.mode === 'week') h += weekChart(from, spendOf);
  else if (st.mode === 'month') h += monthCalendar(from, to, spendOf, map);
  else h += yearGrid(from, spendOf);

  // 當天明細
  if (st.sel && st.mode !== 'year' && st.sel >= dayKey(from) && st.sel < dayKey(to)) {
    h += '<div class="section"><div class="section-head"><h2>' + fmtDay(keyDate(st.sel).getTime()) + '・支出 <span class="num">' + money(spendOf(st.sel)) + '</span></h2>' +
      (st.sel <= dayKey(new Date()) ? '<button type="button" class="link" data-st="addday" data-v="' + st.sel + '">＋ 記在這天</button>' : '') +
      '</div><div class="list" id="dayList"><div class="empty">讀取中…</div></div></div>';
  }

  // 分類占比
  const groups = Object.keys(byGroup).sort((a, b) => byGroup[b] - byGroup[a]);
  h += '<div class="section"><div class="section-head"><h2>分類占比</h2></div><div class="card">';
  if (!groups.length) h += '<div class="empty">這段期間沒有支出</div>';
  groups.forEach(g => {
    const pct = tot.spend ? byGroup[g] / tot.spend * 100 : 0;
    const open = st.open === g;
    h += '<button type="button" class="share-row" data-st="open" data-v="' + esc(g) + '" aria-expanded="' + open + '">' +
      '<div class="share-top"><span>' + icon(open ? 'caret-down' : 'caret-right') + esc(g) + '</span><span class="num">' + money(byGroup[g]) + ' <span class="muted">' + pct.toFixed(0) + '%</span></span></div>' +
      '<div class="bar"><i style="width:' + pct.toFixed(1) + '%"></i></div></button>';
    if (open) {
      Object.keys(bySub).filter(id => cat(id).group === g).sort((a, b) => bySub[b] - bySub[a]).forEach(id => {
        h += '<div class="share-sub"><span>' + esc(cat(id).name) + '</span><span class="num">' + money(bySub[id]) + ' <span class="muted">' + (bySub[id] / byGroup[g] * 100).toFixed(0) + '%</span></span></div>';
      });
    }
  });
  h += '</div></div>';

  v.innerHTML = h;
  $$('[data-st]', v).forEach(el => el.onclick = () => statsAction(el.dataset.st, el.dataset.v));

  if ($('#dayList')) {
    const key = st.sel;
    try {
      const list = (await txsForDay(key)).slice().sort((a, b) => b.time - a.time);
      if (S.tab !== 'stats' || S.stats.sel !== key || !$('#dayList')) return;
      $('#dayList').innerHTML = list.length ? list.map(txRow).join('') : '<div class="empty">這天沒有紀錄</div>';
      bindTxRows($('#dayList'));
    } catch (e) {
      if ($('#dayList')) $('#dayList').innerHTML = '<div class="empty">需要網路才能查看較舊的明細</div>';
    }
  }
}

function weekChart(from, spendOf) {
  const days = [];
  for (let i = 0; i < 7; i++) {
    const d = addDays(from, i);
    days.push({ d, k: dayKey(d), v: spendOf(dayKey(d)), line: S.stats.withFixed ? null : dailyBudget(d) });
  }
  const max = Math.max(1, ...days.map(x => Math.max(x.v, x.line || 0))) * 1.15;
  const top = days.reduce((a, b) => (b.v > a.v ? b : a), days[0]);
  const todayKey = dayKey(new Date());
  const lineNow = (days.find(x => x.k === todayKey) || days.find(x => x.line) || {}).line;
  let h = '<div class="section"><div class="card"><div class="week-chart" role="img" aria-label="本週每日支出長條圖">';
  days.forEach(x => {
    const over = x.line && x.v > x.line;
    const showVal = x.v > 0 && (x === top || x.k === S.stats.sel);
    h += '<button type="button" class="wk-col' + (x.k === S.stats.sel ? ' sel' : '') + '" data-st="day" data-v="' + x.k + '" aria-label="' + fmtDay(x.d.getTime()) + ' 支出 ' + money(x.v) + '">' +
      '<div class="wk-plot">' +
      (x.line ? '<div class="wk-line" style="bottom:' + (x.line / max * 100).toFixed(1) + '%"></div>' : '') +
      '<div class="wk-bar' + (over ? ' over' : '') + '" style="height:' + (x.v / max * 100).toFixed(1) + '%">' +
      (showVal ? '<span class="wk-val num">' + compact(x.v) + '</span>' : '') + '</div></div>' +
      '<div class="wk-day' + (x.k === todayKey ? ' today' : '') + '">' + WEEK_MON[(x.d.getDay() + 6) % 7] + '<br><span class="muted">' + x.d.getDate() + '</span></div></button>';
  });
  h += '</div>';
  h += '<div class="legend small muted">' +
    (lineNow ? '<span><i class="lg-line"></i>每日預算 ' + money(lineNow) + '</span><span><i class="lg-box over"></i>超過每日預算</span>' : '<span>' + (S.stats.withFixed ? '含固定支出時不顯示每日預算線' : '這週沒有設定預算') + '</span>') +
    '</div><div class="small muted" style="margin-top:4px">點長條看當天明細</div></div></div>';
  return h;
}

function monthCalendar(from, to, spendOf, map) {
  const keys = [];
  for (let d = new Date(from); d < to; d = addDays(d, 1)) keys.push(dayKey(d));
  const level = heatLevels(keys.map(spendOf));
  const todayKey = dayKey(new Date());
  const paydays = {};
  cycles().forEach(c => { paydays[dayKey(new Date(c.start))] = true; });
  const lead = (from.getDay() + 6) % 7;
  let h = '<div class="section"><div class="card"><div class="cal">' +
    WEEK_MON.map(w => '<div class="cal-head">' + w + '</div>').join('') +
    '<div class="cal-cell blank"></div>'.repeat(lead);
  keys.forEach(k => {
    const v = spendOf(k);
    const lv = level(v);
    const cls = ['cal-cell', 'heat' + lv, k === todayKey ? 'today' : '', k === S.stats.sel ? 'sel' : '', k > todayKey ? 'future' : ''].join(' ');
    h += '<button type="button" class="' + cls + '" data-st="day" data-v="' + k + '" aria-label="' + fmtDay(keyDate(k).getTime()) + ' 支出 ' + money(v) + (paydays[k] ? '，發薪日' : '') + '">' +
      '<span class="cal-d">' + Number(k.slice(6)) + (paydays[k] ? '<i class="pay">薪</i>' : '') + '</span>' +
      '<span class="cal-v num">' + (v > 0 ? compact(v) : '') + '</span></button>';
  });
  h += '</div><div class="legend small muted"><span>少</span>' + [1, 2, 3, 4].map(i => '<i class="lg-box heat' + i + '"></i>').join('') + '<span>多</span>' +
    '<span style="margin-left:auto"><i class="pay">薪</i> 發薪日</span></div></div></div>';

  // 發薪週期小計
  const cs = cycles();
  const rows = [];
  cs.forEach((c, i) => {
    const s = new Date(c.start);
    const e = cs[i + 1] ? new Date(cs[i + 1].start) : null;
    if (s >= to || (e && e <= from)) return;
    let spent = 0;
    const endDay = e ? startOfDay(e) : addDays(startOfDay(new Date()), 1);
    for (let d = startOfDay(s); d < endDay; d = addDays(d, 1)) spent += spendOf(dayKey(d));
    const b = (S.data.budgets || {})[c.id] || {};
    const fg = fixedGroups();
    let bud = 0;
    Object.keys(b).forEach(g => { if (g !== CARRY && (S.stats.withFixed || !fg[g])) bud += b[g]; });
    const covered = i >= cs.length - 2 || [s.getFullYear(), endDay.getFullYear()].every(y => y in S.years);
    rows.push('<div class="kv"><span>' + fmtDate(c.start) + (e ? ' – ' + fmtDate(Math.max(c.start, e.getTime() - 864e5)) : ' 起（本期）') + '</span>' +
      '<span class="num">' + money(spent) + (bud ? ' <span class="muted">/ ' + money(bud) + '</span>' : '') + (covered ? '' : ' <span class="muted small">（部分）</span>') + '</span></div>');
  });
  if (rows.length) h += '<div class="section"><div class="section-head"><h2>發薪週期小計</h2><span class="small muted">支出 / 預算</span></div><div class="card">' + rows.join('') + '</div></div>';
  return h;
}

function yearGrid(from, spendOf) {
  const y = from.getFullYear();
  const all = [];
  for (let d = new Date(from); d.getFullYear() === y; d = addDays(d, 1)) all.push(spendOf(dayKey(d)));
  const level = heatLevels(all);
  const todayKey = dayKey(new Date());
  let h = '<div class="section"><div class="year-grid">';
  for (let m = 0; m < 12; m++) {
    const first = new Date(y, m, 1);
    const next = new Date(y, m + 1, 1);
    let sum = 0;
    let cells = '<i class="mini blank"></i>'.repeat((first.getDay() + 6) % 7);
    for (let d = first; d < next; d = addDays(d, 1)) {
      const k = dayKey(d);
      const v = spendOf(k);
      sum += v;
      cells += '<i class="mini heat' + level(v) + (k === todayKey ? ' today' : '') + (k > todayKey ? ' future' : '') + '"></i>';
    }
    h += '<button type="button" class="mini-month" data-st="month" data-v="' + m + '" aria-label="' + (m + 1) + '月 支出 ' + money(sum) + '">' +
      '<div class="mini-title"><b>' + (m + 1) + '月</b><span class="num muted">' + (sum ? compact(sum) : '') + '</span></div>' +
      '<div class="mini-cal">' + cells + '</div></button>';
  }
  h += '</div><div class="legend small muted" style="margin-top:8px"><span>少</span>' + [1, 2, 3, 4].map(i => '<i class="lg-box heat' + i + '"></i>').join('') + '<span>多</span><span style="margin-left:auto">點月份看詳細</span></div></div>';
  return h;
}

function statsAction(act, v) {
  const st = S.stats;
  const a = new Date(st.anchor);
  if (act === 'mode') { st.mode = v; st.sel = null; S.pref.statsMode = v; savePref(); }
  else if (act === 'prev' || act === 'next') {
    const n = act === 'prev' ? -1 : 1;
    st.anchor = (st.mode === 'week' ? addDays(a, 7 * n) : st.mode === 'month' ? new Date(a.getFullYear(), a.getMonth() + n, 1) : new Date(a.getFullYear() + n, 0, 1)).getTime();
    st.sel = null;
  }
  else if (act === 'today') { st.anchor = Date.now(); st.sel = null; }
  else if (act === 'fixed') st.withFixed = !st.withFixed;
  else if (act === 'day') st.sel = st.sel === v ? null : v;
  else if (act === 'month') { st.mode = 'month'; st.anchor = new Date(a.getFullYear(), Number(v), 1).getTime(); st.sel = null; }
  else if (act === 'open') st.open = st.open === v ? null : v;
  else if (act === 'addday') { openEntry({ type: '支出', time: timeOnDay(v) }); return; }
  renderStats();
}

/* ───────────── 設定 ───────────── */

function renderSettings() {
  const v = $('#view');
  const rowBtn = (attrs, main, sub, right) => '<button class="row" type="button" ' + attrs + '><div class="grow"><div class="main">' + main + '</div>' +
    (sub ? '<div class="sub">' + sub + '</div>' : '') + '</div>' + (right ? '<div class="muted">' + right + '</div>' : '<div class="chev">' + icon('caret-right') + '</div>') + '</button>';

  let h = '<div class="section"><div class="section-head"><h2>帳戶</h2><button class="link" type="button" data-set="acc-new">＋ 新增</button></div><div class="list">' +
    S.data.accounts.slice().sort(byOrder).map(a => rowBtn('data-set="acc" data-v="' + esc(a.id) + '"', esc(a.name) + (a.disabled ? ' <span class="muted small">（停用）</span>' : ''),
      esc(a.type) + (a.dueDay ? '・每月 ' + a.dueDay + ' 日繳費' : '') + '・初始餘額 ' + money(a.initial || 0))).join('') + '</div></div>';

  h += '<div class="section"><div class="section-head"><h2>分類</h2><button class="link" type="button" data-set="group-new">＋ 新增大類</button></div><div class="list">';
  const seen = [];
  S.data.categories.slice().sort(byOrder).forEach(c => {
    const key = c.kind + '|' + c.group;
    if (seen.includes(key)) return;
    seen.push(key);
    const subs = S.data.categories.filter(x => x.kind === c.kind && x.group === c.group && !x.disabled).sort(byOrder).map(x => x.name).join('、');
    h += rowBtn('data-set="group" data-kind="' + esc(c.kind) + '" data-v="' + esc(c.group) + '"', esc(c.group) + ' <span class="muted small">' + esc(c.kind) + '</span>', esc(subs));
  });
  h += '</div></div>';

  const cyNow = currentCycle();
  if (cyNow) {
    const bNow = budgetOf(cyNow.id);
    const set = expenseGroups().filter(g => bNow[g]);
    h += '<div class="section"><div class="section-head"><h2>預算</h2></div><div class="list">' +
      rowBtn('data-set="budget"', '調整本期預算', set.length ? esc(set.map(g => g + ' ' + money(bNow[g])).join('、')) : '還沒有設定') + '</div></div>';
  }
  h += '<div class="section"><div class="section-head"><h2>固定項目（發薪時帶出）</h2><button class="link" type="button" data-set="fix-new">＋ 新增</button></div><div class="list">' +
    (S.data.fixed.length ? S.data.fixed.slice().sort(byOrder).map(f => {
      const done = f.remaining === 0;
      const tag = f.enabled ? '' : ' <span class="muted small">（' + (done ? '已繳完' : '停用') + '）</span>';
      // 剩幾期疊在金額下方，不接在說明後面（會被截成「…」）
      const right = money(f.amount) + (f.remaining > 0 ? '<div class="small" style="margin-top:2px">剩 ' + f.remaining + ' 期</div>' : '');
      return rowBtn('data-set="fix" data-v="' + esc(f.id) + '"', esc(f.name) + tag,
        esc(catLabel(cat(f.categoryId))) + '・' + esc(f.type === '轉帳' ? accName(f.from) + ' → ' + accName(f.to) : accName(f.from)), right);
    }).join('')
      : '<div class="empty">沒有固定項目</div>') + '</div></div>';

  h += '<div class="section"><div class="section-head"><h2>快速記帳</h2></div><div class="list">' +
    rowBtn('data-set="kw"', '關鍵字對照', '打字時用來判斷分類，記帳時自動學習', S.data.keywords.length + ' 個') + '</div></div>';

  h += '<div class="section"><div class="section-head"><h2>維護</h2></div><div class="list">' +
    rowBtn('data-set="recalc"', '重新計算彙總', '手動改過試算表後使用，從明細重建餘額與預算統計', '') +
    rowBtn('data-set="reload"', '重新載入資料', '從雲端重新下載', '') +
    (S.queue.length ? rowBtn('data-set="clearq"', '<span class="warn">捨棄 ' + S.queue.length + ' 筆待上傳紀錄</span>', '只有在確定這些紀錄有問題時才使用', '') : '') +
    '</div><div class="small muted" style="margin:10px 4px">App 版本 ' + esc(S.data.appVersion) + '・資料版本 v' + esc(S.data.dataVersion) + '</div></div>';

  v.innerHTML = h;
  $$('[data-set]', v).forEach(el => el.onclick = () => settingsAction(el.dataset.set, el.dataset.v, el));
}

async function settingsAction(act, v, el) {
  if (act === 'acc' || act === 'acc-new') openAccountForm(v);
  else if (act === 'group') openGroup(el.dataset.kind, v);
  else if (act === 'group-new') openCatForm(null, '支出', '');
  else if (act === 'budget') openBudget(currentCycle().id);
  else if (act === 'fix' || act === 'fix-new') openFixedForm(v);
  else if (act === 'kw') openKeywords();
  else if (act === 'recalc') doRecalc();
  else if (act === 'reload') { toast('重新載入中…'); await flush(); await refresh(false); toast('已更新'); }
  else if (act === 'clearq') {
    if (el.dataset.confirm !== '1') { el.dataset.confirm = '1'; $('.main', el).innerHTML = '<span class="warn">再按一次確認捨棄</span>'; return; }
    S.queue = [];
    persist();
    await refresh(false);
  }
}

async function doRecalc() {
  toast('重新計算中…');
  try { setData(await call('api_recalc')); toast('重新計算完成'); }
  catch (e) { toast('重新計算失敗：' + errMsg(e)); }
}

function formField(label, inner) { return '<div class="field"><div class="label">' + label + '</div>' + inner + '</div>'; }

function openAccountForm(id) {
  // 複製一份：切換類型時會暫存輸入內容，不能直接改到快取裡的帳戶
  const a = Object.assign({ name: '', type: '銀行', initial: 0, dueDay: null, disabled: false, symbol: '', shares: null }, id ? acc(id) : {});
  let type = a.type;
  const draw = () => {
    const h = '<h3>' + (id ? '編輯帳戶' : '新增帳戶') + '</h3>' +
      formField('名稱', '<input id="fName" type="text" value="' + esc($('#fName') ? $('#fName').value : a.name) + '" placeholder="例如：玉山信用卡">') +
      formField('類型', '<div class="chips wrap">' + ['現金', '銀行', '信用卡', '理財'].map(t => '<button type="button" class="chip' + (t === type ? ' on' : '') + '" data-act="type" data-v="' + t + '">' + t + '</button>').join('') + '</div>') +
      formField(type === '信用卡' ? '開始記帳時的未繳金額（填負數，例如 -3000）' : type === '理財' ? '開始記帳時投入的成本' : '開始記帳時的餘額', '<input id="fInit" type="number" inputmode="numeric" value="' + (a.initial || 0) + '">') +
      (type === '信用卡' ? formField('每月繳費日', '<input id="fDue" type="number" inputmode="numeric" min="1" max="31" value="' + (a.dueDay || '') + '">') : '') +
      (type === '理財' ? formField('股票／ETF 代號（上市，選填）', '<input id="fSym" type="text" autocapitalize="characters" value="' + esc(a.symbol || '') + '" placeholder="例如：0050">') +
        formField('目前持有股數', '<input id="fShares" type="number" inputmode="decimal" min="0" value="' + (a.shares == null ? '' : a.shares) + '" placeholder="看券商 App 的庫存股數">') : '') +
      (id ? '<label class="check"><input id="fDis" type="checkbox"' + (a.disabled ? ' checked' : '') + '><div class="grow">停用<div class="small muted">舊紀錄保留，只是不再出現在選單</div></div></label>' : '') +
      '<div class="actions"><button class="btn" type="button" data-act="cancel">取消</button><button class="btn primary" type="button" data-act="save">儲存</button></div>';
    openSheet(h, async (act, val, btn) => {
      if (act === 'type') {
        a.name = $('#fName').value; a.initial = $('#fInit').value;
        if ($('#fSym')) { a.symbol = $('#fSym').value; a.shares = $('#fShares').value; }
        type = val; draw();
      }
      else if (act === 'cancel') closeSheet();
      else if (act === 'save') {
        const item = {
          id: id || null, name: $('#fName').value, type: type, initial: Number($('#fInit').value) || 0,
          dueDay: $('#fDue') ? Number($('#fDue').value) || null : null, disabled: $('#fDis') ? $('#fDis').checked : false, order: a.order,
          symbol: $('#fSym') ? $('#fSym').value : '', shares: $('#fShares') ? $('#fShares').value : null
        };
        busy(btn, true);
        try {
          const res = await call('api_saveAccount', item);
          S.data.accounts = res.accounts; S.data.balances = res.balances;
          persist(); closeSheet(); render(); toast('已儲存');
        } catch (e) { busy(btn, false); toast(errMsg(e)); }
      }
    });
  };
  draw();
}

function openGroup(kind, group) {
  const subs = S.data.categories.filter(c => c.kind === kind && c.group === group).sort(byOrder);
  const h = '<h3>' + esc(group) + '</h3>' +
    formField('大類名稱', '<div class="inline"><input id="gName" type="text" value="' + esc(group) + '"><button class="btn" type="button" data-act="rename" style="flex:none">改名</button></div>') +
    '<div class="field"><div class="label">子類</div><div class="list" style="background:var(--bg)">' +
    subs.map(c => '<button class="row" type="button" data-act="sub" data-v="' + esc(c.id) + '"><div class="grow">' + esc(c.name) + (c.disabled ? ' <span class="muted small">（停用）</span>' : '') + '</div><div class="chev">' + icon('caret-right') + '</div></button>').join('') +
    '</div></div>' +
    '<div class="actions"><button class="btn" type="button" data-act="cancel">關閉</button><button class="btn primary" type="button" data-act="add">＋ 新增子類</button></div>';
  openSheet(h, async (act, v, btn) => {
    if (act === 'cancel') closeSheet();
    else if (act === 'sub') openCatForm(v);
    else if (act === 'add') openCatForm(null, kind, group);
    else if (act === 'rename') {
      const name = $('#gName').value.trim();
      if (!name || name === group) return;
      busy(btn, true);
      try {
        const res = await call('api_renameGroup', group, name);
        S.data.categories = res.categories; S.data.budgets = res.budgets;
        persist(); closeSheet(); render(); toast('已改名');
      } catch (e) { busy(btn, false); toast(errMsg(e)); }
    }
  });
}

function openCatForm(id, kind, group) {
  const c = id ? cat(id) : { kind: kind || '支出', group: group || '', name: '', disabled: false };
  const isNewGroup = !id && !group;
  const h = '<h3>' + (id ? '編輯子類' : isNewGroup ? '新增大類' : '新增子類') + '</h3>' +
    (isNewGroup ? formField('類型', '<select id="cKind">' + ['支出', '收入', '資產配置'].map(k => '<option' + (k === c.kind ? ' selected' : '') + '>' + k + '</option>').join('') + '</select>') +
      formField('大類名稱', '<input id="cGroup" type="text" placeholder="例如：旅行">') : '') +
    formField(isNewGroup ? '第一個子類' : '子類名稱', '<input id="cName" type="text" value="' + esc(c.name) + '" placeholder="例如：住宿">') +
    (id ? '<label class="check"><input id="cDis" type="checkbox"' + (c.disabled ? ' checked' : '') + '><div class="grow">停用<div class="small muted">舊紀錄保留，只是不再出現在選單</div></div></label>' : '') +
    '<div class="actions"><button class="btn" type="button" data-act="cancel">取消</button><button class="btn primary" type="button" data-act="save">儲存</button></div>';
  openSheet(h, async (act, v, btn) => {
    if (act === 'cancel') closeSheet();
    else if (act === 'save') {
      const item = {
        id: id || null, kind: isNewGroup ? $('#cKind').value : c.kind,
        group: isNewGroup ? $('#cGroup').value : c.group, name: $('#cName').value,
        disabled: $('#cDis') ? $('#cDis').checked : false, order: c.order
      };
      busy(btn, true);
      try {
        const res = await call('api_saveCategory', item);
        S.data.categories = res.categories;
        persist(); closeSheet(); render(); toast('已儲存');
      } catch (e) { busy(btn, false); toast(errMsg(e)); }
    }
  });
}

function openFixedForm(id) {
  const f = Object.assign({ name: '', type: '支出', amount: '', categoryId: '', from: '', to: '', symbol: '', enabled: true, remaining: null }, id ? S.data.fixed.find(x => x.id === id) : {});
  const draw = () => {
    const kinds = f.type === '支出' ? ['支出'] : ['資產配置', '轉帳'];
    const cats = activeCats(kinds);
    if (!cats.find(c => c.id === f.categoryId)) f.categoryId = (f.type === '支出' ? cats.find(c => c.group === '固定支出') : cats.find(c => c.kind === '資產配置')) ? (f.type === '支出' ? cats.find(c => c.group === '固定支出') : cats.find(c => c.kind === '資產配置')).id : (cats[0] || {}).id;
    const accOpts = (sel, filter) => activeAccounts().filter(filter || (() => true)).map(a => '<option value="' + esc(a.id) + '"' + (a.id === sel ? ' selected' : '') + '>' + esc(a.name) + '（' + a.type + '）</option>').join('');
    if (!acc(f.from)) f.from = (activeAccounts('銀行')[0] || activeAccounts()[0] || {}).id;
    if (f.type === '轉帳' && (!acc(f.to) || f.to === f.from)) f.to = (activeAccounts('理財')[0] || activeAccounts().find(a => a.id !== f.from) || {}).id;
    const h = '<h3>' + (id ? '編輯固定項目' : '新增固定項目') + '</h3>' +
      '<div class="seg">' + ['支出', '轉帳'].map(t => '<button type="button" data-act="type" data-v="' + t + '" class="' + (f.type === t ? 'on' : '') + '">' + (t === '轉帳' ? '資產配置／轉帳' : t) + '</button>').join('') + '</div>' +
      formField('名稱', '<input id="xName" type="text" value="' + esc(f.name) + '" placeholder="例如：Netflix">') +
      formField('金額', '<input id="xAmt" type="number" inputmode="numeric" value="' + esc(f.amount) + '">') +
      formField('分期：還剩幾期（選填）', '<input id="xRem" type="number" inputmode="numeric" min="0" value="' + esc(f.remaining == null ? '' : f.remaining) + '" placeholder="留空＝每次發薪都有">' +
        '<div class="small muted" style="margin-top:6px">填了之後，每次發薪記下這筆就少一期，扣完自動停用。分類建議選「其他花費・分期付款」。</div>') +
      formField('分類', '<select id="xCat">' + cats.map(c => '<option value="' + esc(c.id) + '"' + (c.id === f.categoryId ? ' selected' : '') + '>' + esc(c.group + '・' + c.name) + '</option>').join('') + '</select>') +
      (f.type === '支出'
        ? formField('付款帳戶', '<select id="xFrom">' + accOpts(f.from, a => a.type !== '理財') + '</select>')
        : formField('從 → 到', '<div class="inline"><select id="xFrom">' + accOpts(f.from) + '</select><select id="xTo">' + accOpts(f.to) + '</select></div>') +
          formField('標的（ETF 代號，可留空）', '<input id="xSym" type="text" value="' + esc(f.symbol) + '" placeholder="0050">')) +
      '<label class="check"><input id="xEn" type="checkbox"' + (f.enabled ? ' checked' : '') + '><div class="grow">啟用<div class="small muted">停用後發薪時不會帶出</div></div></label>' +
      '<div class="actions">' + (id ? '<button class="btn danger" type="button" data-act="del">刪除</button>' : '') +
      '<button class="btn" type="button" data-act="cancel">取消</button><button class="btn primary" type="button" data-act="save">儲存</button></div>';
    const s = openSheet(h, async (act, val, btn) => {
      const grab = () => {
        f.name = $('#xName').value; f.amount = $('#xAmt').value; f.categoryId = $('#xCat').value; f.remaining = $('#xRem').value;
        f.from = $('#xFrom').value; f.to = $('#xTo') ? $('#xTo').value : ''; f.symbol = $('#xSym') ? $('#xSym').value.trim() : '';
        f.enabled = $('#xEn').checked;
      };
      if (act === 'type') { grab(); f.type = val; draw(); }
      else if (act === 'cancel') closeSheet();
      else if (act === 'del') {
        if (btn.dataset.confirm !== '1') { btn.dataset.confirm = '1'; btn.textContent = '確定刪除？'; return; }
        busy(btn, true);
        try { const res = await call('api_deleteFixed', id); S.data.fixed = res.fixed; persist(); closeSheet(); render(); toast('已刪除'); }
        catch (e) { busy(btn, false); toast(errMsg(e)); }
      }
      else if (act === 'save') {
        grab();
        busy(btn, true);
        try { const res = await call('api_saveFixed', Object.assign({ id: id || null }, f)); S.data.fixed = res.fixed; persist(); closeSheet(); render(); toast('已儲存'); }
        catch (e) { busy(btn, false); toast(errMsg(e)); }
      }
    });
    return s;
  };
  draw();
}

function openKeywords() {
  const list = S.data.keywords.slice().sort((a, b) => (b.count || 0) - (a.count || 0) || a.keyword.localeCompare(b.keyword));
  const h = '<h3>關鍵字對照</h3><div class="small muted">打字記帳時，會用這些關鍵字判斷分類與付款帳戶。記帳時選的分類會自動更新到這裡。</div>' +
    '<div class="list" style="margin-top:10px;background:var(--bg)">' +
    list.map(k => '<div class="row"><div class="grow"><div class="main">' + esc(k.keyword) + '</div><div class="sub">' + esc(catLabel(cat(k.categoryId))) + (k.accountId ? '・' + esc(accName(k.accountId)) : '') + '・用過 ' + (k.count || 0) + ' 次</div></div>' +
      '<button class="btn danger" type="button" data-act="del" data-v="' + esc(k.keyword) + '" style="padding:6px 10px">刪除</button></div>').join('') + '</div>' +
    '<div class="actions"><button class="btn" type="button" data-act="cancel">關閉</button></div>';
  openSheet(h, async (act, v, btn) => {
    if (act === 'cancel') closeSheet();
    else if (act === 'del') {
      busy(btn, true);
      try { const res = await call('api_deleteKeyword', v); S.data.keywords = res.keywords; persist(); openKeywords(); }
      catch (e) { busy(btn, false); toast(errMsg(e)); }
    }
  });
}

/* ───────────── 啟動 ───────────── */

$('#sheet').addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (el && S.sheetHandler) S.sheetHandler(el.dataset.act, el.dataset.v, el, e);
});
$('#backdrop').onclick = () => {
  if (S.isDirty && S.isDirty() && !S.backdropWarned) {
    S.backdropWarned = true;
    toast('還沒儲存，再點一次外面就會關閉');
    return;
  }
  closeSheet();
};
$$('[data-icon]').forEach(el => { el.outerHTML = icon(el.dataset.icon); });
$$('.tabbar button').forEach(b => b.onclick = () => navTo(b.dataset.tab, b));
$('#syncBadge').onclick = () => { flush(); if (!S.queue.length) refresh(false); };
window.addEventListener('online', flush);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { S.hiddenAt = Date.now(); return; }
  // 離開超過 3 分鐘再回來：補記日期回到今天，避免之後的帳記錯天
  if (S.entryDay && Date.now() - (S.hiddenAt || 0) > 180000) { S.entryDay = null; render(); }
  flush().then(() => refresh(true));
});

/** 第一次使用或金鑰失效：貼上試算表「設定」工作表裡的 appKey。 */
function renderKeySetup(problem) {
  $('#title').textContent = '設定';
  $('#cycleInfo').textContent = '';
  $('#view').innerHTML = '<div class="section"><div class="card">' +
    '<div class="budget-head"><span>連結你的記帳本</span></div>' +
    (problem ? '<div class="small warn" style="margin-bottom:8px">' + esc(problem) + '</div>' : '') +
    '<div class="small muted">打開 Google 試算表「記帳本」→「設定」工作表，複製 appKey 右邊那一長串金鑰，貼在下面。</div>' +
    '<input id="keyInput" class="note-input" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="貼上金鑰…">' +
    '<div class="actions"><button class="btn primary" type="button" id="keySave">開始使用</button></div></div></div>';
  $('#keySave').onclick = () => {
    const k = $('#keyInput').value.trim();
    if (!/^[0-9a-f]{64}$/.test(k)) { toast('金鑰格式不對，請確認有整串複製'); return; }
    store.set(K_KEY, k);
    start();
  };
}

/** 配對連結 #k=金鑰：存起來。加到主畫面後才把網址裡的金鑰拿掉，避免 iPhone 主畫面 App 拿不到（它和 Safari 的儲存空間是分開的）。 */
function takeKeyFromUrl() {
  const m = location.hash.match(/k=([0-9a-f]{64})/);
  if (!m) return;
  store.set(K_KEY, m[1]);
  const standalone = navigator.standalone || matchMedia('(display-mode: standalone)').matches;
  if (standalone) history.replaceState(null, '', location.pathname + location.search);
}

async function start() {
  if (!onGas) {
    takeKeyFromUrl();
    if (!store.get(K_KEY, '')) { renderKeySetup(''); return; }
  }
  const cache = store.get(K_CACHE, null);
  if (cache && cache.data) { S.data = cache.data; S.txs = cache.txs || []; render(); }
  else $('#view').innerHTML = '<div class="loading">第一次載入，正在準備資料…</div>';
  if (S.queue.length) await flush();
  await refresh(true);
}
// 開啟動畫：標誌浮現、字標出現後停一下再淡出（從打開網頁起算約 1.4 秒；只有完全關掉再打開才會播放）
setTimeout(() => {
  const s = $('#splash');
  if (!s) return;
  s.classList.add('hide');
  setTimeout(() => s.remove(), 400);
}, Math.max(200, 1400 - performance.now()));

start();
</script>
