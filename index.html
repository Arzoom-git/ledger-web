<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<title>記帳</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ece6da">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="記帳">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<script>window.LEDGER_API = 'https://script.google.com/macros/s/AKfycbyO-JGXgLh3J7gzmsb-sb5NzNV-ROs7l9pxPd_moKmAFMec2sU9-YhX7w97ugb_WxY68Q/exec'; if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');</script>
  
  <meta charset="utf-8">
  <style>
/* 設計語言：奶油木底、胡桃木深色、蜂蜜黃點綴。大數字當主角，圓角卡片，深色膠囊按鈕，浮動的底部選單。 */
:root {
  --bg: #ece6da;          /* 奶油木底色 */
  --paper: #fbf8f2;       /* 卡片 */
  --ink: #2b211a;         /* 胡桃木：主文字、深色按鈕、底部選單 */
  --ink-2: #6b5d4e;       /* 次要文字 */
  --muted: #9a8c79;       /* 註解、標籤 */
  --line: rgba(43, 33, 26, .08);
  --line-2: rgba(43, 33, 26, .16);
  --accent: #e8b64a;      /* 蜂蜜黃：只用在色塊（卡片、長條、選取的圓） */
  --accent-ink: #94661a;  /* 蜂蜜黃太淡不能當字色，文字連結用這個深一階的 */
  --accent-soft: #f7ebcc;
  --on-dark: #f6efe3;     /* 深色底上的文字 */
  --good: #4f7d52;        /* 苔綠：收入 */
  --warn: #c0563a;        /* 赭紅：超支 */
  --warn-soft: #f6e0d7;
  --track: rgba(43, 33, 26, .07);
  --shadow: 0 1px 2px rgba(70, 50, 30, .05), 0 8px 24px rgba(70, 50, 30, .07);
  --radius: 22px;
  color-scheme: light;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { background: var(--bg); }
body {
  margin: 0; color: var(--ink); background: var(--bg); min-height: 100vh;
  font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  font-size: 16px; line-height: 1.5; letter-spacing: .01em;
  padding: calc(env(safe-area-inset-top) + 76px) 0 calc(env(safe-area-inset-bottom) + 108px);
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
input, select { font: inherit; color: var(--ink); }
.num { font-variant-numeric: tabular-nums; letter-spacing: 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.warn { color: var(--warn); }
.good { color: var(--good); }
.accent { color: var(--accent-ink); }
/* 圖示：Phosphor 是實心路徑，用 fill 上色 */
svg.ph { width: 22px; height: 22px; fill: currentColor; flex: none; }
.link svg.ph, .wc-link svg.ph { width: 14px; height: 14px; vertical-align: -2px; margin-left: 2px; }
.chip svg.ph { width: 15px; height: 15px; vertical-align: -3px; margin-right: 4px; }
.date-pill svg.ph { width: 13px; height: 13px; }
.chip .caret svg.ph { width: 13px; height: 13px; margin: 0 0 0 4px; }
.icon-btn svg.ph { width: 20px; height: 20px; }
.chev { flex: none; color: var(--muted); display: grid; }
.chev svg.ph { width: 16px; height: 16px; }
.share-top svg.ph { width: 14px; height: 14px; vertical-align: -2px; margin-right: 6px; color: var(--muted); }
h1, h2, h3, .title { text-wrap: balance; }

/* 按下去要有回饋：小元件縮一點，大卡片與整列換底色 */
button, a { touch-action: manipulation; }
button { transition: transform .12s ease, background-color .2s ease, color .2s ease, opacity .2s ease; }
button:not(:disabled):active { transform: scale(.96); }
.hero:not(:disabled):active, .week-card:not(:disabled):active, .card.tap:not(:disabled):active, .mini-month:not(:disabled):active { transform: scale(.985); }
.row:not(:disabled):active, .share-row:not(:disabled):active, .check:active { transform: none; background-color: var(--track); }
/* 鍵盤操作時看得到焦點；手指點擊不會出現 */
:focus-visible { outline: 2px solid var(--accent-ink); outline-offset: 2px; }
input:focus-visible, select:focus-visible { outline: none; }

/* ── 開啟動畫：扇形書頁淡入並微微放大，字標稍後浮上來 ── */
#splash { position: fixed; inset: 0; z-index: 100; background: var(--bg); display: grid; place-items: center; transition: opacity .35s ease, visibility .35s; }
#splash.hide { opacity: 0; visibility: hidden; }
#splash svg { width: min(58vw, 230px); height: auto; overflow: visible; }
#splash .lg-mark, #splash .lg-word { opacity: 0; transform-box: fill-box; transform-origin: 50% 80%; }
#splash .lg-mark { transform: scale(.92); animation: splash-in .8s cubic-bezier(.2, .8, .2, 1) .05s forwards; }
#splash .lg-word { transform: translateY(10px); animation: splash-in .6s ease .4s forwards; }
@keyframes splash-in { to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { #splash .lg-mark, #splash .lg-word { animation-duration: .01s; animation-delay: 0s; } }

/* ── 頂部與分頁列 ── */
.topbar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 10;
  display: flex; align-items: flex-end; justify-content: space-between;
  padding: calc(env(safe-area-inset-top) + 14px) 22px 12px;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
}
.title { font-size: 24px; font-weight: 700; letter-spacing: .02em; }
.subtitle { font-size: 12px; color: var(--muted); letter-spacing: .08em; margin-top: 2px; }
.sync { font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; padding: 6px 0 6px 10px; }
.sync::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--good); }
.sync.pending::before { background: var(--accent); animation: pulse 1.2s ease-in-out infinite; }
.sync.error::before { background: var(--warn); }
.sync.error { color: var(--warn); }
@keyframes pulse { 50% { opacity: .3; } }
/* 浮動的深色膠囊；選到的分頁是蜂蜜黃圓角，並顯示文字 */
.tabbar {
  position: fixed; z-index: 10; left: 16px; right: 16px; bottom: calc(env(safe-area-inset-bottom) + 12px);
  max-width: 440px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center;
  padding: 7px; border-radius: 999px; background: var(--ink); box-shadow: 0 10px 30px rgba(43, 33, 26, .28);
}
.tabbar button { flex: none; display: flex; align-items: center; justify-content: center; gap: 6px; min-width: 50px; height: 46px; padding: 0 13px; border-radius: 999px; color: rgba(246, 239, 227, .62); font-size: 14px; font-weight: 600; transition: background .2s, color .2s; }
.tabbar button span { display: none; }
.tabbar button.on { background: var(--accent); color: var(--ink); padding: 0 16px; }
.tabbar button.on span { display: inline; }
.tabbar svg.ph { width: 24px; height: 24px; }

/* ── 版面 ── */
main { max-width: 560px; margin: 0 auto; padding: 0 18px; }
.section { margin: 26px 0; }
.section:first-child { margin-top: 6px; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; margin: 0 4px 12px; }
.section-head h2 { margin: 0; font-size: 17px; color: var(--ink); font-weight: 700; letter-spacing: .02em; }
.section-head .link, .link { color: var(--accent-ink); font-size: 14px; font-weight: 600; }
.card { background: var(--paper); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); }
.card + .card { margin-top: 12px; }
.card.tap { display: block; width: 100%; text-align: left; }
.hr { height: 1px; background: var(--line); margin: 14px 0; }

/* ── 首頁：大數字 ── */
.hero { display: block; width: 100%; text-align: left; padding: 4px 4px 2px; }
.hero-label { display: flex; justify-content: space-between; align-items: baseline; font-size: 14px; color: var(--ink-2); }
.hero-value { font-size: 44px; font-weight: 700; line-height: 1.15; letter-spacing: -.01em; margin-top: 4px; }
.hero-sub { font-size: 12px; color: var(--muted); margin-top: 4px; }

/* ── 首頁：本週支出（蜂蜜黃卡片） ── */
.week-card { display: block; width: 100%; text-align: left; background: var(--accent); color: var(--ink); border-radius: var(--radius); padding: 18px 18px 14px; box-shadow: var(--shadow); }
.week-card .wc-top { display: flex; justify-content: space-between; align-items: baseline; font-size: 14px; }
.week-card .wc-value { font-size: 26px; font-weight: 700; margin-top: 2px; }
.wc-bars { display: flex; align-items: flex-end; gap: 8px; height: 92px; margin-top: 12px; }
.wc-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; }
.wc-bar { width: 100%; max-width: 30px; margin-top: auto; border-radius: 9px; background: rgba(43, 33, 26, .16); min-height: 6px; }
.wc-col.today .wc-bar { background: var(--ink); }
.wc-day { font-size: 11px; color: rgba(43, 33, 26, .6); }
.wc-col.today .wc-day { color: var(--ink); font-weight: 700; }

/* ── 快速記帳 ── */
.quick { display: flex; align-items: center; gap: 10px; background: var(--paper); border-radius: 999px; padding: 7px 7px 7px 8px; box-shadow: var(--shadow); }
.quick input { flex: 1; min-width: 0; border: 0; background: none; font-size: 17px; padding: 10px 4px; }
.quick input::placeholder { color: var(--muted); }
.quick input:focus { outline: none; }
.quick:focus-within { box-shadow: var(--shadow), 0 0 0 2px var(--accent); }
.date-pill { flex: none; display: inline-flex; align-items: center; gap: 4px; font-size: 13px; color: var(--ink-2); padding: 9px 12px; border-radius: 999px; background: var(--bg); white-space: nowrap; }
.date-pill.past { background: var(--accent); color: var(--ink); font-weight: 600; }
.go { flex: none; width: 46px; height: 46px; border-radius: 50%; background: var(--ink); color: var(--on-dark); display: grid; place-items: center; }
.go svg.ph { width: 22px; height: 22px; }
.backfill-note { font-size: 13px; color: var(--accent-ink); margin: 10px 8px 0; display: flex; justify-content: space-between; }

/* 標籤 */
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 14px 2px 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chips.wrap { flex-wrap: wrap; overflow: visible; padding-top: 0; }
.chip { flex: none; padding: 9px 16px; line-height: 1.3; border-radius: 999px; border: 0; font-size: 14px; color: var(--ink-2); white-space: nowrap; background: var(--paper); box-shadow: 0 1px 2px rgba(70, 50, 30, .06); }
.chip.on { background: var(--ink); color: var(--on-dark); }
.chip.ghost { background: transparent; box-shadow: inset 0 0 0 1px var(--line-2); }
.sheet .chip { background: var(--bg); box-shadow: none; }
.sheet .chip.on { background: var(--ink); color: var(--on-dark); }
.sheet .chip.ghost { background: transparent; box-shadow: inset 0 0 0 1px var(--line-2); }

/* 按鈕：膠囊形 */
.btn { padding: 14px 20px; border-radius: 999px; font-size: 15px; font-weight: 600; letter-spacing: .04em; background: var(--bg); color: var(--ink); }
.btn.primary { background: var(--ink); color: var(--on-dark); }
.btn.danger { color: var(--warn); background: transparent; }
.btn.block { width: 100%; }
.btn:disabled { opacity: .45; }
.icon-btn { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: var(--ink-2); background: var(--paper); box-shadow: 0 1px 2px rgba(70, 50, 30, .06); }

/* 提醒 */
.notice { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 18px; background: var(--accent-soft); margin-top: 12px; font-size: 14px; }
.notice.warn { background: var(--warn-soft); }
.notice .grow { flex: 1; }
.notice .btn { padding: 8px 16px; background: var(--ink); color: var(--on-dark); font-size: 14px; }
.notice .icon-btn { box-shadow: none; background: transparent; }

/* ── 預算：一個大類一張卡 ── */
.budget-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; font-size: 14px; color: var(--ink-2); }
.bcard { background: var(--paper); border-radius: var(--radius); padding: 16px 18px; box-shadow: var(--shadow); }
.bcard + .bcard { margin-top: 10px; }
.bcard .b-top { display: flex; justify-content: space-between; align-items: baseline; font-size: 16px; font-weight: 600; }
.bcard .b-tag { font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px; background: var(--bg); color: var(--ink-2); }
.bcard .b-tag.over { background: var(--warn-soft); color: var(--warn); }
.bcard .b-mid { display: flex; justify-content: space-between; align-items: baseline; margin-top: 12px; font-size: 13px; color: var(--muted); }
.bcard .b-mid b { font-size: 15px; color: var(--ink); font-weight: 600; }
.budget-row { padding: 12px 0; }
.budget-row + .budget-row { border-top: 1px solid var(--line); }
.budget-top { display: flex; justify-content: space-between; align-items: baseline; }
.budget-top .left, .budget-top .right { font-size: 15px; }
.budget-sub { font-size: 12px; color: var(--muted); margin-top: 6px; display: flex; justify-content: space-between; }
.bar { height: 7px; border-radius: 999px; background: var(--track); margin-top: 8px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 999px; }
.bar.over > i { background: var(--warn); }

/* ── 淨資產 ── */
.networth-label { font-size: 12px; color: var(--muted); letter-spacing: .12em; }
.networth { font-size: 34px; font-weight: 700; letter-spacing: -.01em; margin: 4px 0 2px; }
.acc-row { display: flex; justify-content: space-between; align-items: baseline; padding: 10px 0; font-size: 15px; }
.acc-row + .acc-row { border-top: 1px solid var(--line); }
.acc-row .sub { font-size: 12px; color: var(--muted); margin-left: 8px; }

/* ── 列表 ── */
.list { background: var(--paper); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
.row { display: flex; align-items: center; gap: 14px; padding: 13px 16px; width: 100%; text-align: left; }
.row + .row { border-top: 1px solid var(--line); }
.row .grow { flex: 1; min-width: 0; }
.row .main { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 15px; font-weight: 500; }
.row .sub { font-size: 12px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .amt { font-size: 15px; font-weight: 600; white-space: nowrap; }
.row .chev { color: var(--muted); }
/* 分類圖示格 */
.avatar { flex: none; width: 44px; height: 44px; border-radius: 14px; background: var(--bg); display: grid; place-items: center; color: var(--ink); }
.avatar.in { background: color-mix(in srgb, var(--good) 14%, var(--paper)); color: var(--good); }
.avatar.move { color: var(--ink-2); }
.row .right { flex: none; text-align: right; }
.row .time { font-size: 12px; color: var(--muted); margin-top: 2px; }
.amt.in { color: var(--good); }
.amt.move { color: var(--muted); }
.date-head { font-size: 13px; color: var(--muted); letter-spacing: .04em; margin: 22px 6px 10px; display: flex; justify-content: space-between; align-items: center; }
.date-head .add { color: var(--accent-ink); font-size: 13px; font-weight: 600; letter-spacing: 0; }
.empty { text-align: center; color: var(--muted); padding: 28px 16px; font-size: 14px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat { background: var(--paper); border-radius: 18px; padding: 12px 14px; box-shadow: var(--shadow); }
.stat .k { font-size: 11px; color: var(--muted); letter-spacing: .08em; }
.stat .v { font-size: 17px; font-weight: 700; margin-top: 2px; }
.select {
  width: 100%; padding: 13px 40px 13px 18px; border-radius: 999px; border: 0; box-shadow: var(--shadow); appearance: none; -webkit-appearance: none; font-size: 16px; font-weight: 600;
  background: var(--paper) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' fill='none' stroke='%239a8c79' stroke-width='1.5' stroke-linecap='round'/></svg>") no-repeat right 18px center;
}

/* ── 底部卡片 ── */
.backdrop { position: fixed; inset: 0; background: rgba(43, 33, 26, .34); opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 20; }
.backdrop.show { opacity: 1; pointer-events: auto; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 21;
  max-width: 560px; margin: 0 auto; max-height: 90vh; overflow-y: auto; overscroll-behavior: contain;
  background: var(--paper); border-radius: 28px 28px 0 0;
  padding: 10px 22px calc(env(safe-area-inset-bottom) + 18px);
  transform: translateY(105%); transition: transform .3s cubic-bezier(.2, .8, .2, 1);
  box-shadow: 0 -10px 40px rgba(43, 33, 26, .14);
}
.sheet.show { transform: translateY(0); }
.sheet .grip { width: 36px; height: 4px; border-radius: 2px; background: var(--line-2); margin: 2px auto 14px; }
.sheet h3 { margin: 0 0 16px; font-size: 18px; font-weight: 700; letter-spacing: .02em; }
.seg { display: flex; background: var(--track); border-radius: 999px; padding: 4px; margin-bottom: 18px; }
.seg button { flex: 1; padding: 9px 0; border-radius: 999px; font-size: 14px; font-weight: 600; color: var(--ink-2); letter-spacing: .06em; }
.seg button.on { background: var(--ink); color: var(--on-dark); box-shadow: 0 2px 6px rgba(43, 33, 26, .2); }
.amount-row { display: flex; align-items: baseline; gap: 6px; border-bottom: 1px solid var(--line); padding-bottom: 6px; }
.amount-row .cur { font-size: 22px; color: var(--muted); }
.amount-input { flex: 1; min-width: 0; font-size: 40px; font-weight: 700; border: 0; background: none; padding: 0; }
.amount-input:focus, .note-input:focus { outline: none; }
.amount-row:focus-within, .note-input:focus { border-bottom-color: var(--accent-ink); }
.note-input { width: 100%; border: 0; background: none; font-size: 16px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.note-input::placeholder, .amount-input::placeholder { color: var(--muted); }
.field { padding: 16px 0 0; }
.field > label:not(.check), .field > .label { display: block; font-size: 12px; color: var(--muted); letter-spacing: .1em; margin-bottom: 10px; }
.field input[type=text], .field input[type=number], .field input[type=time], .field select {
  width: 100%; padding: 12px 16px; border: 0; border-radius: 14px; background: var(--bg); font-size: 16px;
}
.field input:focus, .field select:focus, .check input[type=number]:focus { outline: none; box-shadow: inset 0 0 0 2px var(--accent); }
.field .inline { display: flex; gap: 10px; }
.field .inline > * { flex: 1; min-width: 0; }
.sub-chips { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line-2); }
.check { display: flex; align-items: center; gap: 12px; padding: 12px 0; }
.check + .check { border-top: 1px solid var(--line); }
.check input[type=checkbox], .check input[type=radio] { width: 20px; height: 20px; accent-color: var(--ink); flex: none; }
.check .grow { flex: 1; }
.check input[type=number] { width: 116px; padding: 9px 14px; border: 0; border-radius: 12px; background: var(--bg); text-align: right; }
.budget-line { margin-top: 16px; padding: 12px 16px; border-radius: 16px; background: var(--bg); font-size: 13px; color: var(--ink-2); }
.budget-line.over { background: var(--warn-soft); color: var(--ink); }
.actions { display: flex; gap: 10px; margin-top: 22px; position: sticky; bottom: 0; background: var(--paper); padding-top: 6px; }
.actions .btn { flex: 1; }
.actions .btn.primary { flex: 2; }
.steps { font-size: 12px; color: var(--muted); letter-spacing: .12em; margin-bottom: 6px; }
.kv { display: flex; justify-content: space-between; padding: 8px 0; font-size: 15px; }
.kv.total { border-top: 1px solid var(--line); margin-top: 6px; padding-top: 12px; font-weight: 700; }
.time-row { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; font-size: 14px; color: var(--ink-2); }
.time-row input { width: auto !important; padding: 8px 14px !important; }

/* 日期選擇器 */
.picker { margin-top: 12px; padding: 14px; border-radius: 18px; background: var(--bg); }
.picker-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; font-size: 15px; font-weight: 600; }
.picker-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center; }
.picker-grid .h { font-size: 11px; color: var(--muted); padding: 4px 0; }
.picker-grid button { aspect-ratio: 1; border-radius: 50%; font-size: 14px; display: grid; place-items: center; position: relative; }
.picker-grid button.today { color: var(--accent-ink); font-weight: 700; }
.picker-grid button.sel { background: var(--ink); color: var(--on-dark); }
.picker-grid button:disabled { color: var(--line-2); }
.picker-grid button.has::after { content: ''; position: absolute; bottom: 5px; width: 4px; height: 4px; border-radius: 50%; background: var(--accent); }
.picker-grid button.sel.has::after { background: var(--accent); }

.toast {
  position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 84px); z-index: 30;
  transform: translateX(-50%) translateY(16px); opacity: 0; transition: opacity .25s ease, transform .25s ease;
  background: var(--ink); color: var(--on-dark); padding: 12px 20px; border-radius: 999px; font-size: 14px; letter-spacing: .04em;
  max-width: calc(100% - 40px); pointer-events: none; box-shadow: 0 10px 30px rgba(43, 33, 26, .25);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast { display: flex; align-items: center; gap: 14px; white-space: nowrap; }
.toast span { overflow: hidden; text-overflow: ellipsis; }
.toast.has-action.show { pointer-events: auto; }
.toast-undo { color: var(--accent); font-weight: 700; padding: 4px 2px; letter-spacing: .08em; flex: none; }
.loading { text-align: center; color: var(--muted); padding: 48px 0; font-size: 14px; letter-spacing: .08em; }

/* ── 統計 ── */
.heat0 { background: var(--track); }
.heat1 { background: color-mix(in srgb, var(--accent) 22%, var(--paper)); }
.heat2 { background: color-mix(in srgb, var(--accent) 45%, var(--paper)); }
.heat3 { background: color-mix(in srgb, var(--accent) 72%, var(--paper)); }
.heat4 { background: var(--accent); }
.stat-nav { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
.stat-title { flex: 1; text-align: center; font-size: 18px; font-weight: 700; letter-spacing: .04em; }
.stat-title .link { display: block; margin: 2px auto 0; font-size: 12px; }
.legend { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 14px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.lg-box { display: inline-block; width: 11px; height: 11px; border-radius: 3px; }
.lg-box.over { background: var(--warn); }
.lg-line { display: inline-block; width: 16px; border-top: 1.5px dashed var(--ink-2); }

.week-chart { display: flex; gap: 4px; height: 200px; }
.wk-col { flex: 1; display: flex; flex-direction: column; border-radius: 12px; }
.wk-col.sel { background: var(--track); }
.wk-plot { position: relative; flex: 1; margin: 20px 6px 0; }
.wk-bar { position: absolute; left: 14%; right: 14%; bottom: 0; background: var(--accent); border-radius: 8px; }
.wk-bar.over { background: var(--warn); }
.wk-val { position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%); font-size: 11px; font-weight: 600; color: var(--ink); white-space: nowrap; padding-bottom: 3px; }
.wk-line { position: absolute; left: -2px; right: -2px; border-top: 1.5px dashed var(--ink-2); opacity: .5; z-index: 1; }
.wk-day { font-size: 12px; text-align: center; padding: 8px 0 4px; line-height: 1.35; color: var(--ink-2); }
.wk-day.today { color: var(--ink); font-weight: 700; }

.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.cal-head { text-align: center; font-size: 11px; color: var(--muted); padding-bottom: 6px; letter-spacing: .1em; }
.cal-cell { aspect-ratio: 1 / 1.1; border-radius: 12px; padding: 5px 2px 4px; display: flex; flex-direction: column; justify-content: space-between; align-items: center; min-width: 0; }
.cal-cell.blank { background: none; }
.cal-cell.future { opacity: .4; }
.cal-cell.today .cal-d { font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }
.cal-cell.sel { box-shadow: 0 0 0 2px var(--ink); }
.cal-d { font-size: 12px; line-height: 1; display: flex; gap: 2px; align-items: center; }
.cal-v { font-size: 10.5px; line-height: 1.1; white-space: nowrap; overflow: hidden; max-width: 100%; }
.pay { font-style: normal; font-size: 9px; background: var(--ink); color: var(--on-dark); border-radius: 4px; padding: 1px 3px; line-height: 1.1; }

.share-row { display: block; width: 100%; text-align: left; padding: 12px 0; }
.share-row + .share-row, .share-sub + .share-row { border-top: 1px solid var(--line); }
.share-top { display: flex; justify-content: space-between; font-size: 15px; }
.share-sub { display: flex; justify-content: space-between; font-size: 14px; padding: 5px 0 5px 18px; color: var(--ink-2); }

.year-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.mini-month { background: var(--paper); border-radius: 18px; padding: 10px; text-align: left; box-shadow: var(--shadow); }
.mini-title { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; margin-bottom: 8px; }
.mini-title .muted { font-size: 11px; }
.mini-cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
.mini { display: block; aspect-ratio: 1; border-radius: 2px; }
.mini.blank { background: none; }
.mini.future { opacity: .35; }
.mini.today { box-shadow: 0 0 0 1.5px var(--ink); }
</style>

  <script>
'use strict';
/* 記帳 App — 前端
 * 資料流：畫面讀本機快取 → 記帳先改本機、排進上傳佇列 → 背景送到 Apps Script → 以伺服器回傳的彙總為準。
 */
const CARRY = '(上期滾入)';
const K_CACHE = 'ledger.cache.v1';
const K_QUEUE = 'ledger.queue.v1';
const K_PREF = 'ledger.pref.v1';

const $ = (s, el) => (el || document).querySelector(s);
const $$ = (s, el) => Array.from((el || document).querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = n => (n < 0 ? '-' : '') + '$' + Math.abs(Math.round(n || 0)).toLocaleString('en-US');
const pad = n => String(n).padStart(2, '0');
const byOrder = (a, b) => (a.order || 0) - (b.order || 0);
const WEEK = ['日', '一', '二', '三', '四', '五', '六'];

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* 無法寫入時仍可使用 */ } },
  del(k) { try { localStorage.removeItem(k); } catch (e) { /* ignore */ } }
};

const S = {
  data: null, txs: [], queue: store.get(K_QUEUE, []), pref: store.get(K_PREF, {}),
  tab: 'home', syncing: false, syncError: false, historyCycle: null, historyCache: {}, sheetHandler: null
};

S.stats = { mode: S.pref.statsMode || 'month', anchor: Date.now(), sel: null, withFixed: false, open: null };
S.years = {}; // 年份 → 伺服器的日彙總 { yyyyMMdd: { 分類編號: 金額 } }；null 代表讀取失敗
S.staleYears = {}; // 有舊日期的修改還在上傳中的年份

function persist() { store.set(K_CACHE, { data: S.data, txs: S.txs }); store.set(K_QUEUE, S.queue); }
function savePref() { store.set(K_PREF, S.pref); }
function newId() { return 't' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

/* 伺服器呼叫：本機測試用模擬的 google.script.run；GitHub Pages 上改用 fetch 帶金鑰呼叫 Apps Script。 */
const K_KEY = 'ledger.key.v1';
const onGas = !!(window.google && google.script && google.script.run);
function call(fn, ...args) {
  if (onGas) {
    return new Promise((resolve, reject) => {
      google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fn](...args);
    });
  }
  const k = store.get(K_KEY, '');
  if (!k) return Promise.reject(new Error('AUTH:'));
  // text/plain 不會觸發 CORS 預檢，Apps Script 才收得到
  return fetch(window.LEDGER_API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ k, fn, args }) })
    .then(r => r.json())
    .then(res => { if (!res.ok) throw new Error(res.error); return res.data; });
}
const rawMsg = e => String((e && e.message) || e);
// 金鑰錯誤（AUTH:）不算使用者錯誤：待上傳的紀錄要留著，等重新設定金鑰後再送
const isUserError = e => /E:/.test(rawMsg(e));
const isAuthError = e => /AUTH:/.test(rawMsg(e));
const errMsg = e => rawMsg(e).replace(/^.*?(E|AUTH):/, '');

/* ───────────── 查詢小工具 ───────────── */

const acc = id => S.data.accounts.find(a => a.id === id);
const cat = id => S.data.categories.find(c => c.id === id);
const activeAccounts = type => S.data.accounts.filter(a => !a.disabled && (!type || a.type === type)).sort(byOrder);
const activeCats = kinds => S.data.categories.filter(c => !c.disabled && (!kinds || kinds.includes(c.kind))).sort(byOrder);
const kindsForType = t => t === '支出' ? ['支出'] : t === '收入' ? ['收入'] : ['資產配置', '轉帳'];
function groupsOf(kinds) {
  const out = [];
  activeCats(kinds).forEach(c => { if (!out.includes(c.group)) out.push(c.group); });
  return out;
}
const expenseGroups = () => groupsOf(['支出']);
function catLabel(c) {
  if (!c) return '未分類';
  return ['收入', '轉帳', '資產配置'].includes(c.group) ? c.name : c.group + '・' + c.name;
}
const accName = id => (acc(id) || {}).name || '未指定';

const cycles = () => S.data.cycles || [];
const currentCycle = () => cycles()[cycles().length - 1];
function cycleFor(time) {
  let id = cycles().length ? cycles()[0].id : '';
  cycles().forEach(cy => { if (cy.start <= time) id = cy.id; });
  return id;
}
const budgetOf = cid => (S.data.budgets || {})[cid] || {};
function sumBy(cid, pick) {
  const out = {};
  Object.keys(S.data.summary || {}).forEach(k => {
    const [c, catId] = k.split('|');
    if (c !== cid) return;
    const ct = cat(catId);
    const key = ct && pick(ct);
    if (key) out[key] = (out[key] || 0) + S.data.summary[k];
  });
  return out;
}
const spentByGroup = cid => sumBy(cid, c => c.kind === '支出' ? c.group : null);
const kindTotal = (cid, kind) => sumBy(cid, c => c.kind === kind ? 'x' : null).x || 0;
function unallocated(cid) {
  const b = budgetOf(cid);
  let allocated = 0;
  Object.keys(b).forEach(g => { if (g !== CARRY) allocated += b[g]; });
  return kindTotal(cid, '收入') + (b[CARRY] || 0) - kindTotal(cid, '資產配置') - allocated;
}

/* ───────────── 時間 ───────────── */

const startOfDay = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
function fmtTime(ms) {
  const d = new Date(ms);
  const hm = pad(d.getHours()) + ':' + pad(d.getMinutes());
  return startOfDay(d).getTime() === startOfDay(new Date()).getTime() ? hm : (d.getMonth() + 1) + '/' + d.getDate() + ' ' + hm;
}
const fmtDay = ms => { const d = new Date(ms); return (d.getMonth() + 1) + '月' + d.getDate() + '日 週' + WEEK[d.getDay()]; };
const fmtDate = ms => { const d = new Date(ms); return (d.getMonth() + 1) + '/' + d.getDate(); };
function toLocalInput(ms) {
  const d = new Date(ms);
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes());
}

/* ───────────── 本機帳務（與伺服器 effect_ 相同邏輯） ───────────── */

function applyLocal(tx, sign) {
  if (!tx || tx.void) return;
  const a = tx.amount * sign;
  const b = S.data.balances;
  if (tx.from) b[tx.from] = (b[tx.from] || 0) - a;
  if (tx.to) b[tx.to] = (b[tx.to] || 0) + a;
  if (tx.categoryId && tx.cycleId) {
    const k = tx.cycleId + '|' + tx.categoryId;
    S.data.summary[k] = (S.data.summary[k] || 0) + a;
  }
}

function commitTx(tx, prev, learn) {
  tx.cycleId = cycleFor(tx.time);
  tx.updated = Date.now();
  invalidateStats(tx, prev);
  if (prev) applyLocal(prev, -1);
  applyLocal(tx, 1);
  S.txs = S.txs.filter(t => t.id !== tx.id).concat([tx]);
  if (learn) learnLocal(learn);
  enqueue({ op: 'saveTx', tx: tx, learn: learn || null });
}

function removeTx(prev) {
  invalidateStats(null, prev);
  applyLocal(prev, -1);
  S.txs = S.txs.filter(t => t.id !== prev.id);
  enqueue({ op: 'deleteTx', id: prev.id });
}

function learnLocal(l) {
  const kw = l.keyword.trim().replace(/\s+/g, ' ');
  const hit = S.data.keywords.find(k => k.keyword === kw);
  if (hit) { hit.categoryId = l.categoryId; hit.accountId = l.accountId || hit.accountId; hit.count = (hit.count || 0) + 1; hit.last = Date.now(); }
  else S.data.keywords.unshift({ keyword: kw, categoryId: l.categoryId, accountId: l.accountId || '', count: 1, last: Date.now() });
}

/* ───────────── 同步 ───────────── */

function enqueue(item) {
  S.queue.push(item);
  persist();
  render();
  flush();
}

async function flush() {
  if (S.syncing || !S.queue.length) return;
  S.syncing = true;
  renderSync();
  let last = null;
  let dropped = false;
  while (S.queue.length) {
    const item = S.queue[0];
    try {
      last = item.op === 'saveTx'
        ? await call('api_saveTx', item.tx, item.learn)
        : await call('api_deleteTx', item.id);
      S.queue.shift();
      S.syncError = false;
      persist();
    } catch (e) {
      if (isUserError(e)) {
        S.queue.shift();
        dropped = true;
        persist();
        toast('有一筆紀錄上傳失敗：' + errMsg(e));
        continue;
      }
      S.syncing = false;
      S.syncError = true;
      renderSync();
      setTimeout(flush, 15000);
      return;
    }
  }
  S.syncing = false;
  if (last) mergeLedger(last);
  Object.keys(S.staleYears).forEach(y => { delete S.years[y]; });
  S.staleYears = {};
  persist();
  render();
  if (dropped) refresh(true);
}

function mergeLedger(st) {
  S.data.balances = st.balances;
  S.data.summary = st.summary;
  S.data.budgets = Object.assign({}, S.data.budgets, st.budgets);
}

function setData(d) {
  S.txs = d.recent || S.txs;
  delete d.recent;
  S.data = d;
  S.historyCache = {};
  S.years = {};
  persist();
  render();
}

async function refresh(silent) {
  try {
    const d = await call('api_bootstrap');
    if (S.queue.length) return; // 還有待上傳的紀錄，等上傳完再以伺服器為準
    setData(d);
    S.syncError = false;
    renderSync();
  } catch (e) {
    S.syncError = true;
    renderSync();
    if (isAuthError(e)) { renderKeySetup(errMsg(e)); return; }
    if (!S.data) {
      $('#view').innerHTML = '<div class="loading">無法載入：' + esc(errMsg(e)) + '<br><br><button class="btn primary" type="button" onclick="start()">重試</button></div>';
    } else if (!silent) toast('無法連線，目前顯示本機資料');
  }
}

/* ───────────── 畫面：共用 ───────────── */

/** 提示訊息。undo：顯示「復原」按鈕，5 秒內可以按。 */
function toast(msg, undo) {
  const t = $('#toast');
  t.innerHTML = '<span>' + esc(msg) + '</span>' + (undo ? '<button type="button" class="toast-undo">復原</button>' : '');
  t.classList.toggle('has-action', !!undo);
  if (undo) $('.toast-undo', t).onclick = () => { t.classList.remove('show'); undo(); };
  t.classList.add('show');
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => t.classList.remove('show'), undo ? 5000 : 2600);
}

function renderSync() {
  const b = $('#syncBadge');
  const n = S.queue.length;
  b.className = 'sync';
  if (S.syncing) { b.textContent = '同步中'; b.classList.add('pending'); }
  else if (n && S.syncError) { b.textContent = '離線・' + n + ' 筆待上傳'; b.classList.add('error'); }
  else if (n) { b.textContent = n + ' 筆待上傳'; b.classList.add('pending'); }
  else if (S.syncError) { b.textContent = '離線'; b.classList.add('error'); }
  else b.textContent = '已同步';
}

const TAB_TITLES = { history: '明細', stats: '統計', settings: '設定' };

function render() {
  renderSync();
  if (!S.data) return;
  const now = new Date();
  const cy = currentCycle();
  $('#title').textContent = S.tab === 'home' ? (now.getMonth() + 1) + '月' + now.getDate() + '日' : TAB_TITLES[S.tab];
  let sub = '週' + WEEK[now.getDay()];
  if (cy) sub += '・本期第 ' + (Math.floor((startOfDay(now) - startOfDay(new Date(cy.start))) / 864e5) + 1) + ' 天';
  $('#cycleInfo').textContent = S.tab === 'home' ? sub : '';
  $$('.tabbar button').forEach(b => b.classList.toggle('on', b.dataset.tab === S.tab));
  if (S.tab === 'home') renderHome();
  else if (S.tab === 'history') renderHistory();
  else if (S.tab === 'stats') renderStats();
  else renderSettings();
}

/* 分類圖示（Phosphor 線條圖示）：先看子類，再看大類；自訂的分類沒有對應時用包裹 */
const SUB_ICONS = {
  薪資: 'money', 獎金: 'sparkle', 投資收益: 'trend-up', 其他收入: 'coins', 孝親費: 'hand-heart', 訂閱: 'repeat', 分期付款: 'receipt', 其他固定: 'push-pin',
  交通: 'train', 日用品: 'basket', 車費: 'taxi', 禮物: 'gift', 娛樂: 'film-slate', 禮金: 'envelope', 購物: 'shopping-bag', 醫療: 'pill', 學習: 'books', 雜支: 'wrench',
  ETF定期定額: 'chart-line-up', 單筆投資: 'chart-bar', 儲蓄: 'piggy-bank', 帳戶互轉: 'arrows-left-right', 信用卡繳費: 'credit-card'
};
const FOOD_ICONS = { 日常: 'fork-knife', 約會: 'wine', 聚會: 'beer-stein' };
const GROUP_ICONS = { 日常: 'package', 約會: 'gift', 聚會: 'beer-stein', 其他花費: 'shopping-bag', 固定支出: 'push-pin', 收入: 'money', 資產配置: 'chart-line-up', 轉帳: 'arrows-left-right' };
function catIcon(c) {
  if (!c) return 'package';
  if (c.name === '伙食' && FOOD_ICONS[c.group]) return FOOD_ICONS[c.group];
  return SUB_ICONS[c.name] || GROUP_ICONS[c.group] || 'package';
}

function txRow(t) {
  const c = cat(t.categoryId);
  const sign = t.type === '支出' ? '-' : t.type === '收入' ? '+' : '';
  const cls = t.type === '支出' ? 'out' : t.type === '收入' ? 'in' : 'move';
  const where = t.type === '支出' ? accName(t.from) : t.type === '收入' ? accName(t.to) : accName(t.from) + ' → ' + accName(t.to);
  const extra = t.symbol ? '・' + t.symbol + (t.shares ? ' ' + t.shares + ' 股' : '') : '';
  // 大類由圖示表達，說明只寫子類與帳戶；時間放到金額下方，一行最多一個「・」
  return '<button class="row" type="button" data-tx="' + esc(t.id) + '">' +
    '<div class="avatar ' + cls + '">' + icon(catIcon(c)) + '</div>' +
    '<div class="grow"><div class="main">' + esc(t.note || catLabel(c)) + '</div>' +
    '<div class="sub">' + esc(c ? c.name : '未分類') + '・' + esc(where) + esc(extra) + '</div></div>' +
    '<div class="right"><div class="amt ' + cls + ' num">' + sign + money(t.amount).replace('-', '') + '</div>' +
    '<div class="time num">' + fmtTime(t.time) + '</div></div></button>';
}

/* 補記日期：首頁的日期膠囊。選了過去的日期後，接下來的記帳都記在那天，離開 App 就自動回到今天。 */
function entryTime(base) {
  if (!S.entryDay) return base || Date.now();
  const d = keyDate(S.entryDay);
  const t = new Date(base || Date.now());
  return new Date(d.getFullYear(), d.getMonth(), d.getDate(), t.getHours(), t.getMinutes()).getTime();
}
const timeOnDay = key => { const d = keyDate(key); const n = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate(), n.getHours(), n.getMinutes()).getTime(); };
const dayLabel = key => { const d = keyDate(key); return (d.getMonth() + 1) + '/' + d.getDate() + ' 週' + WEEK[d.getDay()]; };

/** 月曆選日期（記帳卡片與日期膠囊共用）。has：有紀錄的日期會加小點。 */
function pickerHtml(selKey, anchor, has) {
  const first = new Date(anchor.getFullYear(), anchor.getMonth(), 1);
  const next = new Date(anchor.getFullYear(), anchor.getMonth() + 1, 1);
  const todayKey = dayKey(new Date());
  let h = '<div class="picker"><div class="picker-nav">' +
    '<button type="button" class="icon-btn" data-act="pnav" data-v="-1" aria-label="上個月">' + icon('caret-left') + '</button>' +
    '<span>' + first.getFullYear() + '年' + (first.getMonth() + 1) + '月</span>' +
    '<button type="button" class="icon-btn" data-act="pnav" data-v="1" aria-label="下個月"' + (next > new Date() ? ' disabled' : '') + '>' + icon('caret-right') + '</button></div>' +
    '<div class="picker-grid">' + WEEK_MON.map(w => '<span class="h">' + w + '</span>').join('') +
    '<span></span>'.repeat((first.getDay() + 6) % 7);
  for (let d = first; d < next; d = addDays(d, 1)) {
    const k = dayKey(d);
    h += '<button type="button" data-act="pick" data-v="' + k + '" class="' + [k === todayKey ? 'today' : '', k === selKey ? 'sel' : '', has && has[k] ? 'has' : ''].join(' ') + '"' +
      (k > todayKey ? ' disabled' : '') + '>' + d.getDate() + '</button>';
  }
  return h + '</div></div>';
}

function recordedDays() {
  const out = {};
  S.txs.forEach(t => { out[dayKey(new Date(t.time))] = true; });
  return out;
}

function openDayPicker() {
  let anchor = S.entryDay ? keyDate(S.entryDay) : new Date();
  const draw = () => openSheet('<h3>要記在哪一天？</h3>' +
    '<div class="chips wrap">' + [0, -1, -2].map(n => {
      const k = dayKey(addDays(new Date(), n));
      const on = (S.entryDay || dayKey(new Date())) === k;
      return '<button type="button" class="chip' + (on ? ' on' : '') + '" data-act="pick" data-v="' + k + '">' + ['今天', '昨天', '前天'][-n] + '</button>';
    }).join('') + '</div>' +
    pickerHtml(S.entryDay || dayKey(new Date()), anchor, recordedDays()) +
    '<div class="small muted" style="margin-top:12px">有小點的日期代表已經有紀錄。選好之後，接下來記的帳都會記在那天，離開 App 會自動回到今天。</div>',
  (act, v) => {
    if (act === 'pnav') { anchor = new Date(anchor.getFullYear(), anchor.getMonth() + Number(v), 1); draw(); }
    else if (act === 'pick') {
      S.entryDay = v === dayKey(new Date()) ? null : v;
      closeSheet();
      render();
      setTimeout(() => { const i = $('#quickInput'); if (i) i.focus(); }, 250);
    }
  });
  draw();
}

function bindTxRows(root) {
  $$('[data-tx]', root).forEach(el => el.onclick = () => {
    const t = S.txs.find(x => x.id === el.dataset.tx) || findHistoryTx(el.dataset.tx);
    if (t) openEntry(t);
  });
}

/* ───────────── 首頁 ───────────── */

function cardReminders() {
  const today = startOfDay(new Date());
  const ym = today.getFullYear() + '-' + (today.getMonth() + 1);
  const dismissed = S.pref.dismiss || {};
  const out = [];
  activeAccounts('信用卡').forEach(a => {
    const bal = S.data.balances[a.id] || 0;
    if (bal >= 0 || !a.dueDay || dismissed[a.id] === ym) return;
    const dim = new Date(today.getFullYear(), today.getMonth() + 1, 0).getDate();
    const due = new Date(today.getFullYear(), today.getMonth(), Math.min(a.dueDay, dim));
    const diff = Math.round((due - today) / 864e5);
    if (diff > 5 || diff < -3) return;
    const when = diff === 0 ? '今天' : diff > 0 ? diff + ' 天後' : '已過 ' + (-diff) + ' 天';
    out.push({ a, bal, when, ym });
  });
  return out;
}

function renderHome() {
  const cy = currentCycle();
  const kws = S.data.keywords.filter(k => k.count > 0).sort((a, b) => b.count - a.count || (b.last || 0) - (a.last || 0)).slice(0, 6);
  const past = !!S.entryDay;
  // 大數字：可以用的錢（現金＋銀行，信用卡未繳是負數所以會自動扣掉）；點下去看淨資產與理財
  let h = '<div class="section"><button type="button" class="hero" id="assetCard">' +
    '<div class="hero-label"><span>可以用的錢</span><span class="link">淨資產' + icon('caret-right') + '</span></div>' +
    '<div class="hero-value num">' + money(balanceSum(a => a.type !== '理財')) + '</div>' +
    '<div class="hero-sub">現金＋銀行，已扣信用卡未繳</div></button></div>';

  h += '<div class="section"><form class="quick" id="quickForm">' +
    '<button type="button" class="date-pill' + (past ? ' past' : '') + '" id="dayPill" aria-label="選擇記帳日期">' + (past ? dayLabel(S.entryDay) : '今天') + icon('caret-down') + '</button>' +
    '<input id="quickInput" type="text" placeholder="午餐 150" autocomplete="off" enterkeyhint="done" aria-label="快速記帳">' +
    '<button class="go" type="submit" aria-label="記帳">' + icon('arrow-right') + '</button></form>' +
    (past ? '<div class="backfill-note"><span>正在補記 ' + dayLabel(S.entryDay) + ' 的帳</span><button type="button" class="link" id="backToday">回到今天</button></div>' : '') +
    '<div class="chips">' + kws.map(k => '<button class="chip" type="button" data-kw="' + esc(k.keyword) + '">' + esc(k.keyword) + '</button>').join('') +
    '<button class="chip ghost" type="button" id="manualBtn">' + icon('plus') + '手動</button></div>';

  if (S.data.needsRecalc) {
    h += '<div class="notice warn"><div class="grow">試算表被手動修改過，建議重新計算。</div><button class="btn" type="button" id="recalcBtn">重新計算</button></div>';
  }
  cardReminders().forEach(r => {
    h += '<div class="notice"><div class="grow">' + esc(r.a.name) + ' 繳費日' + r.when + '<div class="small muted num">未繳 ' + money(-r.bal) + '</div></div>' +
      '<button class="btn" type="button" data-pay="' + esc(r.a.id) + '">繳費</button>' +
      '<button class="icon-btn" type="button" data-dismiss="' + esc(r.a.id) + '" aria-label="本月不再提醒">' + icon('x') + '</button></div>';
  });
  h += '</div>';

  // 本週支出（週一到今天）：不含固定支出，今天那根用深色標出來
  const wk = weekSpend();
  const top = Math.max(1, ...wk.days.map(d => d.v));
  h += '<div class="section"><button type="button" class="week-card" id="weekCard">' +
    '<div class="wc-top"><span>本週支出</span><span class="wc-link">看統計' + icon('caret-right') + '</span></div>' +
    '<div class="wc-value num">' + money(wk.total) + '</div><div class="wc-bars">' +
    wk.days.map(d => '<div class="wc-col' + (d.today ? ' today' : '') + '"><i class="wc-bar" style="height:' + (d.v / top * 100).toFixed(1) + '%"></i><span class="wc-day">' + d.label + '</span></div>').join('') +
    '</div></button></div>';

  // 預算：一個大類一張卡
  if (cy) {
    const b = budgetOf(cy.id);
    const spent = spentByGroup(cy.id);
    // 固定支出在發薪日就付清了，每天看它只是雜訊；只有超支時才顯示
    const fg = fixedGroups();
    const groups = expenseGroups().filter(g => (b[g] || spent[g]) && (!fg[g] || (spent[g] || 0) > (b[g] || 0)));
    const un = unallocated(cy.id);
    h += '<div class="section"><div class="section-head"><h2>本期預算</h2><button class="link" type="button" id="budgetBtn">調整</button></div>';
    if (!Object.keys(b).length) {
      h += '<div class="card small muted">還沒有設定預算。記下薪資時會帶出預算分配，也可以按「調整」手動設定。</div>';
    } else {
      h += '<div class="budget-head" style="margin:0 4px 10px"><span>尚未分配</span><span class="num ' + (un < 0 ? 'warn' : '') + '">' + money(un) + '</span></div>';
    }
    groups.forEach(g => {
      const bud = b[g] || 0;
      const sp = spent[g] || 0;
      if (!bud) {
        h += '<div class="bcard"><div class="b-top"><span>' + esc(g) + '</span><span class="b-tag">未設定預算</span></div>' +
          '<div class="b-mid num"><span>已花</span><b>' + money(sp) + '</b></div></div>';
        return;
      }
      const over = sp > bud;
      const pct = sp / bud * 100;
      h += '<div class="bcard"><div class="b-top"><span>' + esc(g) + '</span>' +
        '<span class="b-tag num' + (over ? ' over' : '') + '">' + (over ? '超支 ' + money(sp - bud) : '已花 ' + Math.round(pct) + '%') + '</span></div>' +
        '<div class="b-mid num"><span>' + (over ? '' : '剩 ' + money(bud - sp)) + '</span><span><b>' + money(sp) + '</b> / ' + money(bud) + '</span></div>' +
        '<div class="bar' + (over ? ' over' : '') + '"><i style="width:' + Math.min(100, pct).toFixed(1) + '%"></i></div></div>';
    });
    h += '</div>';
  }

  // 最近紀錄
  // 依「記下的先後」排序，補記幾天前的帳也會出現在最上面，方便確認
  const entered = t => t.updated || t.created || t.time;
  const recent = S.txs.slice().sort((a, b) => entered(b) - entered(a)).slice(0, 5);
  h += '<div class="section"><div class="section-head"><h2>最近紀錄</h2><button class="link" type="button" id="moreBtn">全部</button></div><div class="list">' +
    (recent.length ? recent.map(txRow).join('') : '<div class="empty">還沒有紀錄<br>在上方輸入「午餐 150」試試看</div>') + '</div></div>';

  const v = $('#view');
  v.innerHTML = h;
  $('#quickForm').onsubmit = e => {
    e.preventDefault();
    const text = $('#quickInput').value.trim();
    if (!text) { $('#quickInput').focus(); return; }
    $('#quickInput').value = '';
    $('#quickInput').blur();
    const r = parseInput(text);
    if (!r.explicitDate) r.time = entryTime(r.time);
    openEntry(r);
  };
  $('#dayPill').onclick = openDayPicker;
  if ($('#backToday')) $('#backToday').onclick = () => { S.entryDay = null; render(); };
  $$('[data-kw]', v).forEach(el => el.onclick = () => { const i = $('#quickInput'); i.value = el.dataset.kw + ' '; i.focus(); });
  $('#manualBtn').onclick = () => openEntry({ type: '支出', time: entryTime() });
  $$('[data-pay]', v).forEach(el => el.onclick = () => openCardPayment(el.dataset.pay));
  $$('[data-dismiss]', v).forEach(el => el.onclick = () => {
    const r = cardReminders().find(x => x.a.id === el.dataset.dismiss);
    S.pref.dismiss = Object.assign({}, S.pref.dismiss, { [el.dataset.dismiss]: r ? r.ym : '' });
    savePref();
    render();
  });
  $('#assetCard').onclick = openAssets;
  $('#weekCard').onclick = () => { S.tab = 'stats'; S.stats.mode = 'week'; S.stats.anchor = Date.now(); S.stats.sel = null; window.scrollTo(0, 0); render(); };
  if ($('#recalcBtn')) $('#recalcBtn').onclick = doRecalc;
  if ($('#budgetBtn')) $('#budgetBtn').onclick = () => openBudget(cy.id);
  $('#moreBtn').onclick = () => { S.tab = 'history'; render(); };
  bindTxRows(v);
}

/** 本週（週一到週日）每天的變動支出，和統計頁預設一樣不含固定支出。 */
function weekSpend() {
  const mon = mondayOf(new Date());
  const todayKey = dayKey(new Date());
  const fg = fixedGroups();
  const days = WEEK_MON.map((w, i) => ({ k: dayKey(addDays(mon, i)), label: w, v: 0 }));
  S.txs.forEach(t => {
    const c = cat(t.categoryId);
    if (t.void || t.type !== '支出' || !c || c.kind !== '支出' || fg[c.group]) return;
    const d = days.find(x => x.k === dayKey(new Date(t.time)));
    if (d) d.v += t.amount;
  });
  days.forEach(d => { d.today = d.k === todayKey; });
  return { days, total: days.reduce((s, d) => s + d.v, 0) };
}

function balanceSum(pick) {
  let total = 0;
  Object.keys(S.data.balances).forEach(id => { const a = acc(id); if (a && pick(a)) total += S.data.balances[id]; });
  return total;
}

function accRow(a) {
  const bal = S.data.balances[a.id] || 0;
  const shown = a.type === '信用卡' ? (bal < 0 ? '未繳 ' + money(-bal) : money(bal)) : money(bal);
  // 信用卡未繳是正常狀態，不用警示色；只有現金、銀行變負數才標紅
  return '<div class="acc-row"><span>' + esc(a.name) + '<span class="sub">' + esc(a.type) + '</span></span>' +
    '<span class="num ' + (bal < 0 && a.type !== '信用卡' ? 'warn' : '') + '">' + shown + '</span></div>';
}

/** 理財帳戶：有股數與股價就用市值，否則用投入成本。成本＝帳戶餘額（轉進去的減掉轉出來的）。 */
function holding(a) {
  const cost = S.data.balances[a.id] || 0;
  const priced = a.shares != null && a.price > 0;
  const value = priced ? Math.round(a.shares * a.price) : cost;
  // 對帳後又有轉入（例如定期定額）：成本變多了但股數還沒更新，市值會被低估
  const newBuy = priced && S.txs.some(t => t.to === a.id && !t.void && t.time > (a.sharesAt || 0));
  return { cost, value, priced, pnl: value - cost, newBuy };
}

const investValue = () => S.data.accounts.filter(a => a.type === '理財').reduce((s, a) => s + holding(a).value, 0);
const signed = n => (n > 0 ? '+' : n < 0 ? '−' : '') + money(Math.abs(n));
const priceDay = d => d ? (Math.floor(d / 100) % 100) + '/' + (d % 100) : '';

function holdingRow(a) {
  const h = holding(a);
  const left = h.priced ? Number(a.shares).toLocaleString('en-US') + ' 股 × ' + a.price + '（' + priceDay(a.priceDate) + '）'
    : a.symbol ? (a.shares == null ? '點這裡填股數' : '還沒抓到股價') : '沒有代號，以成本計算';
  const pct = h.priced && h.cost > 0 ? '（' + (h.pnl >= 0 ? '+' : '−') + Math.abs(h.pnl / h.cost * 100).toFixed(1) + '%）' : '';
  return '<button type="button" class="share-row" data-act="hold" data-v="' + esc(a.id) + '">' +
    '<div class="share-top"><span>' + esc(a.name) + (a.symbol && a.symbol !== a.name ? ' <span class="muted small">' + esc(a.symbol) + '</span>' : '') + '</span>' +
    '<span class="num">' + money(h.value) + '</span></div>' +
    '<div class="budget-sub num"><span>' + esc(left) + '</span><span class="' + (h.priced ? (h.pnl >= 0 ? 'good' : 'warn') : '') + '">' +
    (h.priced ? signed(h.pnl) + pct : '成本 ' + money(h.cost)) + '</span></div>' +
    (h.newBuy ? '<div class="small accent" style="margin-top:4px">有新買進，記得更新股數</div>' : '') + '</button>';
}

function openAssets() {
  const spendable = activeAccounts().filter(a => a.type !== '理財');
  const invest = activeAccounts('理財');
  const cost = invest.reduce((s, a) => s + holding(a).cost, 0);
  const value = investValue();
  const cash = balanceSum(a => a.type !== '理財');
  openSheet('<h3>淨資產</h3>' +
    '<div class="networth num">' + money(cash + value) + '</div><div class="small muted">理財帳戶以市值計算（沒有股數或股價的以成本計算）</div>' +
    '<div class="field"><div class="label">可以用的錢</div>' + (spendable.length ? spendable.map(accRow).join('') : '<div class="small muted">沒有帳戶</div>') +
    '<div class="kv total"><span>小計</span><span class="num">' + money(cash) + '</span></div></div>' +
    '<div class="field"><div class="label">理財<button type="button" class="link" data-act="prices" style="float:right;letter-spacing:0">更新股價</button></div>' +
    (invest.length ? invest.map(holdingRow).join('') : '<div class="small muted">沒有理財帳戶</div>') +
    '<div class="kv total"><span>市值</span><span class="num">' + money(value) + '</span></div>' +
    '<div class="budget-sub num"><span>投入成本 ' + money(cost) + '</span><span class="' + (value - cost >= 0 ? 'good' : 'warn') + '">' + signed(value - cost) + '</span></div></div>' +
    '<div class="actions"><button class="btn block" type="button" data-act="cancel">關閉</button></div>',
  async (act, v, btn) => {
    if (act === 'cancel') closeSheet();
    else if (act === 'hold') openHoldingForm(v);
    else if (act === 'prices') {
      btn.textContent = '更新中…';
      try {
        const res = await call('api_refreshPrices');
        S.data.accounts = res.accounts;
        persist(); openAssets(); render();
        toast(res.updated ? '已更新 ' + res.updated + ' 檔股價' : '沒有可以更新的股價（需要上市代號）');
      } catch (e) { btn.textContent = '更新股價'; toast('更新股價失敗：' + errMsg(e)); }
    }
  });
}

/** 對帳：填券商 App 裡的庫存股數。 */
function openHoldingForm(id) {
  const a = acc(id);
  openSheet('<h3>對帳：' + esc(a.name) + '</h3>' +
    (a.symbol ? '' : formField('股票／ETF 代號（上市）', '<input id="hSym" type="text" autocapitalize="characters" placeholder="例如：0050">')) +
    formField('目前持有股數', '<input id="hShares" type="number" inputmode="decimal" min="0" value="' + (a.shares == null ? '' : a.shares) + '" placeholder="看券商 App 的庫存股數">') +
    '<div class="small muted">打開券商 App 的「庫存」，把這檔的股數填進來，零股也要算。' + (a.price ? '目前股價 ' + a.price + '（' + priceDay(a.priceDate) + ' 收盤）。' : '') + '</div>' +
    '<div class="actions"><button class="btn" type="button" data-act="back">返回</button><button class="btn primary" type="button" data-act="save">儲存</button></div>',
  async (act, v, btn) => {

        S.data.accounts = res.accounts; S.data.balances = res.balances;

  setTimeout(() => { const i = $('#hShares'); if (i) i.focus(); }, 300);
}

function openCardPayment(cardId) {

  });
}

/* ───────────── 快速輸入解析 ───────────── */

function parseInput(text) {
  let t = ' ' + text.replace(/\s+/g, ' ').trim() + ' ';
  const now = new Date();
  let day = null;
  let hm = null;

  const rel = [['大前天', -3], ['前天', -2], ['昨天', -1], ['昨晚', -1], ['今天', 0], ['今晚', 0]];
  for (const [w, n] of rel) if (t.includes(w)) { day = addDays(startOfDay(now), n); t = t.replace(w, ' '); break; }
  let m = t.match(/(\d{1,2}):(\d{2})/);
  if (m) { hm = [Number(m[1]), Number(m[2])]; t = t.replace(m[0], ' '); }
  m = t.match(/(\d{1,2})月(\d{1,2})[日號]?/) || t.match(/(?:^|\s)(\d{1,2})\/(\d{1,2})(?=\s)/);
  if (m) {
    day = new Date(now.getFullYear(), Number(m[1]) - 1, Number(m[2]));
    if (day - now > 864e5) day = new Date(now.getFullYear() - 1, Number(m[1]) - 1, Number(m[2]));
    t = t.replace(m[0], ' ');
  }
  m = t.match(/(上)?(?:週|星期|禮拜)([一二三四五六日天])/);
  if (m) {
    const wd = '日一二三四五六'.indexOf(m[2] === '天' ? '日' : m[2]);
    const today = now.getDay();
    let diff = (today - wd + 7) % 7;
    if (m[1]) diff = ((today + 6) % 7) + 7 - ((wd + 6) % 7);
    day = addDays(startOfDay(now), -diff);
    t = t.replace(m[0], ' ');
  }

  let amount = '';
  const nums = Array.from(t.matchAll(/(\d[\d,]*(?:\.\d+)?)\s*(?:元|塊)?/g));
  if (nums.length) {
    const last = nums[nums.length - 1];
    amount = Math.round(Number(last[1].replace(/,/g, '')));
    t = t.slice(0, last.index) + ' ' + t.slice(last.index + last[0].length);
  }

  let accountId = '';
  let method = '';
  const accs = activeAccounts().slice().sort((a, b) => b.name.length - a.name.length);
  for (const a of accs) {
    if (a.name.length >= 2 && t.includes(a.name)) { accountId = a.id; t = t.replace(a.name, ' '); break; }
  }
  let tokens = t.trim().split(' ').filter(Boolean);
  if (!accountId) {
    const words = { '刷卡': '信用卡', '信用卡': '信用卡', '卡': '信用卡', '現金': '現金', '扣款': '銀行', '轉帳': '銀行' };
    const i = tokens.findIndex(x => words[x]);
    if (i >= 0) { method = words[tokens[i]]; tokens.splice(i, 1); }
  }

  let time = now.getTime();
  if (day || hm) {
    const d = day || startOfDay(now);
    const [hh, mm] = hm || [now.getHours(), now.getMinutes()];
    time = new Date(d.getFullYear(), d.getMonth(), d.getDate(), hh, mm).getTime();
  }

  const allGroups = groupsOf(null);
  let hint = null;
  if (tokens.length && allGroups.includes(tokens[0])) hint = tokens[0];
  const body = hint ? tokens.slice(1) : tokens;
  const bodyText = body.join(' ');
  const keyword = tokens.join(' ');

  const kws = S.data.keywords;
  let k = kws.find(x => x.keyword === keyword) || (bodyText && kws.find(x => x.keyword === bodyText));
  if (!k) for (const tok of body) { k = kws.find(x => x.keyword === tok); if (k) break; }
  if (!k && bodyText) k = kws.filter(x => x.keyword.length >= 2 && bodyText.includes(x.keyword)).sort((a, b) => b.keyword.length - a.keyword.length)[0];
  let c = k ? cat(k.categoryId) : null;
  if (c && c.disabled) c = null;
  if (!c && bodyText) c = activeCats(null).find(x => x.name.length >= 2 && x.name !== '其他' && bodyText.includes(x.name));
  if (hint && (!c || c.group !== hint)) {
    const inGroup = activeCats(null).filter(x => x.group === hint);
    c = (c && inGroup.find(x => x.name === c.name)) || inGroup[0];
  }
  if (!accountId && k && k.accountId && acc(k.accountId) && !acc(k.accountId).disabled) accountId = k.accountId;
  if (!accountId && method) {
    const list = activeAccounts(method);
    const last = acc(S.pref.lastFrom);
    accountId = (last && last.type === method && !last.disabled ? last : list[0] || {}).id || '';
  }

  const type = !c ? '支出' : c.kind === '收入' ? '收入' : c.kind === '支出' ? '支出' : '轉帳';
  return {
    type, amount, time, keyword, explicitDate: !!(day || hm),
    note: bodyText || keyword,
    categoryId: c ? c.id : '',
    from: type === '收入' ? '' : accountId,
    to: type === '收入' ? accountId : '',
    unmatched: !c && !!bodyText
  };
}

/* ───────────── 底部卡片 ───────────── */

function openSheet(html, handler) {
  const s = $('#sheet');
  s.innerHTML = '<div class="grip"></div>' + html;
  S.sheetHandler = handler || null;
  S.isDirty = null; // 表單類的卡片會設定：有未儲存內容時，點外面要再點一次才關
  s.classList.add('show');
  $('#backdrop').classList.add('show');
  return s;
}
function closeSheet() {
  $('#sheet').classList.remove('show');
  $('#backdrop').classList.remove('show');
  S.sheetHandler = null;
  S.isDirty = null;
  S.backdropWarned = false;
}
function busy(btn, on) {
  if (!btn) return;
  btn.disabled = on;
  if (on) { btn.dataset.label = btn.textContent; btn.textContent = '處理中…'; }
  else if (btn.dataset.label) btn.textContent = btn.dataset.label;
}

/* ───────────── 記帳確認卡片 ───────────── */

let E = null;

function openEntry(init) {
  const prev = init.id ? (S.txs.find(t => t.id === init.id) || findHistoryTx(init.id) || init) : null;
  E = {
    id: init.id || null, prev: prev ? Object.assign({}, prev) : null,
    type: init.type || '支出', amount: init.amount || '', note: init.note || '',
    categoryId: init.categoryId || '', from: init.from || '', to: init.to || '',
    time: init.time || Date.now(), symbol: init.symbol || '', shares: init.shares == null ? '' : init.shares,
    keyword: init.keyword || '', unmatched: !!init.unmatched, confirmDelete: false
  };
  fillDefaults();
  renderEntry();
  if (!E.amount) setTimeout(() => { const i = $('#eAmount'); if (i) i.focus(); }, 300);
}

function fillDefaults() {
  const kinds = kindsForType(E.type);
  const c = cat(E.categoryId);
  if (!c || !kinds.includes(c.kind)) {
    const first = activeCats(kinds)[0];
    E.categoryId = E.type === '支出' ? '' : (first ? first.id : '');
  }
  const isUsable = (id, types) => { const a = acc(id); return a && !a.disabled && types.includes(a.type); };
  if (E.type === '支出') {
    // 沒有關鍵字記憶時一律預設現金，付款方式只由關鍵字學習改變，比較好預測
    if (!isUsable(E.from, ['現金', '銀行', '信用卡'])) E.from = (activeAccounts('現金')[0] || activeAccounts()[0] || {}).id;
    E.to = '';
  } else if (E.type === '收入') {
    if (!isUsable(E.to, ['現金', '銀行', '理財'])) E.to = (activeAccounts('銀行')[0] || activeAccounts()[0] || {}).id;
    E.from = '';
  } else {
    if (!acc(E.from)) E.from = (activeAccounts('銀行')[0] || activeAccounts()[0] || {}).id;
    if (!acc(E.to) || E.to === E.from) E.to = (activeAccounts().find(a => a.id !== E.from) || {}).id;
  }
}

function budgetInfo() {
  if (E.type !== '支出') return null;
  const c = cat(E.categoryId);
  if (!c) return null;
  const cid = cycleFor(E.time);
  const bud = budgetOf(cid)[c.group];
  if (bud == null) return { group: c.group, none: true, cid };
  let spent = spentByGroup(cid)[c.group] || 0;
  const p = E.prev;
  if (p && p.type === '支出' && p.cycleId === cid && cat(p.categoryId) && cat(p.categoryId).group === c.group) spent -= p.amount;
  const remain = bud - spent;
  return { group: c.group, remain, after: remain - (Number(E.amount) || 0), cid };
}

function budgetLineHtml() {
  const info = budgetInfo();
  if (!info) return '';
  if (info.none) return '<div class="budget-line">' + esc(info.group) + ' 本期未設定預算</div>';
  const over = info.after < 0;
  return '<div class="budget-line' + (over ? ' over' : '') + '">' + esc(info.group) + ' 本期剩 <b class="num">' + money(info.remain) + '</b>，記下後 ' +
    (over ? '<b class="warn num">超支 ' + money(-info.after) + '</b>' : '<b class="num">' + money(info.after) + '</b>') + '</div>';
}

function renderEntry() {
  const isEdit = !!E.prev;
  const kinds = kindsForType(E.type);
  const c = cat(E.categoryId);
  const groups = groupsOf(kinds);
  const curGroup = c ? c.group : E.pickGroup || null;
  let h = (isEdit ? '<h3>修改紀錄</h3>' : '') +
    '<div class="seg">' + ['支出', '收入', '轉帳'].map(t => '<button type="button" data-act="type" data-v="' + t + '" class="' + (E.type === t ? 'on' : '') + '">' + t + '</button>').join('') + '</div>' +
    '<div class="amount-row"><span class="cur">$</span><input class="amount-input num" id="eAmount" type="text" inputmode="numeric" placeholder="0" value="' + esc(E.amount) + '" aria-label="金額"></div>' +
    '<input class="note-input" id="eNote" type="text" placeholder="備註，例如：午餐" value="' + esc(E.note) + '" aria-label="備註">';

  h += '<div class="field"><div class="label">分類' + (E.unmatched && !c ? '　<span class="warn">第一次看到「' + esc(E.keyword) + '」，選好後下次會記住</span>' : '') + '</div>' +
    '<div class="chips wrap">' + groups.map(g => '<button type="button" class="chip' + (g === curGroup ? ' on' : '') + '" data-act="group" data-v="' + esc(g) + '">' + esc(g) + '</button>').join('') + '</div>';
  if (curGroup) {
    const subs = activeCats(kinds).filter(x => x.group === curGroup);
    h += '<div class="chips wrap sub-chips">' + subs.map(x => '<button type="button" class="chip' + (x.id === E.categoryId ? ' on' : '') + '" data-act="cat" data-v="' + esc(x.id) + '">' + esc(x.name) + '</button>').join('') + '</div>';
  }
  h += '</div>';

  if (E.type === '支出') {
    const a = acc(E.from);
    const method = a ? a.type : '';
    const methods = [['現金', '現金'], ['信用卡', '信用卡'], ['銀行', '帳戶扣款']].filter(m => activeAccounts(m[0]).length);
    h += '<div class="field"><div class="label">付款方式</div><div class="chips wrap">' +
      methods.map(m => '<button type="button" class="chip' + (method === m[0] ? ' on' : '') + '" data-act="method" data-v="' + m[0] + '">' + m[1] + '</button>').join('') + '</div>';
    const same = activeAccounts(method);
    if (same.length > 1) h += '<select id="eFrom" style="margin-top:8px">' + same.map(x => '<option value="' + esc(x.id) + '"' + (x.id === E.from ? ' selected' : '') + '>' + esc(x.name) + '</option>').join('') + '</select>';
    h += '</div>';
  } else if (E.type === '收入') {
    h += '<div class="field"><div class="label">入帳帳戶</div><div class="chips wrap">' +
      activeAccounts().filter(a => a.type !== '信用卡').map(a => '<button type="button" class="chip' + (a.id === E.to ? ' on' : '') + '" data-act="to" data-v="' + esc(a.id) + '">' + esc(a.name) + '</button>').join('') + '</div></div>';
  } else {
    const opts = sel => activeAccounts().map(a => '<option value="' + esc(a.id) + '"' + (a.id === sel ? ' selected' : '') + '>' + esc(a.name) + '（' + a.type + '）</option>').join('');
    h += '<div class="field"><div class="inline"><div><div class="label">從</div><select id="eFrom">' + opts(E.from) + '</select></div>' +
      '<div><div class="label">到</div><select id="eTo">' + opts(E.to) + '</select></div></div></div>';
    const toAcc = acc(E.to);
    if ((c && c.kind === '資產配置') || (toAcc && toAcc.type === '理財')) {
      h += '<div class="field"><div class="inline"><div><div class="label">標的（ETF 代號）</div><input id="eSymbol" type="text" value="' + esc(E.symbol) + '" placeholder="0050"></div>' +
        '<div><div class="label">成交股數</div><input id="eShares" type="number" inputmode="decimal" value="' + esc(E.shares) + '" placeholder="對帳單上的股數"></div></div></div>';
    }
  }

  // 日期：今天／昨天／前天一鍵選，其他日期用月曆
  const selKey = dayKey(new Date(E.time));
  const quick = [0, -1, -2].map(n => dayKey(addDays(new Date(), n)));
  const td = new Date(E.time);
  h += '<div class="field"><div class="label">日期</div><div class="chips wrap">' +
    quick.map((k, i) => '<button type="button" class="chip' + (k === selKey ? ' on' : '') + '" data-act="pick" data-v="' + k + '">' + ['今天', '昨天', '前天'][i] + '</button>').join('') +
    '<button type="button" class="chip' + (!quick.includes(selKey) ? ' on' : ' ghost') + '" data-act="cal">' + (!quick.includes(selKey) ? dayLabel(selKey) : '其他日期') + '<span class="caret">' + icon('caret-down') + '</span></button></div>' +
    (E.showCal ? pickerHtml(selKey, E.calAnchor || td, recordedDays()) : '') +
    '<div class="time-row"><span>時間</span><input id="eTime" type="time" value="' + pad(td.getHours()) + ':' + pad(td.getMinutes()) + '" aria-label="時間"></div></div>' +
    '<div id="eBudget">' + budgetLineHtml() + '</div>' +
    '<div class="actions">' +
    (isEdit ? '<button class="btn danger" type="button" data-act="del">' + (E.confirmDelete ? '確定刪除？' : '刪除') + '</button>' : '') +
    '<button class="btn" type="button" data-act="cancel">取消</button>' +
    '<button class="btn primary" type="button" data-act="save">' + (isEdit ? '儲存' : '記下') + '</button></div>';

  const s = openSheet(h, entryAction);
  S.isDirty = () => !E.prev && !!(String(E.amount) || E.note.trim());
  $('#eAmount').oninput = e => { E.amount = e.target.value.replace(/[^\d.]/g, ''); $('#eBudget').innerHTML = budgetLineHtml(); };
  $('#eNote').oninput = e => { E.note = e.target.value; };
  $('#eTime').onchange = e => {
    const [hh, mm] = e.target.value.split(':').map(Number);
    if (isNaN(hh)) return;
    const d = new Date(E.time);
    E.time = new Date(d.getFullYear(), d.getMonth(), d.getDate(), hh, mm || 0).getTime();
  };
  if ($('#eFrom')) $('#eFrom').onchange = e => { E.from = e.target.value; if (E.type === '轉帳') renderEntry(); };
  if ($('#eTo')) $('#eTo').onchange = e => { E.to = e.target.value; renderEntry(); };
  if ($('#eSymbol')) $('#eSymbol').oninput = e => { E.symbol = e.target.value.trim(); };
  if ($('#eShares')) $('#eShares').oninput = e => { E.shares = e.target.value; };
  return s;
}

function entryAction(act, v) {
  if (act === 'type') { E.type = v; fillDefaults(); renderEntry(); }
  else if (act === 'group') {
    E.pickGroup = v;
    const first = activeCats(kindsForType(E.type)).find(x => x.group === v);
    E.categoryId = first ? first.id : '';
    renderEntry();
  }
  else if (act === 'cat') { E.categoryId = v; renderEntry(); }
  else if (act === 'method') {
    const last = acc(S.pref.lastFrom);
    E.from = (last && last.type === v && !last.disabled ? last : activeAccounts(v)[0] || {}).id;
    renderEntry();
  }
  else if (act === 'to') { E.to = v; renderEntry(); }
  else if (act === 'cal') { E.showCal = !E.showCal; E.calAnchor = new Date(E.time); renderEntry(); }
  else if (act === 'pnav') { const a = E.calAnchor || new Date(E.time); E.calAnchor = new Date(a.getFullYear(), a.getMonth() + Number(v), 1); renderEntry(); }
  else if (act === 'pick') {
    const d = keyDate(v);
    const t = new Date(E.time);
    E.time = new Date(d.getFullYear(), d.getMonth(), d.getDate(), t.getHours(), t.getMinutes()).getTime();
    E.showCal = false;
    renderEntry();
  }
  else if (act === 'cancel') closeSheet();
  else if (act === 'del') {
    if (!E.confirmDelete) { E.confirmDelete = true; renderEntry(); return; }
    const gone = E.prev;
    removeTx(gone);
    closeSheet();
    toast('已刪除：' + (gone.note || catLabel(cat(gone.categoryId))) + ' ' + money(gone.amount), () => {
      commitTx(Object.assign({}, gone, { void: false }), null, null);
      toast('已復原');
    });
  }
  else if (act === 'save') saveEntry();
}

function saveEntry() {
  const amount = Math.round(Number(E.amount));
  if (!(amount > 0)) { toast('請輸入金額'); return; }
  if (!E.categoryId) { toast('請選擇分類'); return; }
  if (E.type !== '收入' && !E.from) { toast('請選擇付款帳戶'); return; }
  if (E.type !== '支出' && !E.to) { toast('請選擇入帳帳戶'); return; }
  if (E.type === '轉帳' && E.from === E.to) { toast('轉出與轉入不能是同一個帳戶'); return; }
  const tx = {
    id: E.id || newId(), time: E.time, type: E.type, amount: amount, categoryId: E.categoryId,
    from: E.type === '收入' ? '' : E.from, to: E.type === '支出' ? '' : E.to,
    note: E.note.trim(), symbol: E.type === '轉帳' ? E.symbol : '',
    shares: E.type === '轉帳' && E.shares !== '' ? Number(E.shares) : null,
    void: false, created: E.prev ? E.prev.created : Date.now()
  };
  const c = cat(tx.categoryId);
  const learn = E.keyword ? { keyword: E.keyword, categoryId: tx.categoryId, accountId: tx.type === '支出' ? tx.from : tx.type === '收入' ? tx.to : '' } : null;

  if (!E.prev && tx.type === '收入' && c && c.name === '薪資') {
    closeSheet();
    setTimeout(() => openPayday(tx, learn), 250);
    return;
  }
  const info = budgetInfo();
  if (tx.type === '支出') { S.pref.lastFrom = tx.from; savePref(); }
  const prev = E.prev;
  closeSheet();
  commitTx(tx, prev, learn);
  const onDay = dayKey(new Date(tx.time)) !== dayKey(new Date()) ? '（' + dayLabel(dayKey(new Date(tx.time))) + '）' : '';
  toast((prev ? '已更新：' : '已記下：') + (tx.note || catLabel(c)) + ' ' + money(amount) + onDay, () => {
    // 復原：新增的就刪掉；修改的就改回原本的內容
    if (prev) commitTx(Object.assign({}, prev), Object.assign({}, S.txs.find(t => t.id === tx.id) || tx), null);
    else removeTx(S.txs.find(t => t.id === tx.id) || tx);
    toast('已復原');
  });
  if (info && !info.none && info.after < 0) setTimeout(() => openOverspend(info.group, -info.after, info.cid), 400);
}

/* ───────────── 超支挪用 ───────────── */

function openOverspend(group, over, cid) {
  const b = budgetOf(cid);
  const spent = spentByGroup(cid);
  const sources = expenseGroups().filter(g => g !== group && (b[g] || 0) - (spent[g] || 0) > 0)
    .map(g => ({ g, left: (b[g] || 0) - (spent[g] || 0) }));
  const un = unallocated(cid);
  if (un > 0) sources.unshift({ g: '', left: un, label: '未分配' });
  if (!sources.length) { toast(group + ' 超支 ' + money(over) + '，其他分類也沒有剩餘預算'); return; }
  let pick = sources[0];
  const draw = () => {
    const h = '<h3>' + esc(group) + ' 超支 <span class="warn">' + money(over) + '</span></h3>' +
      '<div class="small muted">要從其他還有剩的預算挪過來嗎？</div>' +
      '<div class="field"><div class="label">從哪裡挪</div><div class="chips wrap">' +
      sources.map((s, i) => '<button type="button" class="chip' + (s === pick ? ' on' : '') + '" data-act="pick" data-v="' + i + '">' + esc(s.label || s.g) + '（剩 ' + money(s.left) + '）</button>').join('') + '</div></div>' +
      '<div class="field"><label for="mvAmt">挪用金額</label><input id="mvAmt" type="number" inputmode="numeric" value="' + Math.min(over, pick.left) + '"></div>' +
      '<div class="actions"><button class="btn" type="button" data-act="cancel">先不用</button><button class="btn primary" type="button" data-act="ok">挪用</button></div>';
    openSheet(h, async (act, v, btn) => {
      if (act === 'pick') { pick = sources[Number(v)]; draw(); }
      else if (act === 'cancel') closeSheet();
      else if (act === 'ok') {
        const amt = Math.round(Number($('#mvAmt').value));
        if (!(amt > 0)) { toast('請輸入金額'); return; }
        busy(btn, true);
        try {
          let res;
          if (pick.g) res = await call('api_moveBudget', cid, pick.g, group, amt);
          else res = await call('api_setBudgets', cid, Object.assign({}, budgetOf(cid), { [group]: (budgetOf(cid)[group] || 0) + amt }));
          S.data.budgets = res.budgets;
          persist(); closeSheet(); render();
          toast('已從' + (pick.label || pick.g) + '挪 ' + money(amt) + ' 到' + group);
        } catch (e) { busy(btn, false); toast('需要網路才能調整預算：' + errMsg(e)); }
      }
    });
  };
  draw();
}

/* ───────────── 預算調整 ───────────── */

function openBudget(cid) {
  const b = budgetOf(cid);
  const groups = expenseGroups();
  const spent = spentByGroup(cid);
  const income = kindTotal(cid, '收入');
  const invest = kindTotal(cid, '資產配置');
  const carry = b[CARRY] || 0;
  const h = '<h3>調整本期預算</h3>' +
    '<div class="kv"><span>本期收入</span><span class="num">' + money(income) + '</span></div>' +
    (carry ? '<div class="kv"><span>上期滾入</span><span class="num">+' + money(carry) + '</span></div>' : '') +
    '<div class="kv"><span>資產配置</span><span class="num">-' + money(invest) + '</span></div>' +
    groups.map(g => '<div class="check"><div class="grow">' + esc(g) + '<div class="small muted">已花 ' + money(spent[g] || 0) + '</div></div>' +
      '<input type="number" inputmode="numeric" data-g="' + esc(g) + '" value="' + (b[g] || '') + '" placeholder="0"></div>').join('') +
    '<div class="kv total"><span>未分配</span><span class="num" id="bUn"></span></div>' +
    '<div class="actions"><button class="btn" type="button" data-act="cancel">取消</button><button class="btn primary" type="button" data-act="save">儲存</button></div>';
  const s = openSheet(h, async (act, v, btn) => {
    if (act === 'cancel') closeSheet();
    else if (act === 'save') {
      const map = {};
      $$('[data-g]', s).forEach(i => { map[i.dataset.g] = Math.round(Number(i.value) || 0); });
      busy(btn, true);
      try {
        const res = await call('api_setBudgets', cid, map);
        S.data.budgets = res.budgets;
        persist(); closeSheet(); render(); toast('預算已更新');
      } catch (e) { busy(btn, false); toast('需要網路才能調整預算：' + errMsg(e)); }
    }
  });
  const upd = () => {
    let sum = 0;
    $$('[data-g]', s).forEach(i => { sum += Number(i.value) || 0; });
    const un = income + carry - invest - sum;
