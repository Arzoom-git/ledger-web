<!DOCTYPE html>
<html lang="zh-Hant">

<title>記帳</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1A33">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="記帳">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<script>window.LEDGER_API = 'https://script.google.com/macros/s/AKfycbyO-JGXgLh3J7gzmsb-sb5NzNV-ROs7l9pxPd_moKmAFMec2sU9-YhX7w97ugb_WxY68Q/exec'; if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');</script>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Chiron+Sung+HK:wght@900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* 設計語言「寶庫」：P5 介面原則（一個主色、剪報字、斜角鋸齒、視線引導線、亮度＝優先級），換成海軍藍＋金色。
   頁面底是深海軍藍（像藏寶庫的夜），卡片是羊皮紙，金色是主色，只給能按的東西與選中的狀態。
   形狀：0 圓角；小元件用不規則四邊形；卡片是厚卡紙（側面是紙的厚度，不是陰影）。
   動態：招牌緩動 cubic-bezier(.2,0,0,1)；喜悅用回彈；140／260／520ms。
   對比（已驗算）：米金字／海軍藍 11.6、墨藍字／羊皮紙 12.5、墨藍字／金色 7.3、淡字 ≥ 4.9 */
:root {
  --bg: #0E1A33;          /* 海軍藍：頁面 */
  --bg-2: #15254A;        /* 區塊輪替 */
  --bg-3: #07101F;        /* 最深：底部選單、對話框 */
  --text: #DDD1B0;        /* 米金：頁面文字（不用純白，太刺眼） */
  --text-soft: #A8A48E;
  --paper: #EEE3C3;       /* 羊皮紙：卡片 */
  --paper-2: #E2D5AE;
  --ink: #14213D;         /* 墨藍：卡片上的字 */
  --ink-soft: #54607A;
  --gold: #D8A83A;        /* 主色：只給能按的東西 */
  --gold-text: #E6B94F;   /* 深底上的金色字 */
  --gold-ink: #7E560A;    /* 羊皮紙上的金色字（連結） */
  --on-gold: #14213D;
  --edge: #A88645;        /* 卡紙側面：舊金 */
  --edge-dark: #02060E;
  --edge-gold: #8A6516;
  --good: #7DC79A; --good-ink: #2E6B47;
  --warn: #F08068; --warn-ink: #A8321F; --warn-face: #B8372A; --on-warn: #FFF1DC;
  --tone: rgba(221, 209, 176, .07);
  --tone-ink: rgba(20, 33, 61, .12);
  --hatch-ink: repeating-linear-gradient(-60deg, rgba(20, 33, 61, .26) 0 2px, transparent 2px 6px);
  --hatch-bg: repeating-linear-gradient(-60deg, rgba(221, 209, 176, .22) 0 2px, transparent 2px 6px);
  --serif: "Chiron Sung HK", "Noto Serif TC", "PMingLiU", serif;
  --sans: "Noto Sans TC", -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
  --display: "Anton", "Noto Sans TC", Impact, sans-serif;
  --ease: cubic-bezier(.2, 0, 0, 1); --pop: cubic-bezier(.175, .885, .32, 1.275);
  --q: 140ms; --s: 260ms; --l: 520ms;
  --th: 6px;
  /* v2.6：元件一律方正（0 圓角、不裁成鋸齒）；鋸齒只留給剪報字 */
  --jag-a: none; --jag-b: none; --jag-btn: none;
  --rjag-a: polygon(0 3px, 100% 0, calc(100% - 4px) 100%, 3px calc(100% - 4px));
  --rjag-b: polygon(2px 0, calc(100% - 3px) 4px, 100% calc(100% - 2px), 0 100%);
  --line-ink: rgba(20, 33, 61, .12); --line-bg: rgba(221, 209, 176, .12);
  --hull-rect: polygon(0 0, calc(100% - var(--th)) 0, 100% var(--th), 100% 100%, var(--th) 100%, 0 calc(100% - var(--th)));
  /* 目前這塊面上的字色：頁面（深底）與卡片（羊皮紙）各自一組 */
  --fill: var(--bg-2); --fg: var(--text); --fg-soft: var(--text-soft); --link: var(--gold-text); --good-c: var(--good); --warn-c: var(--warn); --hatch: linear-gradient(var(--line-bg), var(--line-bg));
  --on-dark: var(--text);
  --guide: rgba(221, 209, 176, .8);  /* 視線引導線：米金，不用主色 */
  color-scheme: dark;
}
/* 羊皮紙面：卡片、底部卡片、提示 */
.card, .bcard, .list, .week-card, .stat, .mini-month, .sheet, .picker {
  --fill: rgba(20, 33, 61, .1); --fg: var(--ink); --fg-soft: var(--ink-soft); --link: var(--gold-ink); --good-c: var(--good-ink); --warn-c: var(--warn-ink); --hatch: linear-gradient(var(--line-ink), var(--line-ink));
  color: var(--fg);
}

* { box-sizing: border-box; border-radius: 0; -webkit-tap-highlight-color: transparent; }
/* 斜線、傾斜的卡片會超出一點點：裁掉，避免手機把整頁縮小 */
html, body { overflow-x: clip; }
html { background: var(--bg); }
body {
  margin: 0; color: var(--text); background: var(--bg); min-height: 100vh; overflow-x: hidden;
  font-family: var(--sans); font-size: 16px; line-height: 1.55; letter-spacing: .01em; -webkit-font-smoothing: antialiased;
  padding: calc(env(safe-area-inset-top) + 86px) 0 calc(env(safe-area-inset-bottom) + 118px);
  /* 網點：寶庫牆面的質感，很淡 */
  background-image: radial-gradient(var(--tone) 1.2px, transparent 1.5px); background-size: 7px 7px;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
input, select { font: inherit; color: var(--ink); }
.num { font-variant-numeric: tabular-nums; letter-spacing: 0; }
.muted { color: var(--fg-soft); }
.small { font-size: 13px; }
.warn { color: var(--warn-c); }
.good { color: var(--good-c); }
.accent { color: var(--link); }
svg.ph { width: 22px; height: 22px; fill: currentColor; flex: none; }
.link svg.ph, .wc-link svg.ph { width: 14px; height: 14px; vertical-align: -2px; margin-left: 2px; }
.chip svg.ph { width: 15px; height: 15px; vertical-align: -3px; margin-right: 4px; }
.date-pill svg.ph { width: 13px; height: 13px; }
.chip .caret svg.ph { width: 13px; height: 13px; margin: 0 0 0 4px; }
.icon-btn svg.ph { width: 20px; height: 20px; }
.chev { flex: none; color: var(--fg-soft); display: grid; }
.chev svg.ph { width: 16px; height: 16px; }
.share-top svg.ph { width: 14px; height: 14px; vertical-align: -2px; margin-right: 6px; color: var(--fg-soft); }
h1, h2, h3, .title { text-wrap: balance; }
button, a { touch-action: manipulation; }
button { transition: transform var(--q) var(--ease), background-color var(--q), color var(--q), opacity var(--q); }
button:not(:disabled):active { transform: scale(.95); }
.row:not(:disabled):active, .share-row:not(:disabled):active, .check:active { transform: none; background-color: var(--tone-ink); }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
input:focus-visible, select:focus-visible { outline: none; }

/* ── 剪報字（標題）：字重一致 900、大小差 ±8%、傾斜 ±3°；底色只用 羊皮紙／最深底／米金，相鄰不重複；金色不用在這裡 ── */
.ransom { margin: 0; line-height: 1.15; font-size: 30px; font-weight: 900; }
.rn { display: inline-block; transform: rotate(var(--r)) translateY(var(--y)); padding: .03em .1em; margin: .03em .02em; line-height: 1.1; }
.r0 { background: var(--paper); color: var(--ink); font-family: var(--serif); clip-path: var(--rjag-a); }
.r1 { background: var(--bg-3); color: var(--text); font-family: var(--sans); box-shadow: inset 0 0 0 .07em var(--text); }
.r2 { color: var(--text); font-family: var(--serif); font-size: 1.08em; padding-inline: .03em; -webkit-text-stroke: .06em var(--bg-3); paint-order: stroke fill; }
.r3 { background: var(--text); color: var(--bg); font-family: var(--serif); font-size: .94em; clip-path: var(--rjag-b); }
.rn.lat { font-family: var(--display); font-weight: 400; }
.ransom.anim .rn { animation: rnIn var(--s) var(--pop) both; animation-delay: var(--d); }
@keyframes rnIn { from { opacity: 0; transform: rotate(calc(var(--r) * -5)) scale(1.8); } }

/* ── 開啟動畫：LOGO 換成寶庫配色 ── */
#splash { position: fixed; inset: 0; z-index: 100; background: var(--bg); display: grid; place-items: center; transition: opacity .35s ease, visibility .35s; }
#splash.hide { opacity: 0; visibility: hidden; }
#splash svg { width: min(58vw, 230px); height: auto; overflow: visible; }
#splash [stroke="#b8905f"] { stroke: var(--gold); }
#splash [stroke="#2b211a"] { stroke: var(--text); }
#splash [fill="#2b211a"] { fill: var(--text); }
#splash [fill="#6b5d4e"] { fill: var(--gold-text); }
#splash .lg-mark, #splash .lg-word { opacity: 0; transform-box: fill-box; transform-origin: 50% 80%; }
#splash .lg-mark { transform: scale(.92); animation: splash-in .8s var(--ease) .05s forwards; }
#splash .lg-word { transform: translateY(10px); animation: splash-in .6s ease .4s forwards; }
@keyframes splash-in { to { opacity: 1; transform: none; } }

/* ── 頂部：剪報標題＋斜的日期牌 ── */
.topbar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 10;
  display: flex; align-items: flex-end; justify-content: space-between; gap: 12px;
  padding: calc(env(safe-area-inset-top) + 12px) 18px 18px;
  background: var(--bg); clip-path: polygon(0 0, 100% 0, 100% calc(100% - 10px), 0 100%); overflow: hidden;
}
.topbar::after { content: ""; position: absolute; left: -5%; right: -5%; bottom: 7px; height: 3px; background: var(--guide); transform: rotate(-1.2deg); transform-origin: left; opacity: .85; }
.title { transform: rotate(-2deg); transform-origin: left bottom; }
.title .ransom { font-size: 30px; }
.subtitle { display: inline-block; margin-top: 8px; font-size: 12.5px; font-weight: 700; letter-spacing: .12em; color: var(--text); background: var(--bg-3); padding: 2px 10px; clip-path: var(--jag-b); }
.subtitle:empty { display: none; }
.sync { font-size: 12px; font-weight: 700; color: var(--text); display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; margin-bottom: 4px; background: var(--bg-3); clip-path: var(--jag-b); }
.sync::before { content: ''; width: 7px; height: 7px; background: var(--good); transform: rotate(45deg); }
.sync.pending::before { background: var(--gold); animation: pulse 1.2s ease-in-out infinite; }
.sync.error::before { background: var(--warn); }
.sync.error { color: var(--warn); }
@keyframes pulse { 50% { opacity: .3; } }

/* ── 底部選單：上緣斜切的最深帶；選中＝金色鋸齒塊＋放大傾斜，沒選中＝縮小變暗 ── */
.tabbar {
  position: fixed; z-index: 10; left: 0; right: 0; bottom: 0;
  display: grid; grid-template-columns: repeat(4, 1fr); align-items: end;
  padding: 18px 8px calc(env(safe-area-inset-bottom) + 8px);
  background: var(--bg-3); clip-path: polygon(0 18px, 100% 0, 100% 100%, 0 100%);
}
.tabbar button { position: relative; display: grid; justify-items: center; gap: 2px; min-height: 60px; padding: 6px 0 4px; color: var(--text-soft); opacity: .72; transition: opacity var(--q), transform var(--s) var(--pop); }
.tabbar button span { position: relative; z-index: 1; font-family: var(--serif); font-weight: 900; font-size: 14px; letter-spacing: .08em; }
.tabbar svg.ph { position: relative; z-index: 1; width: 22px; height: 22px; }
.tabbar button.on { color: var(--on-gold); opacity: 1; transform: translateY(-6px) rotate(-6deg) scale(1.12); }
.tabbar button.on::before { content: ""; position: absolute; inset: 2px 4px 0; background: var(--gold); clip-path: polygon(10% 12%, 97% 0, 88% 100%, 0 86%); animation: navPop var(--s) var(--pop); }
.tabbar button.on::after { content: ""; position: absolute; left: -2px; right: 10px; bottom: -5px; height: 3px; background: var(--text); transform: rotate(-4deg); }
@keyframes navPop { from { transform: scale(0) rotate(-40deg); } }

/* 換頁：金色星芒從按鈕炸開（後面慢半拍一層深色做厚度），網點與碎星墊底，頁面圖示彈出後一起縮回 */
.fx { position: fixed; inset: 0; z-index: 40; pointer-events: none; overflow: hidden; }
.fx .star { position: absolute; width: 40px; height: 40px; background: var(--gold); transform: translate(-50%, -50%) scale(0);
  clip-path: polygon(50% 0, 61% 32%, 98% 22%, 70% 50%, 98% 78%, 61% 68%, 50% 100%, 39% 68%, 2% 78%, 30% 50%, 2% 22%, 39% 32%); }
.fx .star.ink { background: var(--bg-3); }
.fx .layer { position: absolute; inset: 0; opacity: 0; }
.fx .dots { background-image: radial-gradient(rgba(7, 16, 31, .5) 2.2px, transparent 2.6px); background-size: 11px 11px;
  -webkit-mask: radial-gradient(circle at 50% 46%, transparent 0 30%, #000 75%); mask: radial-gradient(circle at 50% 46%, transparent 0 30%, #000 75%); }
.fx .bits i { position: absolute; left: 50%; top: 46%; width: 26px; height: 26px; background: var(--paper); transform: translate(-50%, -50%) scale(0);
  clip-path: polygon(50% 0, 61% 32%, 98% 22%, 70% 50%, 98% 78%, 61% 68%, 50% 100%, 39% 68%, 2% 78%, 30% 50%, 2% 22%, 39% 32%); }
.fx .bits i:nth-child(even) { background: var(--bg-3); width: 18px; height: 18px; }
.fx .badge { position: absolute; left: 50%; top: 46%; display: grid; justify-items: center; gap: 10px; transform: translate(-50%, -50%) scale(0); }
.fx .badge .ic { display: grid; place-items: center; width: 104px; height: 104px; background: var(--paper); color: var(--ink); box-shadow: 7px 7px 0 var(--bg-3); outline: 5px solid var(--bg-3); transform: rotate(-6deg); }
.fx .badge .ic svg.ph { width: 60px; height: 60px; }
.fx .badge b { font: 900 24px var(--serif); background: var(--bg-3); color: var(--text); padding: 2px 16px; clip-path: polygon(4% 0, 100% 10%, 96% 100%, 0 88%); transform: rotate(-4deg); }
.view-in { animation: viewIn var(--l) var(--ease); }
@keyframes viewIn { 0%, 30% { opacity: 0; transform: translateX(24px); } }

/* ── 版面 ── */
main { max-width: 560px; margin: 0 auto; padding: 0 16px; }
.section { margin: 28px 0; }
.section:first-child { margin-top: 4px; }
/* 區塊標題：羊皮紙小牌、微微傾斜 */
.section-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0 2px 14px; }
.section-head h2 { margin: 0; display: inline-block; font-family: var(--serif); font-weight: 900; font-size: 18px; line-height: 1.2; letter-spacing: .06em; color: var(--ink); background: var(--paper); padding: 4px 12px 3px; clip-path: var(--jag-a); transform: rotate(-2deg); transform-origin: left; }
.section-head h2 .num { font-family: var(--display); font-weight: 400; letter-spacing: .02em; }
.section-head .link, .link { color: var(--link); font-size: 14px; font-weight: 700; }
.section-head > .small { color: var(--text-soft); }

/* 厚卡紙：卡面在 ::before、側面在 ::after，元素本身透明且不裁切 */
.card, .bcard, .list, .week-card, .stat, .mini-month {
  position: relative; isolation: isolate; background: transparent;
  margin-right: var(--th); margin-bottom: var(--th);
}
.card::before, .bcard::before, .list::before, .week-card::before, .stat::before, .mini-month::before { content: ""; position: absolute; inset: 0; z-index: -1; background: var(--face, var(--paper)); }
.card::after, .bcard::after, .list::after, .week-card::after, .stat::after, .mini-month::after { content: ""; position: absolute; inset: 0 calc(-1 * var(--th)) calc(-1 * var(--th)) 0; z-index: -2; background: var(--slab-edge, var(--edge)); clip-path: var(--hull-rect); transition: transform var(--q) var(--ease); }
.card { padding: 18px; }
.card + .card { margin-top: 12px; }
.card.tap { display: block; width: calc(100% - var(--th)); text-align: left; }
/* 能按的大卡片：按下去整塊沉下去 */
.card.tap:not(:disabled):active, .week-card:not(:disabled):active, .mini-month:not(:disabled):active { transform: translate(4px, 4px); }
.card.tap:not(:disabled):active::after, .week-card:not(:disabled):active::after, .mini-month:not(:disabled):active::after { transform: translate(-4px, -4px); }
.hr { height: 3px; background: var(--hatch); margin: 14px 0; }

/* ── 首頁：可以用的錢（大數字＋視線引導線） ── */
.hero { position: relative; overflow: hidden; display: block; width: 100%; text-align: left; padding: 6px 2px 8px; }
.hero-label { display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
.hero-label > span:first-child { font-family: var(--serif); font-weight: 900; font-size: 16px; letter-spacing: .1em; background: var(--bg-3); color: var(--text); padding: 3px 12px; clip-path: var(--jag-b); transform: rotate(-3deg); }
.hero-label .link { color: var(--gold-text); }
.hero-value { position: relative; z-index: 1; display: inline-block; font-family: var(--display); font-weight: 400; font-size: clamp(58px, 17vw, 76px); line-height: .95; letter-spacing: .01em; margin: 10px 0 0 4px; color: var(--text); -webkit-text-stroke: 3px var(--bg-3); paint-order: stroke fill; transform: rotate(-4deg); transform-origin: left bottom; }
.hero::after { content: ""; position: absolute; left: -12%; right: -12%; top: 64%; height: 3px; background: var(--guide); transform: rotate(-7deg); transform-origin: left; pointer-events: none; }
.hero-sub { position: relative; z-index: 1; font-size: 12.5px; color: var(--text-soft); margin-top: 10px; letter-spacing: .06em; }
.hero:not(:disabled):active { transform: scale(.98); }
.anim .hero::after { animation: guide var(--l) var(--ease) both; }
@keyframes guide { from { transform: rotate(-7deg) scaleX(0); } }

/* ── 首頁：寶庫（每個帳戶一格，像遊戲的道具欄；可以點，所以圖示是金色） ── */
.vault { display: flex; gap: 8px; margin: 14px 0 6px; overflow-x: auto; scrollbar-width: none; padding: 2px 2px 4px; }
.vault::-webkit-scrollbar { display: none; }
.slot { flex: 1 0 104px; min-width: 0; display: grid; gap: 4px; padding: 8px 10px 7px; text-align: left; background: var(--bg-3); color: var(--text); clip-path: var(--jag-a); }
.slot:nth-child(even) { transform: rotate(.8deg); }
.slot:nth-child(odd) { transform: rotate(-.6deg); }
.slot-top { display: flex; align-items: center; gap: 5px; min-width: 0; }
.slot-top svg.ph { width: 16px; height: 16px; color: var(--gold-text); }
.slot-name { font-size: 12px; font-weight: 700; color: var(--text-soft); letter-spacing: .04em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.slot-v { font-family: var(--display); font-size: 19px; line-height: 1.05; letter-spacing: .02em; white-space: nowrap; }
.slot-v small { font-family: var(--sans); font-size: 11px; font-weight: 700; color: var(--text-soft); margin-right: 4px; letter-spacing: .04em; }
.slot-v.warn { color: var(--warn); }
.slot:not(:disabled):active { transform: translate(2px, 2px); }

/* ── 快速記帳：P5 對話框（最深底、米金粗邊、金色名牌、左下小尾巴） ── */
.quick { position: relative; display: flex; align-items: center; gap: 10px; margin: 18px 0 0; padding: 10px 10px 10px 10px; background: var(--bg-3); box-shadow: 0 0 0 4px var(--text); }
.quick::before { content: "記一筆"; position: absolute; left: 14px; top: -19px; z-index: 2; background: var(--paper); color: var(--ink); font: 900 14px/1 var(--serif); letter-spacing: .24em; padding: 6px 10px 6px 14px; clip-path: var(--jag-btn); transform: rotate(-5deg); }
.quick::after { content: ""; position: absolute; left: 34px; bottom: -22px; width: 28px; height: 18px; background: var(--text); clip-path: polygon(0 0, 100% 0, 6% 100%); }
.quick input { flex: 1; min-width: 0; border: 0; background: none; font-size: 17px; font-weight: 500; padding: 10px 4px; color: var(--text); caret-color: var(--gold); }
.quick input::placeholder { color: var(--text-soft); }
.quick input:focus { outline: none; }
.quick:focus-within { box-shadow: 0 0 0 4px var(--gold); }
.quick:focus-within::after { background: var(--gold); }
.date-pill { flex: none; display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 700; color: var(--ink); padding: 8px 11px; background: var(--paper); white-space: nowrap; clip-path: var(--jag-btn); }
.date-pill.past { background: var(--gold); color: var(--on-gold); }
.go { flex: none; width: 48px; height: 46px; background: var(--gold); color: var(--on-gold); display: grid; place-items: center; clip-path: var(--jag-btn); }
.go svg.ph { width: 24px; height: 24px; }
.backfill-note { font-size: 13px; color: var(--gold-text); margin: 28px 4px 0; display: flex; justify-content: space-between; }

/* 標籤：鋸齒外框；選中＝金色＋放大傾斜 */
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 30px 4px 6px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chips.wrap { flex-wrap: wrap; overflow: visible; padding-top: 4px; }
.chip { flex: none; padding: 8px 15px; line-height: 1.3; border: 0; font-size: 14px; font-weight: 500; color: var(--fg); white-space: nowrap; background: var(--fill); clip-path: var(--jag-btn); }
.chip.on { background: var(--gold); color: var(--on-gold); box-shadow: none; opacity: 1; font-weight: 900; transform: scale(1.06) rotate(-3deg); }
.chip.ghost { background: transparent; color: var(--fg-soft); }
.sheet .chip { color: var(--ink); }
.sheet .chip.on { color: var(--on-gold); }

/* 按鈕：主要＝金色厚按鈕（側面深金）；次要＝墨藍外框 */
.btn { position: relative; isolation: isolate; padding: 13px 20px; font-size: 15px; font-weight: 900; letter-spacing: .08em; color: var(--fg); background: var(--fill); clip-path: var(--jag-btn); }
.btn.primary { color: var(--on-gold); background: var(--gold); box-shadow: 4px 4px 0 var(--edge-gold); clip-path: none; }
.btn.primary::before { content: none; }
.btn.primary:not(:disabled):active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--edge-gold); }
.btn.danger { color: var(--warn-c); background: transparent; }
.btn.block { width: 100%; }
.btn:disabled { opacity: .45; }
.icon-btn { width: 40px; height: 40px; display: grid; place-items: center; color: var(--fg); background: var(--fill); clip-path: var(--jag-btn); }

/* 提醒：深色帶＋左側金色斜條 */
.notice { position: relative; display: flex; align-items: center; gap: 12px; padding: 12px 12px 12px 20px; background: var(--bg-2); margin-top: 14px; font-size: 14px; clip-path: var(--jag-b); }
.notice::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 7px; background: var(--gold); clip-path: polygon(0 0, 100% 0, 60% 100%, 0 100%); }
.notice.warn { color: var(--text); }
.notice.warn::before { background: var(--warn-face); }
.notice .grow { flex: 1; }
.notice .muted { color: var(--text-soft); }
.notice .btn { padding: 8px 14px; font-size: 14px; background: var(--gold); color: var(--on-gold); box-shadow: none; }
.notice .icon-btn { background: transparent; }

/* ── 預算：一個大類一張厚卡，交錯微傾 ── */
.budget-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; font-size: 14px; color: var(--text-soft); }
.budget-head .num { font-family: var(--display); font-size: 20px; color: var(--text); letter-spacing: .02em; }
.budget-head .num.warn { color: var(--warn); }
.bcard { padding: 14px 16px 16px; }
.bcard + .bcard { margin-top: 12px; }
.bcard:nth-of-type(odd) { transform: rotate(-.5deg); }
.bcard:nth-of-type(even) { transform: rotate(.4deg); }
.bcard .b-top { display: flex; justify-content: space-between; align-items: center; font-family: var(--serif); font-weight: 900; font-size: 19px; }
.bcard .b-tag { font: 900 12px/1 var(--sans); letter-spacing: .08em; padding: 5px 9px; background: var(--ink); color: var(--paper); clip-path: var(--jag-b); }
.bcard .b-tag.over { background: var(--warn-face); color: var(--on-warn); }
.bcard .b-mid { display: flex; justify-content: space-between; align-items: baseline; margin-top: 10px; font-size: 13px; color: var(--ink-soft); }
.bcard .b-mid b { font-family: var(--display); font-weight: 400; font-size: 22px; color: var(--ink); letter-spacing: .02em; }
.budget-row { padding: 12px 0; }
.budget-row + .budget-row { background: var(--hatch) top / 100% 1px no-repeat; }
.budget-top { display: flex; justify-content: space-between; align-items: baseline; }
.budget-top .left, .budget-top .right { font-size: 15px; }
.budget-sub { font-size: 12px; color: var(--fg-soft); margin-top: 6px; display: flex; justify-content: space-between; }
/* 進度條：斜的，墨藍填滿；超支是朱紅 */
.bar { height: 11px; background: var(--tone-ink); margin: 10px 3px 0; transform: skewX(-24deg); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--ink); }
.bar.over > i { background: var(--warn-face); }

/* ── 淨資產 ── */
.networth-label { font-size: 12px; color: var(--fg-soft); letter-spacing: .12em; }
.networth { font-family: var(--display); font-weight: 400; font-size: 44px; line-height: 1; letter-spacing: .01em; margin: 6px 0 4px; }
.acc-row { display: flex; justify-content: space-between; align-items: baseline; padding: 10px 0; font-size: 15px; }
.acc-row + .acc-row { background: var(--hatch) top / 100% 1px no-repeat; }
.acc-row > :last-child { font-family: var(--display); font-size: 19px; letter-spacing: .02em; }
.acc-row .sub { font-size: 12px; color: var(--fg-soft); margin-left: 8px; }

/* ── 列表：厚卡紙，列與列之間用短斜線 ── */
.list { display: block; }
.row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; width: 100%; text-align: left; color: var(--ink); }
.row + .row { background: var(--hatch) 14px 0 / calc(100% - 28px) 1px no-repeat; }
.row .grow { flex: 1; min-width: 0; }
.row .main { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 15.5px; font-weight: 700; }
.row .sub { font-size: 12.5px; color: var(--ink-soft); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .amt { font-family: var(--display); font-weight: 400; font-size: 20px; letter-spacing: .02em; white-space: nowrap; }
.row .chev { color: var(--ink-soft); }
/* 分類圖示：墨藍鋸齒小牌、金色圖示、微微傾斜 */
.avatar { flex: none; width: 42px; height: 42px; background: var(--ink); display: grid; place-items: center; color: var(--gold); clip-path: var(--jag-a); transform: rotate(-3deg); }
.avatar.in { background: var(--good-ink); color: var(--paper); }
.avatar.move { background: var(--ink-soft); color: var(--paper); }
.row .right { flex: none; text-align: right; }
.row .time { font-size: 12px; color: var(--ink-soft); margin-top: 0; }
.amt.in { color: var(--good-c); }
.amt.move { color: var(--fg-soft); }
.date-head { margin: 26px 2px 12px; display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
.date-head > :first-child { font-family: var(--serif); font-weight: 900; font-size: 16px; letter-spacing: .04em; background: var(--text); color: var(--bg); padding: 2px 12px; clip-path: var(--jag-b); transform: rotate(-2deg); }
.date-head .add { color: var(--gold-text); font-size: 13px; font-weight: 700; letter-spacing: 0; }
.empty { text-align: center; color: var(--fg-soft); padding: 28px 16px; font-size: 14px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stats .stat { margin-right: var(--th); }
.stat { padding: 10px 12px; }
.stat:nth-child(2) { transform: rotate(.6deg); }
.stat .k { font-size: 11.5px; font-weight: 700; color: var(--ink-soft); letter-spacing: .1em; }
.stat .v { font-family: var(--display); font-weight: 400; font-size: 21px; margin-top: 2px; letter-spacing: .02em; }
.select {
  width: 100%; padding: 13px 40px 13px 16px; border: 0; appearance: none; -webkit-appearance: none; font-size: 16px; font-weight: 900; color: var(--ink); clip-path: var(--jag-a);
  background: var(--paper) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' fill='none' stroke='%2314213D' stroke-width='2'/></svg>") no-repeat right 18px center;
}

/* ── 底部卡片：羊皮紙、上緣斜切，標題是墨藍小牌 ── */
.backdrop { position: fixed; inset: 0; background: rgba(2, 6, 14, .66); opacity: 0; pointer-events: none; transition: opacity var(--s); z-index: 20; }
.backdrop.show { opacity: 1; pointer-events: auto; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 21;
  max-width: 560px; margin: 0 auto; max-height: 90vh; overflow-y: auto; overscroll-behavior: contain;
  background: var(--paper); clip-path: polygon(0 16px, 100% 0, 100% 100%, 0 100%);
  padding: 30px 20px calc(env(safe-area-inset-bottom) + 18px);
  transform: translateY(105%); transition: transform var(--s) var(--ease);
}
.sheet.show { transform: translateY(0); }
.sheet .grip { display: none; }
.sheet h3 { display: inline-block; margin: 0 0 18px; font-family: var(--serif); font-size: 21px; font-weight: 900; letter-spacing: .04em; background: var(--ink); color: var(--paper); padding: 4px 14px 3px; clip-path: var(--jag-a); transform: rotate(-2deg); transform-origin: left; }
.seg { display: flex; gap: 6px; margin-bottom: 18px; }
.seg button { flex: 1; padding: 9px 0; font-size: 14.5px; font-weight: 700; color: var(--fg); letter-spacing: .06em; clip-path: var(--jag-btn); background: var(--fill); }
.seg button.on { background: var(--gold); color: var(--on-gold); box-shadow: none; opacity: 1; font-weight: 900; transform: scale(1.05) rotate(-2deg); }
.amount-row { display: flex; align-items: baseline; gap: 6px; padding-bottom: 6px; background: var(--hatch) bottom / 100% 1px no-repeat; }
.amount-row .cur { font-family: var(--display); font-size: 26px; color: var(--ink-soft); }
.amount-input { flex: 1; min-width: 0; font-family: var(--display); font-size: 48px; font-weight: 400; letter-spacing: .01em; border: 0; background: none; padding: 0; color: var(--ink); }
.amount-input:focus, .note-input:focus { outline: none; }
.amount-row:focus-within { background: linear-gradient(var(--ink), var(--ink)) bottom / 100% 1px no-repeat; }
.note-input { width: 100%; border: 0; background: var(--hatch) bottom / 100% 1px no-repeat; font-size: 16px; padding: 12px 0; color: var(--ink); }
.section > #hSearch, #view > .section #hSearch { background: var(--paper); color: var(--ink); padding: 12px 14px; clip-path: var(--jag-a); margin-top: 12px; }
#hSearch::placeholder { color: var(--ink-soft); opacity: 1; }
.note-input:focus { background: linear-gradient(var(--ink), var(--ink)) bottom / 100% 1px no-repeat; }
.note-input::placeholder, .amount-input::placeholder { color: var(--ink-soft); opacity: .7; }
.field { padding: 16px 0 0; }
.field > label:not(.check), .field > .label { display: block; font-size: 12.5px; font-weight: 700; color: var(--fg-soft); letter-spacing: .12em; margin-bottom: 10px; }
.field input[type=text], .field input[type=number], .field input[type=time], .field select, .sheet select {
  width: 100%; padding: 12px 14px; border: 0; background: var(--fill); font-size: 16px; color: var(--ink); box-shadow: inset 0 -3px 0 var(--ink);
}
.field input:focus, .field select:focus, .check input[type=number]:focus { outline: none; box-shadow: inset 0 -3px 0 var(--ink), inset 0 0 0 2px var(--gold); }
.field .inline { display: flex; gap: 10px; }
.field .inline > * { flex: 1; min-width: 0; }
.sub-chips { margin-top: 10px; padding-top: 12px; background: var(--hatch) top / 100% 1px no-repeat; }
.check { display: flex; align-items: center; gap: 12px; padding: 12px 0; }
.check + .check { background: var(--hatch) top / 100% 1px no-repeat; }
.check input[type=checkbox], .check input[type=radio] { width: 20px; height: 20px; accent-color: var(--ink); flex: none; }
.check .grow { flex: 1; }
.check input[type=number] { width: 116px; padding: 9px 12px; border: 0; background: var(--fill); box-shadow: inset 0 -3px 0 var(--ink); text-align: right; color: var(--ink); }
.budget-line { margin-top: 16px; padding: 12px 14px; background: var(--paper-2); font-size: 13px; color: var(--ink-soft); clip-path: var(--jag-b); }
.budget-line.over { background: var(--warn-face); color: var(--on-warn); }
.actions { display: flex; gap: 12px; margin-top: 22px; position: sticky; bottom: 0; background: var(--paper); padding: 8px 4px 4px 0; }
.actions .btn { flex: 1; }
.actions .btn.primary { flex: 2; }
.steps { font-size: 12px; font-weight: 700; color: var(--fg-soft); letter-spacing: .14em; margin-bottom: 6px; }
.kv { display: flex; justify-content: space-between; padding: 8px 0; font-size: 15px; }
.kv.total { margin-top: 6px; padding-top: 14px; font-weight: 900; background: var(--hatch) top / 100% 1px no-repeat; }
.time-row { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; font-size: 14px; color: var(--fg-soft); }
.time-row input { width: auto !important; padding: 8px 14px !important; }

/* 日期選擇器 */
.picker { margin-top: 12px; padding: 14px; background: var(--paper-2); }
.picker-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; font-size: 15px; font-weight: 900; }
.picker-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center; }
.picker-grid .h { font-size: 11px; color: var(--ink-soft); padding: 4px 0; }
.picker-grid button { aspect-ratio: 1; font-size: 14px; display: grid; place-items: center; position: relative; }
.picker-grid button.today { color: var(--gold-ink); font-weight: 900; }
.picker-grid button.sel { background: var(--ink); color: var(--paper); clip-path: var(--jag-a); transform: rotate(-4deg); }
.picker-grid button:disabled { color: rgba(20, 33, 61, .25); }
.picker-grid button.has::after { content: ''; position: absolute; bottom: 5px; width: 5px; height: 5px; background: var(--gold-ink); transform: rotate(45deg); }
.picker-grid button.sel.has::after { background: var(--gold); }

/* 提示訊息：羊皮紙鋸齒、斜的、彈進來 */
.toast {
  position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 100px); z-index: 30;
  transform: translateX(-50%) rotate(-3deg) scale(.6); opacity: 0; transition: opacity var(--q), transform var(--s) var(--pop);
  background: var(--bg-3); color: var(--text); padding: 11px 22px; font-size: 15px; font-weight: 900; box-shadow: inset 0 0 0 2px var(--text); letter-spacing: .04em;
  max-width: calc(100% - 40px); pointer-events: none; clip-path: var(--jag-btn);
}
.toast.show { opacity: 1; transform: translateX(-50%) rotate(-3deg); }
.toast { display: flex; align-items: center; gap: 14px; white-space: nowrap; }
.toast span { overflow: hidden; text-overflow: ellipsis; }
.toast.has-action.show { pointer-events: auto; }
.toast-undo { color: var(--on-gold); background: var(--gold); font-weight: 900; padding: 4px 10px; letter-spacing: .08em; flex: none; clip-path: var(--jag-b); }
.loading { text-align: center; color: var(--text-soft); padding: 48px 0; font-size: 14px; letter-spacing: .08em; }

/* ── 統計 ── */
.heat0 { background: var(--tone-ink); }
.heat1 { background: color-mix(in srgb, var(--ink) 14%, var(--paper)); }
.heat2 { background: color-mix(in srgb, var(--ink) 32%, var(--paper)); }
.heat3 { background: color-mix(in srgb, var(--ink) 62%, var(--paper)); color: var(--paper); }
.heat4 { background: var(--ink); color: var(--paper); }
.cal-cell.heat3, .cal-cell.heat4 { color: var(--paper); }
.cal-cell.heat4 .pay, .cal-cell.heat3 .pay { background: var(--paper); color: var(--ink); }
.cal-cell.sel.heat3, .cal-cell.sel.heat4 { box-shadow: inset 0 0 0 3px var(--paper), 0 0 0 2px var(--ink); }
.stat-nav { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
.stat-nav .icon-btn { color: var(--text); }
.stat-title { flex: 1; text-align: center; font-family: var(--serif); font-size: 20px; font-weight: 900; letter-spacing: .04em; color: var(--text); }
.stat-title .link { display: block; margin: 2px auto 0; font-family: var(--sans); font-size: 12px; }
.legend { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 14px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.lg-box { display: inline-block; width: 11px; height: 11px; transform: skewX(-20deg); }
.lg-box.over { background: var(--warn-face); }
.lg-line { display: inline-block; width: 16px; border-top: 2px dashed var(--ink-soft); }

.week-chart { display: flex; gap: 4px; height: 200px; }
.wk-col { flex: 1; display: flex; flex-direction: column; }
.wk-col.sel { background: var(--tone-ink); }
.wk-plot { position: relative; flex: 1; margin: 20px 6px 0; }
.wk-bar { position: absolute; left: 14%; right: 14%; bottom: 0; background: var(--ink); transform: skewX(-8deg); }
.wk-bar.over { background: var(--warn-face); }
.wk-val { position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%); font-family: var(--display); font-size: 12px; color: var(--ink); white-space: nowrap; padding-bottom: 3px; letter-spacing: .02em; }
.wk-line { position: absolute; left: -2px; right: -2px; border-top: 2px dashed var(--gold-ink); opacity: .7; z-index: 1; }
.wk-day { font-size: 12px; text-align: center; padding: 8px 0 4px; line-height: 1.35; color: var(--ink-soft); }
.wk-day.today { color: var(--ink); font-weight: 900; }

.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.cal-head { text-align: center; font-size: 11px; font-weight: 700; color: var(--ink-soft); padding-bottom: 6px; letter-spacing: .1em; }
.cal-cell { aspect-ratio: 1 / 1.1; padding: 5px 2px 4px; display: flex; flex-direction: column; justify-content: space-between; align-items: center; min-width: 0; color: var(--ink); }
.cal-cell.blank { background: none; }
.cal-cell.future { opacity: .4; }
.cal-cell.today .cal-d { font-weight: 900; text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px; }
.cal-cell.sel { box-shadow: inset 0 0 0 3px var(--ink); transform: rotate(-3deg) scale(1.06); }
.cal-d { font-size: 12px; line-height: 1; display: flex; gap: 2px; align-items: center; }
.cal-v { font-size: 10.5px; line-height: 1.1; white-space: nowrap; overflow: hidden; max-width: 100%; }
.pay { font-style: normal; font-size: 9px; font-weight: 900; background: var(--ink); color: var(--paper); padding: 1px 3px; line-height: 1.1; }

.share-row { display: block; width: 100%; text-align: left; padding: 12px 0; }
.share-row + .share-row, .share-sub + .share-row { background: var(--hatch) top / 100% 1px no-repeat; }
.share-top { display: flex; justify-content: space-between; font-size: 15px; font-weight: 700; }
.share-sub { display: flex; justify-content: space-between; font-size: 14px; padding: 5px 0 5px 18px; color: var(--ink-soft); }

.year-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.mini-month { padding: 10px; text-align: left; margin-right: 0; }
.mini-month:nth-child(3n+2) { transform: rotate(.6deg); }
.mini-title { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; font-weight: 900; margin-bottom: 8px; }
.mini-title .muted { font-size: 11px; font-weight: 400; }
.mini-cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
.mini { display: block; aspect-ratio: 1; }
.mini.blank { background: none; }
.mini.future { opacity: .35; }
.mini.today { box-shadow: 0 0 0 1.5px var(--ink); }

/* ── 首頁：本週支出（厚卡；今天那根是金色） ── */
.week-card { display: block; width: calc(100% - var(--th)); text-align: left; padding: 14px 16px 12px; transform: rotate(.5deg); }
.week-card .wc-top { display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
.week-card .wc-top > span:first-child { font-family: var(--serif); font-weight: 900; font-size: 17px; letter-spacing: .06em; }
.week-card .wc-link { color: var(--gold-ink); font-weight: 700; }
.week-card .wc-value { font-family: var(--display); font-weight: 400; font-size: 36px; line-height: 1; margin-top: 6px; letter-spacing: .01em; }
.wc-bars { display: flex; align-items: flex-end; gap: 8px; height: 92px; margin-top: 12px; }
.wc-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; }
.wc-bar { width: 100%; max-width: 30px; margin-top: auto; background: rgba(20, 33, 61, .22); min-height: 6px; transform: skewX(-10deg); }
.wc-col.today .wc-bar { background: var(--ink); }
.wc-day { font-size: 11px; font-weight: 700; color: var(--ink-soft); }
.wc-col.today .wc-day { color: var(--paper); background: var(--ink); padding: 0 5px; clip-path: var(--jag-b); }
.week-card:not(:disabled):active { transform: rotate(.5deg) translate(4px, 4px); }

#hSearch:focus { background: var(--paper); box-shadow: inset 0 -3px 0 var(--ink); }

/* ── 記下的回饋：斜橫幅（羊皮紙＝一般、朱紅＝超支、金色＋碎星＝進帳／存進寶庫） ── */
.cheer { position: fixed; left: 0; right: 0; top: 36%; z-index: 45; pointer-events: none; overflow: visible; }
.cheer .band { margin: 0 -8%; padding: 16px 14% 14px; background: var(--paper); color: var(--ink); box-shadow: 0 0 0 4px var(--bg-3), 0 12px 0 4px var(--bg-3); text-align: center; }
.cheer .ransom { font-size: 40px; }
.cheer .rn { animation: none; }
.cheer .s { margin-top: 8px; font-size: 15px; font-weight: 900; letter-spacing: .06em; }
.cheer .x { display: inline-block; margin-top: 8px; font: 900 12px/1 var(--sans); letter-spacing: .12em; background: var(--ink); color: var(--paper); padding: 5px 10px; clip-path: var(--jag-b); }
.cheer.gold .band { background: var(--gold); color: var(--on-gold); }
.cheer.over .band { background: var(--warn-face); color: var(--on-warn); }
.cheer.over .x { background: var(--bg-3); color: var(--text); }
.cheer .bits i { position: absolute; left: 50%; top: 50%; width: 22px; height: 22px; background: var(--paper);
  clip-path: polygon(50% 0, 61% 32%, 98% 22%, 70% 50%, 98% 78%, 61% 68%, 50% 100%, 39% 68%, 2% 78%, 30% 50%, 2% 22%, 39% 32%); }
.cheer .bits i:nth-child(even) { background: var(--bg-3); width: 16px; height: 16px; }

/* ───────── v2.6 打磨：收掉尖與歪、字體收斂 ─────────
   1. 只有首頁大數字（與它的引導斜線）、換頁動畫、記下橫幅可以歪；其他東西一律擺正
   2. 宋體只給頁面標題與底部卡片標題；介面一律黑體 500/700；Anton 只給大數字（首頁金額、本週支出、淨資產、記帳金額）
   3. 分隔線改成 1px 細線（斜線紋太花） */
.title, .subtitle, .sync, .section-head h2, .hero-label > span:first-child, .slot, .bcard, .week-card, .stat, .mini-month,
.avatar, .date-head > :first-child, .chip.on, .seg button.on, .picker-grid button.sel, .sheet h3, .wc-day, .cal-cell.sel, .quick::before { transform: none; }
.bcard:nth-of-type(odd), .bcard:nth-of-type(even), .stat:nth-child(2), .mini-month:nth-child(3n+2), .slot:nth-child(even), .slot:nth-child(odd) { transform: none; }
.week-card:not(:disabled):active { transform: translate(4px, 4px); }
.toast { transform: translateX(-50%) translateY(16px); transition: opacity var(--q), transform var(--s) var(--ease); }
.toast.show { transform: translateX(-50%); }
.hero-value { -webkit-text-stroke: 0; transform: rotate(-3deg); }

/* 頁面標題：乾淨的宋體大字 */
.title { font-family: var(--serif); font-weight: 900; font-size: 28px; line-height: 1.15; letter-spacing: .02em; color: var(--text); }
.subtitle { margin-top: 6px; padding: 0; background: none; font-weight: 500; font-size: 12.5px; letter-spacing: .08em; color: var(--text-soft); }
.sync { background: none; padding: 4px 0; font-weight: 500; color: var(--text-soft); }

/* 區塊標題：黑體小字，不墊色塊 */
.section-head h2 { font-family: var(--sans); font-weight: 700; font-size: 16px; letter-spacing: .06em; color: var(--text); background: none; padding: 0; }
.section-head h2 .num { font-family: var(--sans); font-weight: 700; }
.hero-label > span:first-child { font-family: var(--sans); font-weight: 700; font-size: 14px; letter-spacing: .12em; background: none; padding: 0; color: var(--text-soft); }
.date-head > :first-child { font-family: var(--sans); font-weight: 700; font-size: 13.5px; letter-spacing: .04em; background: none; color: var(--text-soft); padding: 0; }
.sheet h3 { font-weight: 900; font-size: 20px; background: none; color: var(--ink); padding: 0; letter-spacing: .02em; }

/* 卡片內標題與數字：黑體 */
.bcard .b-top { font-family: var(--sans); font-weight: 700; font-size: 16.5px; }
.bcard .b-tag { font-weight: 700; letter-spacing: .04em; padding: 4px 8px; }
.bcard .b-mid b, .row .amt, .stat .v, .slot-v, .budget-head .num, .acc-row > :last-child, .wk-val { font-family: var(--sans); font-weight: 700; letter-spacing: 0; }
.row .amt { font-size: 16px; }
.bcard .b-mid b { font-size: 17px; }
.stat .v { font-size: 17px; }
.slot-v { font-size: 16px; }
.budget-head .num { font-size: 16px; }
.acc-row > :last-child { font-size: 15.5px; }
.week-card .wc-top > span:first-child { font-family: var(--sans); font-weight: 700; font-size: 15px; letter-spacing: .04em; }
.row .main { font-weight: 500; }
.tabbar button span { font-family: var(--sans); font-weight: 500; font-size: 12px; letter-spacing: .04em; }
.tabbar button.on { transform: translateY(-4px); }
.tabbar button.on span { font-weight: 700; }
.tabbar button.on::before { clip-path: none; inset: 2px 6px 0; animation: none; }
.tabbar button.on::after { display: none; }
.stat-title { font-family: var(--sans); font-weight: 700; font-size: 18px; }

/* 按鈕、標籤：字重 700，字距收小 */
.btn { font-weight: 700; letter-spacing: .04em; }
.chip.on, .seg button.on { font-weight: 700; transform: none; }
.quick::before { font: 700 13px/1 var(--sans); letter-spacing: .14em; padding: 5px 10px; }
.cheer .s { font-weight: 700; }

/* 長條、進度條擺正；頂部、底部、卡片上緣改成平的（歪只留在首頁大數字的引導斜線） */
.bar, .wk-bar, .wc-bar, .lg-box { transform: none; }
.bar { margin-inline: 0; height: 8px; }
.topbar { clip-path: none; padding-bottom: 14px; box-shadow: 0 1px 0 var(--line-bg); }
.topbar::after { display: none; }
.tabbar { clip-path: none; padding-top: 8px; box-shadow: 0 -1px 0 var(--line-bg); }
.sheet { clip-path: none; padding-top: 24px; }
.hr { height: 1px; }
.amount-row:focus-within, .note-input:focus { background-size: 100% 2px; }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

  <script>
'use strict';
/* 記帳 App — 前端
 * 資料流：畫面讀本機快取 → 記帳先改本機、排進上傳佇列 → 背景送到 Apps Script → 以伺服器回傳的彙總為準。
 */
const CARRY = '(上期滾入)';
const K_CACHE = 'ledger.cache.v1';
const K_QUEUE = 'ledger.queue.v1';
const K_PREF = 'ledger.pref.v1';

const $ = (s, el) => (el || document).querySelector(s);
const $$ = (s, el) => Array.from((el || document).querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = n => (n < 0 ? '-' : '') + '$' + Math.abs(Math.round(n || 0)).toLocaleString('en-US');
const pad = n => String(n).padStart(2, '0');
const byOrder = (a, b) => (a.order || 0) - (b.order || 0);
const WEEK = ['日', '一', '二', '三', '四', '五', '六'];

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* 無法寫入時仍可使用 */ } },
  del(k) { try { localStorage.removeItem(k); } catch (e) { /* ignore */ } }
};

const S = {
  data: null, txs: [], queue: store.get(K_QUEUE, []), pref: store.get(K_PREF, {}),
  tab: 'home', syncing: false, syncError: false, historyCycle: null, historyCache: {}, sheetHandler: null
};

S.stats = { mode: S.pref.statsMode || 'month', anchor: Date.now(), sel: null, withFixed: false, open: null };
S.years = {}; // 年份 → 伺服器的日彙總 { yyyyMMdd: { 分類編號: 金額 } }；null 代表讀取失敗
S.staleYears = {}; // 有舊日期的修改還在上傳中的年份

function persist() { store.set(K_CACHE, { data: S.data, txs: S.txs }); store.set(K_QUEUE, S.queue); }
function savePref() { store.set(K_PREF, S.pref); }
function newId() { return 't' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

/* 伺服器呼叫：本機測試用模擬的 google.script.run；GitHub Pages 上改用 fetch 帶金鑰呼叫 Apps Script。 */
const K_KEY = 'ledger.key.v1';
const onGas = !!(window.google && google.script && google.script.run);
function call(fn, ...args) {
  if (onGas) {
    return new Promise((resolve, reject) => {
      google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fn](...args);
    });
  }
  const k = store.get(K_KEY, '');
  if (!k) return Promise.reject(new Error('AUTH:'));
  // text/plain 不會觸發 CORS 預檢，Apps Script 才收得到
  return fetch(window.LEDGER_API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ k, fn, args }) })
    .then(r => r.json())
    .then(res => { if (!res.ok) throw new Error(res.error); return res.data; });
}
const rawMsg = e => String((e && e.message) || e);
// 金鑰錯誤（AUTH:）不算使用者錯誤：待上傳的紀錄要留著，等重新設定金鑰後再送
const isUserError = e => /E:/.test(rawMsg(e));
const isAuthError = e => /AUTH:/.test(rawMsg(e));
const errMsg = e => rawMsg(e).replace(/^.*?(E|AUTH):/, '');

/* ───────────── 查詢小工具 ───────────── */

const acc = id => S.data.accounts.find(a => a.id === id);
const cat = id => S.data.categories.find(c => c.id === id);
const activeAccounts = type => S.data.accounts.filter(a => !a.disabled && (!type || a.type === type)).sort(byOrder);
const activeCats = kinds => S.data.categories.filter(c => !c.disabled && (!kinds || kinds.includes(c.kind))).sort(byOrder);
const kindsForType = t => t === '支出' ? ['支出'] : t === '收入' ? ['收入'] : ['資產配置', '轉帳'];
function groupsOf(kinds) {
  const out = [];
  activeCats(kinds).forEach(c => { if (!out.includes(c.group)) out.push(c.group); });
  return out;
}
const expenseGroups = () => groupsOf(['支出']);
function catLabel(c) {
  if (!c) return '未分類';
  return ['收入', '轉帳', '資產配置'].includes(c.group) ? c.name : c.group + '・' + c.name;
}
const accName = id => (acc(id) || {}).name || '未指定';

const cycles = () => S.data.cycles || [];
const currentCycle = () => cycles()[cycles().length - 1];
function cycleFor(time) {
  let id = cycles().length ? cycles()[0].id : '';
  cycles().forEach(cy => { if (cy.start <= time) id = cy.id; });
  return id;
}
const budgetOf = cid => (S.data.budgets || {})[cid] || {};
function sumBy(cid, pick) {
  const out = {};
  Object.keys(S.data.summary || {}).forEach(k => {
    const [c, catId] = k.split('|');
    if (c !== cid) return;
    const ct = cat(catId);
    const key = ct && pick(ct);
    if (key) out[key] = (out[key] || 0) + S.data.summary[k];
  });
  return out;
}
const spentByGroup = cid => sumBy(cid, c => c.kind === '支出' ? c.group : null);
const kindTotal = (cid, kind) => sumBy(cid, c => c.kind === kind ? 'x' : null).x || 0;
function unallocated(cid) {
  const b = budgetOf(cid);
  let allocated = 0;
  Object.keys(b).forEach(g => { if (g !== CARRY) allocated += b[g]; });
  return kindTotal(cid, '收入') + (b[CARRY] || 0) - kindTotal(cid, '資產配置') - allocated;
}

/* ───────────── 時間 ───────────── */

const startOfDay = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
function fmtTime(ms) {
  const d = new Date(ms);
  const hm = pad(d.getHours()) + ':' + pad(d.getMinutes());
  return startOfDay(d).getTime() === startOfDay(new Date()).getTime() ? hm : (d.getMonth() + 1) + '/' + d.getDate() + ' ' + hm;
}
const fmtDay = ms => { const d = new Date(ms); return (d.getMonth() + 1) + '月' + d.getDate() + '日 週' + WEEK[d.getDay()]; };
const fmtDate = ms => { const d = new Date(ms); return (d.getMonth() + 1) + '/' + d.getDate(); };
function toLocalInput(ms) {
  const d = new Date(ms);
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes());
}

/* ───────────── 本機帳務（與伺服器 effect_ 相同邏輯） ───────────── */

function applyLocal(tx, sign) {
  if (!tx || tx.void) return;
  const a = tx.amount * sign;
  const b = S.data.balances;
  if (tx.from) b[tx.from] = (b[tx.from] || 0) - a;
  if (tx.to) b[tx.to] = (b[tx.to] || 0) + a;
  if (tx.categoryId && tx.cycleId) {
    const k = tx.cycleId + '|' + tx.categoryId;
    S.data.summary[k] = (S.data.summary[k] || 0) + a;
  }
}

function commitTx(tx, prev, learn) {
  tx.cycleId = cycleFor(tx.time);
  tx.updated = Date.now();
  invalidateStats(tx, prev);
  if (prev) applyLocal(prev, -1);
  applyLocal(tx, 1);
  S.txs = S.txs.filter(t => t.id !== tx.id).concat([tx]);
  if (learn) learnLocal(learn);
  if (tx.noticeId && S.data.notices) S.data.notices = S.data.notices.filter(n => n.id !== tx.noticeId);
  enqueue({ op: 'saveTx', tx: tx, learn: learn || null });
}

function removeTx(prev) {
  invalidateStats(null, prev);
  applyLocal(prev, -1);
  S.txs = S.txs.filter(t => t.id !== prev.id);
  enqueue({ op: 'deleteTx', id: prev.id });
}

function learnLocal(l) {
  const kw = l.keyword.trim().replace(/\s+/g, ' ');
  const hit = S.data.keywords.find(k => k.keyword === kw);
  if (hit) { hit.categoryId = l.categoryId; hit.accountId = l.accountId || hit.accountId; hit.count = (hit.count || 0) + 1; hit.last = Date.now(); }
  else S.data.keywords.unshift({ keyword: kw, categoryId: l.categoryId, accountId: l.accountId || '', count: 1, last: Date.now() });
}

/* ───────────── 同步 ───────────── */

function enqueue(item) {
  S.queue.push(item);
  persist();
  render();
  flush();
}

async function flush() {
  if (S.syncing || !S.queue.length) return;
  S.syncing = true;
  renderSync();
  let last = null;
  let dropped = false;
  while (S.queue.length) {
    const item = S.queue[0];
    try {
      last = item.op === 'saveTx'
        ? await call('api_saveTx', item.tx, item.learn)
        : await call('api_deleteTx', item.id);
      S.queue.shift();
      S.syncError = false;
      persist();
    } catch (e) {
      if (isUserError(e)) {
        S.queue.shift();
        dropped = true;
        persist();
        toast('有一筆紀錄上傳失敗：' + errMsg(e));
        continue;
      }
      S.syncing = false;
      S.syncError = true;
      renderSync();
      setTimeout(flush, 15000);
      return;
    }
  }
  S.syncing = false;
  if (last) mergeLedger(last);
  Object.keys(S.staleYears).forEach(y => { delete S.years[y]; });
  S.staleYears = {};
  persist();
  render();
  if (dropped) refresh(true);
}

function mergeLedger(st) {
  S.data.balances = st.balances;
  S.data.summary = st.summary;
  S.data.budgets = Object.assign({}, S.data.budgets, st.budgets);
  if (st.accounts) S.data.accounts = st.accounts;
}

function setData(d) {
  S.txs = d.recent || S.txs;
  delete d.recent;
  S.data = d;
  S.historyCache = {};
  S.years = {};
  persist();
  render();
}

async function refresh(silent) {
  try {
    const d = await call('api_bootstrap');
    if (S.queue.length) return; // 還有待上傳的紀錄，等上傳完再以伺服器為準
    setData(d);
    S.syncError = false;
    renderSync();
  } catch (e) {
    S.syncError = true;
    renderSync();
    if (isAuthError(e)) { renderKeySetup(errMsg(e)); return; }
    if (!S.data) {
      $('#view').innerHTML = '<div class="loading">無法載入：' + esc(errMsg(e)) + '<br><br><button class="btn primary" type="button" onclick="start()">重試</button></div>';
    } else if (!silent) toast('無法連線，目前顯示本機資料');
  }
}

/* ───────────── 畫面：共用 ───────────── */

/** 提示訊息。undo：顯示「復原」按鈕，5 秒內可以按。 */
function toast(msg, undo) {
  const t = $('#toast');
  t.innerHTML = '<span>' + esc(msg) + '</span>' + (undo ? '<button type="button" class="toast-undo">復原</button>' : '');
  t.classList.toggle('has-action', !!undo);
  if (undo) $('.toast-undo', t).onclick = () => { t.classList.remove('show'); undo(); };
  t.classList.add('show');
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => t.classList.remove('show'), undo ? 5000 : 2600);
}

function renderSync() {
  const b = $('#syncBadge');
  const n = S.queue.length;
  b.className = 'sync';
  if (S.syncing) { b.textContent = '同步中'; b.classList.add('pending'); }
  else if (n && S.syncError) { b.textContent = '離線・' + n + ' 筆待上傳'; b.classList.add('error'); }
  else if (n) { b.textContent = n + ' 筆待上傳'; b.classList.add('pending'); }
  else if (S.syncError) { b.textContent = '離線'; b.classList.add('error'); }
  else b.textContent = '已同步';
}

const TAB_TITLES = { history: '明細', stats: '統計', settings: '設定' };

function render() {
  renderSync();
  if (!S.data) return;
  // 雲端資料晚一兩秒才到、或上傳完成時會重畫：保留正在打的字與游標，不用重點輸入框
  const ae = document.activeElement;
  const typing = ae && ae.id && ae.tagName === 'INPUT' && $('#view').contains(ae)
    ? { id: ae.id, value: ae.value, a: ae.selectionStart, b: ae.selectionEnd } : null;
  const quick = $('#quickInput') ? $('#quickInput').value : '';
  renderView();
  if (quick && $('#quickInput') && !$('#quickInput').value) $('#quickInput').value = quick;
  if (typing) {
    const el = document.getElementById(typing.id);
    if (el && el !== ae) {
      el.value = typing.value;
      el.focus({ preventScroll: true });
      try { el.setSelectionRange(typing.a, typing.b); } catch (e) { /* number 欄位不支援 */ }
    }
  }
}

function renderView() {
  const now = new Date();
  const cy = currentCycle();
  const title = S.tab === 'home' ? (now.getMonth() + 1) + '月' + now.getDate() + '日' : TAB_TITLES[S.tab];
  $('#title').textContent = title; // v2.6：頁面標題用乾淨的宋體，剪報字只留在換頁動畫與記下橫幅
  S.animTitle = false;
  let sub = '週' + WEEK[now.getDay()];
  if (cy) sub += '・本期第 ' + (Math.floor((startOfDay(now) - startOfDay(new Date(cy.start))) / 864e5) + 1) + ' 天';
  $('#cycleInfo').textContent = S.tab === 'home' ? sub : '';
  $$('.tabbar button').forEach(b => b.classList.toggle('on', b.dataset.tab === S.tab));
  if (S.tab === 'home') renderHome();
  else if (S.tab === 'history') renderHistory();
  else if (S.tab === 'stats') renderStats();
  else renderSettings();
}

/** 剪報標題：逐字給不同樣式與角度（依字碼決定，同一個字每次都一樣），相鄰不重複。anim：逐字彈入 */
function ransom(text, anim) {
  let i = 0, prev = -1;
  const spans = [...text].map(ch => {
    const h = (ch.charCodeAt(0) * 31 + i * 17 + 7) % 97;
    let v = (h + i) % 4; if (v === prev) v = (v + 1) % 4; prev = v;
    const r = (h % 7) - 3, y = ((h >> 2) % 3) - 1;
    const lat = /[0-9A-Za-z]/.test(ch) ? ' lat' : '';
    return '<span class="rn r' + v + lat + '" style="--r:' + r + 'deg;--y:' + y + 'px;--d:' + ((anim ? 300 : 0) + (i++) * 28) + 'ms">' + esc(ch) + '</span>';
  }).join('');
  return '<h1 class="ransom' + (anim ? ' anim' : '') + '" aria-label="' + esc(text) + '"><span aria-hidden="true">' + spans + '</span></h1>';
}

/* 換頁：金色星芒從按下的分頁炸開 → 蓋滿時換頁、網點與碎星進場、頁面圖示彈出 → 停一下 → 一起縮回（約 0.75 秒） */
const TAB_BADGE = { home: ['house', '首頁'], history: ['list-bullets', '明細'], stats: ['chart-bar', '統計'], settings: ['sliders-horizontal', '設定'] };
let navBusy = false;
async function navTo(tab, btn) {
  const go = () => { S.tab = tab; S.animTitle = true; window.scrollTo(0, 0); render(); };
  if (navBusy) return;
  if (tab === S.tab) { window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
  if (document.hidden || matchMedia('(prefers-reduced-motion: reduce)').matches || !Element.prototype.animate) { go(); return; }
  navBusy = true;
  const fx = $('#fx');
  const r = btn.getBoundingClientRect(), ox = r.left + r.width / 2, oy = r.top + r.height / 2;
  const anim = (el, kf, opt) => el.animate(kf, Object.assign({ duration: 300, easing: 'cubic-bezier(.2,0,0,1)', fill: 'both' }, opt)).finished;
  const star = cls => { const d = document.createElement('div'); d.className = 'star ' + cls; d.style.left = ox + 'px'; d.style.top = oy + 'px'; fx.append(d); return d; };
  fx.innerHTML = '';
  const ink = star('ink'), gold = star('');
  const dots = document.createElement('div'); dots.className = 'layer dots'; fx.append(dots);
  const bits = document.createElement('div'); bits.className = 'layer bits'; bits.innerHTML = '<i></i>'.repeat(8); fx.append(bits);
  const badge = document.createElement('div'); badge.className = 'badge';
  badge.innerHTML = '<span class="ic">' + icon(TAB_BADGE[tab][0]) + '</span><b>' + TAB_BADGE[tab][1] + '</b>'; fx.append(badge);
  const big = Math.hypot(innerWidth, innerHeight) / 13, IN = 260, HOLD = 160, OUT = 220;
  const guard = new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 1500));
  try {
    await Promise.race([guard, (async () => {
      await Promise.all([
        anim(gold, [{ transform: 'translate(-50%,-50%) scale(0) rotate(0)' }, { transform: 'translate(-50%,-50%) scale(' + big + ') rotate(40deg)' }], { duration: 280 }),
        anim(ink, [{ transform: 'translate(-50%,-50%) scale(0) rotate(0)' }, { transform: 'translate(-50%,-50%) scale(' + big * .92 + ') rotate(26deg)' }], { duration: 280, delay: 50 })]);
      go();
      anim(dots, [{ opacity: 0 }, { opacity: 1 }], { duration: 160 });
      bits.style.opacity = 1;
      [...bits.children].forEach((b, i) => {
        const a = i / 8 * Math.PI * 2 + .3, d = 110 + (i % 3) * 40, x = Math.cos(a), y = Math.sin(a);
        anim(b, [{ transform: 'translate(-50%,-50%) scale(0) rotate(0)' },
          { transform: 'translate(calc(-50% + ' + x * d + 'px),calc(-50% + ' + y * d + 'px)) scale(1) rotate(' + (120 + i * 20) + 'deg)', offset: .6 },
          { transform: 'translate(calc(-50% + ' + x * (d + 18) + 'px),calc(-50% + ' + y * (d + 18) + 'px)) scale(.8) rotate(' + (160 + i * 20) + 'deg)' }], { duration: IN + HOLD, delay: i * 12 });
      });
      await anim(badge, [{ transform: 'translate(-50%,-50%) scale(0) rotate(-30deg)' }, { transform: 'translate(-50%,-50%) scale(1.12) rotate(4deg)', offset: .7 }, { transform: 'translate(-50%,-50%) scale(1) rotate(-3deg)' }],
        { duration: IN, easing: 'cubic-bezier(.175,.885,.32,1.275)' });
      await new Promise(res => setTimeout(res, HOLD));
      [dots, bits].forEach(el => anim(el, [{ opacity: 1 }, { opacity: 0 }], { duration: 120 }));
      await Promise.all([
        anim(badge, [{ transform: 'translate(-50%,-50%) scale(1) rotate(-3deg)' }, { transform: 'translate(-50%,-50%) scale(0) rotate(25deg)' }], { duration: 180, easing: 'cubic-bezier(.3,0,1,1)' }),
        anim(gold, [{ transform: 'translate(-50%,-50%) scale(' + big + ') rotate(40deg)' }, { transform: 'translate(-50%,-50%) scale(0) rotate(90deg)' }], { duration: OUT, easing: 'cubic-bezier(.3,0,1,1)', delay: 30 }),
        anim(ink, [{ transform: 'translate(-50%,-50%) scale(' + big * .92 + ') rotate(26deg)' }, { transform: 'translate(-50%,-50%) scale(0) rotate(70deg)' }], { duration: OUT - 20, easing: 'cubic-bezier(.3,0,1,1)' })]);
    })()]);
  } catch (e) { /* 逾時就直接收掉 */ } finally {
    if (S.tab !== tab) go();
    fx.innerHTML = ''; navBusy = false;
  }
}

/* 分類圖示（Phosphor 線條圖示）：先看子類，再看大類；自訂的分類沒有對應時用包裹 */
const SUB_ICONS = {
  薪資: 'money', 獎金: 'sparkle', 投資收益: 'trend-up', 其他收入: 'coins', 孝親費: 'hand-heart', 訂閱: 'repeat', 分期付款: 'receipt', 其他固定: 'push-pin',
  交通: 'train', 日用品: 'basket', 車費: 'taxi', 禮物: 'gift', 娛樂: 'film-slate', 禮金: 'envelope', 購物: 'shopping-bag', 醫療: 'pill', 學習: 'books', 雜支: 'wrench',
  ETF定期定額: 'chart-line-up', 單筆投資: 'chart-bar', 儲蓄: 'piggy-bank', 帳戶互轉: 'arrows-left-right', 信用卡繳費: 'credit-card'
};
const FOOD_ICONS = { 日常: 'fork-knife', 約會: 'wine', 聚會: 'beer-stein' };
const GROUP_ICONS = { 日常: 'package', 約會: 'gift', 聚會: 'beer-stein', 其他花費: 'shopping-bag', 固定支出: 'push-pin', 收入: 'money', 資產配置: 'chart-line-up', 轉帳: 'arrows-left-right' };
function catIcon(c) {
  if (!c) return 'package';
  if (c.name === '伙食' && FOOD_ICONS[c.group]) return FOOD_ICONS[c.group];
  return SUB_ICONS[c.name] || GROUP_ICONS[c.group] || 'package';
}

function txRow(t) {
  const c = cat(t.categoryId);
  const sign = t.type === '支出' ? '-' : t.type === '收入' ? '+' : '';
  const cls = t.type === '支出' ? 'out' : t.type === '收入' ? 'in' : 'move';
  const where = t.type === '支出' ? accName(t.from) : t.type === '收入' ? accName(t.to) : accName(t.from) + ' → ' + accName(t.to);
  const extra = t.symbol ? '・' + t.symbol + (t.shares ? ' ' + t.shares + ' 股' : '') : '';
  // 大類由圖示表達，說明只寫子類與帳戶；時間放到金額下方，一行最多一個「・」
  return '<button class="row" type="button" data-tx="' + esc(t.id) + '">' +
    '<div class="avatar ' + cls + '">' + icon(catIcon(c)) + '</div>' +
    '<div class="grow"><div class="main">' + esc(t.note || catLabel(c)) + '</div>' +
    '<div class="sub">' + esc(c ? c.name : '未分類') + '・' + esc(where) + esc(extra) + '</div></div>' +
    '<div class="right"><div class="amt ' + cls + ' num">' + sign + money(t.amount).replace('-', '') + '</div>' +
    '<div class="time num">' + fmtTime(t.time) + '</div></div></button>';
}

/* 補記日期：首頁的日期膠囊。選了過去的日期後，接下來的記帳都記在那天，離開 App 就自動回到今天。 */
function entryTime(base) {
  if (!S.entryDay) return base || Date.now();
  const d = keyDate(S.entryDay);
  const t = new Date(base || Date.now());
  return new Date(d.getFullYear(), d.getMonth(), d.getDate(), t.getHours(), t.getMinutes()).getTime();
}
const timeOnDay = key => { const d = keyDate(key); const n = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate(), n.getHours(), n.getMinutes()).getTime(); };
const dayLabel = key => { const d = keyDate(key); return (d.getMonth() + 1) + '/' + d.getDate() + ' 週' + WEEK[d.getDay()]; };

/** 月曆選日期（記帳卡片與日期膠囊共用）。has：有紀錄的日期會加小點。 */
function pickerHtml(selKey, anchor, has) {
  const first = new Date(anchor.getFullYear(), anchor.getMonth(), 1);
  const next = new Date(anchor.getFullYear(), anchor.getMonth() + 1, 1);
  const todayKey = dayKey(new Date());
  let h = '<div class="picker"><div class="picker-nav">' +
    '<button type="button" class="icon-btn" data-act="pnav" data-v="-1" aria-label="上個月">' + icon('caret-left') + '</button>' +
    '<span>' + first.getFullYear() + '年' + (first.getMonth() + 1) + '月</span>' +
    '<button type="button" class="icon-btn" data-act="pnav" data-v="1" aria-label="下個月"' + (next > new Date() ? ' disabled' : '') + '>' + icon('caret-right') + '</button></div>' +
    '<div class="picker-grid">' + WEEK_MON.map(w => '<span class="h">' + w + '</span>').join('') +
    '<span></span>'.repeat((first.getDay() + 6) % 7);
  for (let d = first; d < next; d = addDays(d, 1)) {
    const k = dayKey(d);
    h += '<button type="button" data-act="pick" data-v="' + k + '" class="' + [k === todayKey ? 'today' : '', k === selKey ? 'sel' : '', has && has[k] ? 'has' : ''].join(' ') + '"' +
      (k > todayKey ? ' disabled' : '') + '>' + d.getDate() + '</button>';
  }
  return h + '</div></div>';
}

function recordedDays() {
  const out = {};
  S.txs.forEach(t => { out[dayKey(new Date(t.time))] = true; });
  return out;
}

function openDayPicker() {
  let anchor = S.entryDay ? keyDate(S.entryDay) : new Date();
  const draw = () => openSheet('<h3>要記在哪一天？</h3>' +
    '<div class="chips wrap">' + [0, -1, -2].map(n => {
      const k = dayKey(addDays(new Date(), n));
      const on = (S.entryDay || dayKey(new Date())) === k;
      return '<button type="button" class="chip' + (on ? ' on' : '') + '" data-act="pick" data-v="' + k + '">' + ['今天', '昨天', '前天'][-n] + '</button>';
    }).join('') + '</div>' +
    pickerHtml(S.entryDay || dayKey(new Date()), anchor, recordedDays()) +
    '<div class="small muted" style="margin-top:12px">有小點的日期代表已經有紀錄。選好之後，接下來記的帳都會記在那天，離開 App 會自動回到今天。</div>',
  (act, v) => {
    if (act === 'pnav') { anchor = new Date(anchor.getFullYear(), anchor.getMonth() + Number(v), 1); draw(); }
    else if (act === 'pick') {
      S.entryDay = v === dayKey(new Date()) ? null : v;
      closeSheet();
      render();
      setTimeout(() => { const i = $('#quickInput'); if (i) i.focus(); }, 250);
    }
  });
  draw();
}

function bindTxRows(root) {
  $$('[data-tx]', root).forEach(el => el.onclick = () => {
    const t = S.txs.find(x => x.id === el.dataset.tx) || findHistoryTx(el.dataset.tx);
    if (t) openEntry(t);
  });
}

/* ───────────── 首頁 ───────────── */

function cardReminders() {
  const today = startOfDay(new Date());
  const ym = today.getFullYear() + '-' + (today.getMonth() + 1);
  const dismissed = S.pref.dismiss || {};
  const out = [];
  activeAccounts('信用卡').forEach(a => {
    const bal = S.data.balances[a.id] || 0;
    if (bal >= 0 || !a.dueDay || dismissed[a.id] === ym) return;
    const dim = new Date(today.getFullYear(), today.getMonth() + 1, 0).getDate();
    const due = new Date(today.getFullYear(), today.getMonth(), Math.min(a.dueDay, dim));
    const diff = Math.round((due - today) / 864e5);
    if (diff > 5 || diff < -3) return;
    const when = diff === 0 ? '今天' : diff > 0 ? diff + ' 天後' : '已過 ' + (-diff) + ' 天';
    out.push({ a, bal, when, ym });
  });
  return out;
}

function renderHome() {
  const cy = currentCycle();
  const kws = S.data.keywords.filter(k => k.count > 0).sort((a, b) => b.count - a.count || (b.last || 0) - (a.last || 0)).slice(0, 6);
  const past = !!S.entryDay;
  // 大數字：可以用的錢（現金＋銀行，信用卡未繳是負數所以會自動扣掉）；點下去看淨資產與理財
  let h = '<div class="section"><button type="button" class="hero" id="assetCard">' +
    '<div class="hero-label"><span>可以用的錢</span><span class="link">淨資產' + icon('caret-right') + '</span></div>' +
    '<div class="hero-value num">' + money(balanceSum(a => a.type !== '理財')) + '</div>' +
    '<div class="hero-sub">現金＋銀行，已扣信用卡未繳</div></button>' + vaultHtml() + '</div>' + noticesHtml();

  h += '<div class="section"><form class="quick" id="quickForm">' +
    '<button type="button" class="date-pill' + (past ? ' past' : '') + '" id="dayPill" aria-label="選擇記帳日期">' + (past ? dayLabel(S.entryDay) : '今天') + icon('caret-down') + '</button>' +
    '<input id="quickInput" type="text" placeholder="午餐 150" autocomplete="off" enterkeyhint="done" aria-label="快速記帳">' +
    '<button class="go" type="submit" aria-label="記帳">' + icon('arrow-right') + '</button></form>' +
    (past ? '<div class="backfill-note"><span>正在補記 ' + dayLabel(S.entryDay) + ' 的帳</span><button type="button" class="link" id="backToday">回到今天</button></div>' : '') +
    '<div class="chips">' + kws.map(k => '<button class="chip" type="button" data-kw="' + esc(k.keyword) + '">' + esc(k.keyword) + '</button>').join('') +
    '<button class="chip ghost" type="button" id="manualBtn">' + icon('plus') + '手動</button></div>';

  if (S.data.needsRecalc) {
    h += '<div class="notice warn"><div class="grow">試算表被手動修改過，建議重新計算。</div><button class="btn" type="button" id="recalcBtn">重新計算</button></div>';
  }
  cardReminders().forEach(r => {
    h += '<div class="notice"><div class="grow">' + esc(r.a.name) + ' 繳費日' + r.when + '<div class="small muted num">未繳 ' + money(-r.bal) + '</div></div>' +
      '<button class="btn" type="button" data-pay="' + esc(r.a.id) + '">繳費</button>' +
      '<button class="icon-btn" type="button" data-dismiss="' + esc(r.a.id) + '" aria-label="本月不再提醒">' + icon('x') + '</button></div>';
  });
  h += '</div>';

  // 本週支出（週一到今天）：不含固定支出，今天那根用深色標出來
  const wk = weekSpend();
  const top = Math.max(1, ...wk.days.map(d => d.v));
  h += '<div class="section"><button type="button" class="week-card" id="weekCard">' +
    '<div class="wc-top"><span>本週支出</span><span class="wc-link">看統計' + icon('caret-right') + '</span></div>' +
    '<div class="wc-value num">' + money(wk.total) + '</div><div class="wc-bars">' +
    wk.days.map(d => '<div class="wc-col' + (d.today ? ' today' : '') + '"><i class="wc-bar" style="height:' + (d.v / top * 100).toFixed(1) + '%"></i><span class="wc-day">' + d.label + '</span></div>').join('') +
    '</div></button></div>';

  // 預算：一個大類一張卡
  if (cy) {
    const b = budgetOf(cy.id);
    const spent = spentByGroup(cy.id);
    // 固定支出在發薪日就付清了，每天看它只是雜訊；只有超支時才顯示
    const fg = fixedGroups();
    const groups = expenseGroups().filter(g => (b[g] || spent[g]) && (!fg[g] || (spent[g] || 0) > (b[g] || 0)));
    const un = unallocated(cy.id);
    h += '<div class="section"><div class="section-head"><h2>本期預算</h2><button class="link" type="button" id="budgetBtn">調整</button></div>';
    if (!Object.keys(b).length) {
      h += '<div class="card small muted">還沒有設定預算。記下薪資時會帶出預算分配，也可以按「調整」手動設定。</div>';
    } else {
      h += '<div class="budget-head" style="margin:0 4px 10px"><span>尚未分配</span><span class="num ' + (un < 0 ? 'warn' : '') + '">' + money(un) + '</span></div>';
    }
    groups.forEach(g => {
      const bud = b[g] || 0;
      const sp = spent[g] || 0;
      if (!bud) {
        h += '<div class="bcard"><div class="b-top"><span>' + esc(g) + '</span><span class="b-tag">未設定預算</span></div>' +
          '<div class="b-mid num"><span>已花</span><b>' + money(sp) + '</b></div></div>';
        return;
      }
      const over = sp > bud;
      const pct = sp / bud * 100;
      h += '<div class="bcard"><div class="b-top"><span>' + esc(g) + '</span>' +
        '<span class="b-tag num' + (over ? ' over' : '') + '">' + (over ? '超支 ' + money(sp - bud) : '已花 ' + Math.round(pct) + '%') + '</span></div>' +
        '<div class="b-mid num"><span>' + (over ? '' : '剩 ' + money(bud - sp)) + '</span><span><b>' + money(sp) + '</b> / ' + money(bud) + '</span></div>' +
        '<div class="bar' + (over ? ' over' : '') + '"><i style="width:' + Math.min(100, pct).toFixed(1) + '%"></i></div></div>';
    });
    h += '</div>';
  }

  // 最近紀錄
  // 依「記下的先後」排序，補記幾天前的帳也會出現在最上面，方便確認
  const entered = t => t.updated || t.created || t.time;
  const recent = S.txs.slice().sort((a, b) => entered(b) - entered(a)).slice(0, 5);
  h += '<div class="section"><div class="section-head"><h2>最近紀錄</h2><button class="link" type="button" id="moreBtn">全部</button></div><div class="list">' +
    (recent.length ? recent.map(txRow).join('') : '<div class="empty">還沒有紀錄<br>在上方輸入「午餐 150」試試看</div>') + '</div></div>';

  const v = $('#view');
  v.innerHTML = h;
  $('#quickForm').onsubmit = e => {
    e.preventDefault();
    const text = $('#quickInput').value.trim();
    if (!text) { $('#quickInput').focus(); return; }
    $('#quickInput').value = '';
    $('#quickInput').blur();
    const r = parseInput(text);
    if (!r.explicitDate) r.time = entryTime(r.time);
    openEntry(r);
  };
  $('#dayPill').onclick = openDayPicker;
  if ($('#backToday')) $('#backToday').onclick = () => { S.entryDay = null; render(); };

/** 本週（週一到週日）每天的變動支出，和統計頁預設一樣不含固定支出。 */
function weekSpend() {
  const mon = mondayOf(new Date());
  const todayKey = dayKey(new Date());
  const fg = fixedGroups();
  const days = WEEK_MON.map((w, i) => ({ k: dayKey(addDays(mon, i)), label: w, v: 0 }));
  S.txs.forEach(t => {
    const c = cat(t.categoryId);
    if (t.void || t.type !== '支出' || !c || c.kind !== '支出' || fg[c.group]) return;
    const d = days.find(x => x.k === dayKey(new Date(t.time)));
    if (d) d.v += t.amount;
  });
  days.forEach(d => { d.today = d.k === todayKey; });
  return { days, total: days.reduce((s, d) => s + d.v, 0) };
}

/* 待確認：iPhone 捷徑轉送的 LINE 付款／發票通知，還沒變成交易的。點「記帳」帶著金額與店家進記帳卡片 */
function parseNotice(text) {
  const m = text.match(/(?:NT\$|NTD|\$|新臺幣|新台幣)\s*([\d,]+)|([\d,]+)\s*元/i);
  const amount = m ? Number((m[1] || m[2]).replace(/,/g, '')) : '';
  const s = text.match(/(?:特約商店|消費店家|店家名稱|商店名稱|店家|商店|商家|於)\s*[:：]?\s*([^\n,，。:：]{2,24})/);
  return { amount, merchant: s ? s[1].trim() : '' };
}
function noticesHtml() {
  const list = S.data.notices || [];
  if (!list.length) return '';
  return '<div class="section"><div class="section-head"><h2>待確認</h2><span class="small">' + list.length + ' 筆 LINE 通知</span></div>' +
    list.map(n => {

/** 理財帳戶：有股數與股價就用市值，否則用投入成本。成本＝帳戶餘額（轉進去的減掉轉出來的）。 */
function holding(a) {
  const cost = S.data.balances[a.id] || 0;
  const priced = a.shares != null && a.price > 0;
  const value = priced ? Math.round(a.shares * a.price) : cost;
  // 對帳後又有轉入卻沒填股數（例如定期定額）：成本變多了但股數還沒更新，市值會被低估。有填股數的買進會自動加進持股
  const newBuy = priced && S.txs.some(t => t.to === a.id && !t.void && !(t.shares > 0) && (t.created || t.time) > (a.sharesAt || 0));
  return { cost, value, priced, pnl: value - cost, newBuy };
}

const investValue = () => S.data.accounts.filter(a => a.type === '理財').reduce((s, a) => s + holding(a).value, 0);
const signed = n => (n > 0 ? '+' : n < 0 ? '−' : '') + money(Math.abs(n));
const priceDay = d => d ? (Math.floor(d / 100) % 100) + '/' + (d % 100) : '';

/* ───────────── 快速輸入解析 ───────────── */

function parseInput(text) {
  let t = ' ' + text.replace(/\s+/g, ' ').trim() + ' ';
  const now = new Date();
  let day = null;
  let hm = null;

  const rel = [['大前天', -3], ['前天', -2], ['昨天', -1], ['昨晚', -1], ['今天', 0], ['今晚', 0]];
  for (const [w, n] of rel) if (t.includes(w)) { day = addDays(startOfDay(now), n); t = t.replace(w, ' '); break; }
  let m = t.match(/(\d{1,2}):(\d{2})/);
  if (m) { hm = [Number(m[1]), Number(m[2])]; t = t.replace(m[0], ' '); }
  m = t.match(/(\d{1,2})月(\d{1,2})[日號]?/) || t.match(/(?:^|\s)(\d{1,2})\/(\d{1,2})(?=\s)/);
  if (m) {
    day = new Date(now.getFullYear(), Number(m[1]) - 1, Number(m[2]));
    if (day - now > 864e5) day = new Date(now.getFullYear() - 1, Number(m[1]) - 1, Number(m[2]));
    t = t.replace(m[0], ' ');
  }
  m = t.match(/(上)?(?:週|星期|禮拜)([一二三四五六日天])/);
  if (m) {
    const wd = '日一二三四五六'.indexOf(m[2] === '天' ? '日' : m[2]);
    const today = now.getDay();
    let diff = (today - wd + 7) % 7;
    if (m[1]) diff = ((today + 6) % 7) + 7 - ((wd + 6) % 7);
    day = addDays(startOfDay(now), -diff);
    t = t.replace(m[0], ' ');
  }

  let amount = '';
  const nums = Array.from(t.matchAll(/(\d[\d,]*(?:\.\d+)?)\s*(?:元|塊)?/g));
  if (nums.length) {
    const last = nums[nums.length - 1];
    amount = Math.round(Number(last[1].replace(/,/g, '')));
    t = t.slice(0, last.index) + ' ' + t.slice(last.index + last[0].length);
  }

  let accountId = '';
  let method = '';
  const accs = activeAccounts().slice().sort((a, b) => b.name.length - a.name.length);
  for (const a of accs) {
    if (a.name.length >= 2 && t.includes(a.name)) { accountId = a.id; t = t.replace(a.name, ' '); break; }
  }
  let tokens = t.trim().split(' ').filter(Boolean);
  if (!accountId) {
    const words = { '刷卡': '信用卡', '信用卡': '信用卡', '卡': '信用卡', '現金': '現金', '扣款': '銀行', '轉帳': '銀行' };
    const i = tokens.findIndex(x => words[x]);
    if (i >= 0) { method = words[tokens[i]]; tokens.splice(i, 1); }
  }

  let time = now.getTime();
  if (day || hm) {
    const d = day || startOfDay(now);
    const [hh, mm] = hm || [now.getHours(), now.getMinutes()];
    time = new Date(d.getFullYear(), d.getMonth(), d.getDate(), hh, mm).getTime();
  }

  const allGroups = groupsOf(null);
  let hint = null;
  if (tokens.length && allGroups.includes(tokens[0])) hint = tokens[0];
  const body = hint ? tokens.slice(1) : tokens;
  const bodyText = body.join(' ');
  const keyword = tokens.join(' ');

  const kws = S.data.keywords;
  let k = kws.find(x => x.keyword === keyword) || (bodyText && kws.find(x => x.keyword === bodyText));
  if (!k) for (const tok of body) { k = kws.find(x => x.keyword === tok); if (k) break; }
  if (!k && bodyText) k = kws.filter(x => x.keyword.length >= 2 && bodyText.includes(x.keyword)).sort((a, b) => b.keyword.length - a.keyword.length)[0];
  let c = k ? cat(k.categoryId) : null;
  if (c && c.disabled) c = null;
  if (!c && bodyText) c = activeCats(null).find(x => x.name.length >= 2 && x.name !== '其他' && bodyText.includes(x.name));
  if (hint && (!c || c.group !== hint)) {
    const inGroup = activeCats(null).filter(x => x.group === hint);
    c = (c && inGroup.find(x => x.name === c.name)) || inGroup[0];
  }
  if (!accountId && k && k.accountId && acc(k.accountId) && !acc(k.accountId).disabled) accountId = k.accountId;
  if (!accountId && method) {
    const list = activeAccounts(method);
    const last = acc(S.pref.lastFrom);
    accountId = (last && last.type === method && !last.disabled ? last : list[0] || {}).id || '';
  }

  const type = !c ? '支出' : c.kind === '收入' ? '收入' : c.kind === '支出' ? '支出' : '轉帳';
  return {
    type, amount, time, keyword, explicitDate: !!(day || hm),
    note: bodyText || keyword,
    categoryId: c ? c.id : '',
    from: type === '收入' ? '' : accountId,
    to: type === '收入' ? accountId : '',
    unmatched: !c && !!bodyText
  };
}

function openSheet(html, handler) {

function closeSheet() {

  $('#backdrop').classList.remove('show');

function busy(btn, on) {
  if (!btn) return;
  btn.disabled = on;
  if (on) { btn.dataset.label = btn.textContent; btn.textContent = '處理中…'; }
  else if (btn.dataset.label) btn.textContent = btn.dataset.label;
